<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bits & Bytes Tecnology</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Segoe UI', Arial, sans-serif;
  background: linear-gradient(135deg, #0f172a, #1e293b);
  color: #fff;
}

/* Nome da empresa no topo */
.logo {
  position: absolute;
  top: 20px;
  left: 30px;
  font-size: 22px;
  font-weight: bold;
}

/* Card central */
.container {
  background: rgba(255, 255, 255, 0.96);
  color: #111;
  border-radius: 18px;
  padding: 30px;
  width: 350px;
  margin: auto;
  margin-top: 80px;
  box-shadow: 0 15px 40px rgba(0,0,0,0.4);
  animation: fadeIn 0.5s ease;
}

h2 {
  text-align: center;
  margin-bottom: 5px;
}

.subtitulo {
  text-align: center;
  font-size: 14px;
  color: #555;
  margin-bottom: 20px;
}

/* Inputs */
input, textarea {
  width: 100%;
  padding: 12px;
  margin-bottom: 10px;
  border-radius: 10px;
  border: 1px solid #ccc;
  outline: none;
  transition: 0.2s;
  font-size: 14px;
}

input:focus, textarea:focus {
  border-color: #2563eb;
}

/* Botão */
button {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 12px;
  background: linear-gradient(90deg, #2563eb, #1d4ed8);
  color: white;
  font-weight: bold;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  transform: scale(1.03);
  opacity: 0.9;
}

/* Mensagem de status */
#msg {
  text-align: center;
  margin-top: 10px;
  font-weight: bold;
  color: green;
}

/* Rodapé */
footer {
  text-align: center;
  margin-top: 15px;
  font-size: 12px;
  color: #777;
}

footer span {
  display: block;
  font-size: 11px;
  margin-top: 5px;
  color: #999;
}

/* Animação */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px);}
  to { opacity: 1; transform: translateY(0);}
}
</style>

</head>
<body>

<div class="logo">Bits & Bytes Tecnology</div>

<div class="container">
  <h2>Abrir Chamado Técnico</h2>

  <div class="subtitulo">
    Registre seu chamado e acompanhe o atendimento em tempo real
  </div>

  <form id="formChamado">

    <input type="text" name="cliente" placeholder="Nome completo" required>

    <input type="text" name="telefone" placeholder="Telefone" required>

    <input type="text" name="cpfcnpj" placeholder="CPF ou CNPJ" required>

    <input type="text" name="equipamento" placeholder="Equipamento" required>

    <textarea name="problema" rows="4" placeholder="Descreva o problema" required></textarea>

    <button type="submit">Abrir Chamado</button>
  </form>

  <div id="msg"></div>

  <footer>
    <p>Bits & Bytes Tecnology © 2026</p>
    <span>Soluções inteligentes em assistência técnica</span>
    <span class="footer-mini">Sistema desenvolvido por Bits & Bytes Tecnology</span>
  </footer>
</div>

<script>
document.getElementById("formChamado").addEventListener("submit", async (e) => {
  e.preventDefault();

  const form = e.target;

  const data = {
    cliente: form.cliente.value,
    telefone: form.telefone.value,
    cpfcnpj: form.cpfcnpj.value,
    equipamento: form.equipamento.value,
    problema: form.problema.value
  };

  try {
    const res = await fetch("/abrir-chamado", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(data)
    });

    const json = await res.json();

    if (json.ok) {
      document.getElementById("msg").innerText = "Chamado aberto com sucesso!";
      form.reset();
    } else {
      document.getElementById("msg").innerText = "Erro ao abrir chamado.";
    }

  } catch (err) {
    document.getElementById("msg").innerText = "Erro de conexão.";
  }
});
</script>

</body>
</html>
