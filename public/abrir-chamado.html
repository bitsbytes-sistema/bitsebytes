<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bits & Bytes Tecnology</title>

<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family:'Segoe UI', Arial;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:#fff;
}

.logo {
  position:absolute;
  top:20px;
  left:30px;
  font-size:22px;
  font-weight:bold;
}

.container {
  background:rgba(255,255,255,0.96);
  color:#111;
  border-radius:18px;
  padding:30px;
  width:350px;
  margin:auto;
  margin-top:80px;
  box-shadow:0 15px 40px rgba(0,0,0,0.4);
}

h2 { text-align:center; margin-bottom:5px; }

.subtitulo {
  text-align:center;
  font-size:14px;
  color:#555;
  margin-bottom:20px;
}

input, textarea {
  width:100%;
  padding:12px;
  margin-bottom:10px;
  border-radius:10px;
  border:1px solid #ccc;
}

button {
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:linear-gradient(90deg,#2563eb,#1d4ed8);
  color:white;
  font-weight:bold;
  cursor:pointer;
}

/* ALERTA BONITO */
.alerta {
  display:none;
  padding:12px;
  border-radius:10px;
  margin-bottom:10px;
  font-size:14px;
}

.alerta.erro {
  background:#fee2e2;
  color:#b91c1c;
}

.alerta.sucesso {
  background:#dcfce7;
  color:#166534;
}
</style>
</head>

<body>

<div class="logo">Bits & Bytes Tecnology</div>

<div class="container">
  <h2>Abrir Chamado Técnico</h2>

  <div class="subtitulo">
    Registre seu chamado e acompanhe o atendimento
  </div>

  <div id="alerta" class="alerta"></div>

  <form id="formChamado">

    <input type="text" name="cliente" placeholder="Nome completo" required>
    <input type="text" name="telefone" placeholder="Telefone" required>
    <input type="text" name="cpfcnpj" placeholder="CPF ou CNPJ" required>
    <input type="text" name="equipamento" placeholder="Equipamento" required>
    <textarea name="problema" rows="4" placeholder="Descreva o problema" required></textarea>

    <button type="submit">Abrir Chamado</button>

  </form>

</div>

<script>
const form = document.getElementById("formChamado");
const alerta = document.getElementById("alerta");

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  alerta.style.display = "none";

  const data = {
    cliente: form.cliente.value,
    telefone: form.telefone.value,
    cpfcnpj: form.cpfcnpj.value,
    equipamento: form.equipamento.value,
    problema: form.problema.value
  };

  try {
    const res = await fetch("/abrir-chamado", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(data)
    });

    const json = await res.json();

    if (!res.ok) {
      alerta.className = "alerta erro";
      alerta.innerText = json.error || "Erro ao abrir chamado";
      alerta.style.display = "block";
      return;
    }

    alerta.className = "alerta sucesso";
    alerta.innerText = "Chamado aberto com sucesso!";
    alerta.style.display = "block";

    form.reset();

  } catch (err) {
    alerta.className = "alerta erro";
    alerta.innerText = "Erro de conexão com o servidor";
    alerta.style.display = "block";
  }
});
</script>

</body>
</html>
