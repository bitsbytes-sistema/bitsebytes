<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0f172a">

<title>Bits & Bytes Tecnology</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Segoe UI',Arial,sans-serif;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:#fff;
}

.logo{
  position:absolute;
  top:20px;
  left:30px;
  font-size:22px;
  font-weight:bold;
}

.container{
  background:rgba(255,255,255,0.96);
  color:#111;
  border-radius:18px;
  padding:30px;
  width:350px;
  margin:auto;
  margin-top:80px;
  box-shadow:0 15px 40px rgba(0,0,0,0.4);
  animation:fadeIn 0.5s ease;
}

h2{
  text-align:center;
}

.subtitulo{
  text-align:center;
  font-size:14px;
  color:#555;
  margin-bottom:20px;
}

input,textarea{
  width:100%;
  padding:12px;
  margin-bottom:10px;
  border-radius:10px;
  border:1px solid #ccc;
}

input:focus,
textarea:focus{
  border-color:#2563eb;
  outline:none;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:linear-gradient(90deg,#2563eb,#1d4ed8);
  color:white;
  font-weight:bold;
  cursor:pointer;
  transition:0.2s;
}

button:hover{
  transform:scale(1.03);
}

.alerta{
  display:none;
  padding:12px;
  border-radius:10px;
  margin-bottom:10px;
  font-size:14px;
}

.alerta.erro{
  background:#fee2e2;
  color:#b91c1c;
}

.alerta.sucesso{
  background:#dcfce7;
  color:#166534;
}

footer{
  text-align:center;
  margin-top:15px;
  font-size:12px;
  color:#777;
}

footer span{
  display:block;
  font-size:11px;
  margin-top:5px;
  color:#999;
}

.footer-mini{
  font-size:8px;
  opacity:0.6;
}

@keyframes fadeIn{
  from{
    opacity:0;
    transform:translateY(10px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}
</style>
</head>

<body>

<div class="logo">
  Bits & Bytes Tecnology
</div>

<div class="container">

  <h2>
    Abrir Chamado Técnico
  </h2>

  <div class="subtitulo">
    Registre seu chamado e acompanhe o atendimento em tempo real
  </div>

  <div id="alerta" class="alerta"></div>

  <form id="formChamado">

    <input
      type="text"
      name="cliente"
      placeholder="Nome completo ou Nome da empresa"
      required
    >

    <input
      type="text"
      name="telefone"
      placeholder="Telefone WhatsApp de Preferência"
      required
    >

    <input
      type="text"
      name="cpfcnpj"
      placeholder="Cpf ou Cnpj"
      required
    >

    <input
      type="text"
      name="equipamento"
      placeholder="Equipamento"
      required
    >

    <textarea
      name="problema"
      rows="4"
      placeholder="Descreva o Problema"
      required
    ></textarea>

    <button type="submit">
      Abrir Chamado
    </button>

  </form>

  <footer>
    <p>
      Bits & Bytes Tecnology © 2026
    </p>

    <span>
      Soluções inteligentes em assistência técnica
    </span>

    <span class="footer-mini">
      Sistema desenvolvido por Bits & Bytes Tecnology Sistemas
    </span>
  </footer>

</div>

<script>

const form =
  document.getElementById(
    "formChamado"
  );

const alerta =
  document.getElementById(
    "alerta"
  );

form.addEventListener(
  "submit",
  async (e) => {

    e.preventDefault();

    alerta.style.display =
      "none";

    const data = {

      cliente:
        form.cliente.value.trim(),

      telefone:
        form.telefone.value.trim(),

      cpfcnpj:
        form.cpfcnpj.value.trim(),

      equipamento:
        form.equipamento.value.trim(),

      problema:
        form.problema.value.trim()

    };

    if(
      !data.cliente ||
      !data.telefone ||
      !data.cpfcnpj ||
      !data.equipamento ||
      !data.problema
    ){

      alerta.className =
        "alerta erro";

      alerta.innerText =
        "Preencha todos os campos";

      alerta.style.display =
        "block";

      return;

    }

    try{

      const res =
        await fetch(
          "/abrir-chamado",
          {

            method:"POST",

            headers:{
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify(data)

          }
        );

      const json =
        await res.json();

      if(!res.ok){

        alerta.className =
          "alerta erro";

        alerta.innerText =
          json.error ||
          "Erro ao abrir chamado";

        alerta.style.display =
          "block";

        return;

      }

      const whatsappLink =
        json.whatsapp || "#";

      alerta.className =
        "alerta sucesso";

      alerta.innerHTML = `
        <strong>
          Chamado aberto com sucesso!
        </strong>

        <br><br>

        <a
          href="${whatsappLink}"
          target="_blank"
          style="
            display:inline-block;
            background:#25d366;
            color:#fff;
            padding:12px 18px;
            border-radius:10px;
            text-decoration:none;
            font-weight:bold;
          "
        >
          Receber confirmação no WhatsApp
        </a>
      `;

      alerta.style.display =
        "block";

      form.reset();

    }catch(err){

      alerta.className =
        "alerta erro";

      alerta.innerText =
        "Erro de conexão com o servidor";

      alerta.style.display =
        "block";

    }

  }
);

</script>

<!-- ONESIGNAL -->
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>

<script>

window.OneSignalDeferred = window.OneSignalDeferred || [];

OneSignalDeferred.push(async function(OneSignal){

    console.log("OneSignal iniciando...");

    await OneSignal.init({

        appId: "6711c89e-0dc5-48c3-b31a-b70f6c64902d",

        notifyButton:{
            enable:true
        }

    });


    console.log("OneSignal inicializado");


    const permission =
        OneSignal.Notifications.permission;


    console.log(
        "Permissão atual:",
        permission
    );


    if(!permission){

        console.log(
            "Solicitando permissão..."
        );


        await OneSignal.Notifications.requestPermission();

    }


});

</script>

</body>
</html>
