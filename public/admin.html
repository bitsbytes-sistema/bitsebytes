<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel Master</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial;
}

body{
  background:#0f172a;
  color:white;
}

.header{
  background:#111827;
  padding:20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:22px;
  font-weight:bold;
}

.menu a{
  color:white;
  text-decoration:none;
  margin-left:15px;
}

.container{
  padding:20px;
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
  margin-bottom:30px;
}

.card{
  background:#1e293b;
  padding:25px;
  border-radius:14px;
  box-shadow:0 5px 20px rgba(0,0,0,0.3);
}

.card h2{
  font-size:32px;
  margin-bottom:10px;
}

.card p{
  color:#cbd5e1;
}

.table{
  width:100%;
  border-collapse:collapse;
  background:#1e293b;
  border-radius:12px;
  overflow:hidden;
}

.table th{
  background:#111827;
  padding:15px;
  text-align:left;
}

.table td{
  padding:15px;
  border-top:1px solid #334155;
}

.badge{
  padding:6px 10px;
  border-radius:8px;
  font-size:12px;
  font-weight:bold;
}

.free{
  background:#991b1b;
}

.basic{
  background:#92400e;
}

.pro{
  background:#065f46;
}

button{
  border:none;
  padding:8px 12px;
  border-radius:8px;
  cursor:pointer;
  color:white;
  font-weight:bold;
}

.btnFree{
  background:#dc2626;
}

.btnBasic{
  background:#ea580c;
}

.btnPro{
  background:#16a34a;
}

.form-box{
  background:#1e293b;
  padding:25px;
  border-radius:14px;
  margin-bottom:30px;
  box-shadow:0 5px 20px rgba(0,0,0,0.3);
}

.form-box h2{
  margin-bottom:20px;
}

input,
select{
  width:100%;
  padding:12px;
  margin-bottom:15px;
  border:none;
  border-radius:10px;
  background:#0f172a;
  color:white;
}

.btnCriar{
  background:#2563eb;
  width:100%;
  padding:14px;
  font-size:15px;
}

.btnCriar:hover{
  opacity:0.9;
}

.usuario{
  background:#0f172a;
  padding:12px;
  border-radius:10px;
  margin-top:10px;
}

</style>
</head>

<body>

<div class="header">

  <div class="logo">
    Painel Master
  </div>

  <div class="menu">

    <a href="/dashboard">
      Dashboard
    </a>

    <a href="/logout">
      Sair
    </a>

  </div>

</div>

<div class="container">

  <div class="cards">

    <div class="card">
      <h2 id="empresas">0</h2>
      <p>Empresas</p>
    </div>

    <div class="card">
      <h2 id="usuarios">0</h2>
      <p>Usuários</p>
    </div>

    <div class="card">
      <h2 id="tickets">0</h2>
      <p>Chamados</p>
    </div>

  </div>

  <!-- CRIAR EMPRESA -->

  <div class="form-box">

    <h2>
      Criar Empresa + Usuário
    </h2>

    <input
      type="text"
      id="empresa"
      placeholder="Nome da empresa"
    >

    <input
      type="text"
      id="username"
      placeholder="Usuário"
    >

    <input
      type="password"
      id="password"
      placeholder="Senha"
    >

    <select id="plan">

      <option value="free">
        Free
      </option>

      <option value="basic">
        Basic
      </option>

      <option value="pro">
        Pro
      </option>

    </select>

    <button
      class="btnCriar"
      onclick="criarEmpresa()"
    >
      Criar Empresa
    </button>

  </div>

  <h2 style="margin-bottom:20px;">
    Empresas
  </h2>

  <table class="table">

    <thead>

    <tr>
      <th>Empresa</th>
      <th>Plano</th>
      <th>Status</th>
      <th>Limite Chamados</th>
      <th>Limite Usuários</th>
      <th>Ações</th>
    </tr>

    </thead>

    <tbody id="listaEmpresas">

    </tbody>

  </table>

  <br><br>

  <div class="form-box">

    <h2>
      Usuários do Sistema
    </h2>

    <div id="listaUsuarios">

    </div>

  </div>

</div>

<script>

async function load(){

  const res =
    await fetch(
      "/api/admin/stats",
      {
        credentials:"include"
      }
    );

  const data =
    await res.json();

  document
  .getElementById("empresas")
  .innerText =
    data.empresas || 0;

  document
  .getElementById("usuarios")
  .innerText =
    data.usuarios || 0;

  document
  .getElementById("tickets")
  .innerText =
    data.chamados || 0;

  const lista =
    document.getElementById(
      "listaEmpresas"
    );

  lista.innerHTML = "";

  (data.companies || []).forEach(c => {

    lista.innerHTML += `

    <tr>

      <td>
        ${c.name || "Sem nome"}
      </td>

      <td>

        <span class="badge ${c.plan}">
          ${c.plan}
        </span>

      </td>

<td>
  ${c.active
    ? "🟢 Ativa"
    : "🔴 Bloqueada"}
</td>

      <td>
  ${c.ticketLimit === -1
      ? "Ilimitado"
      : c.ticketLimit}
</td>

<td>
  ${c.userLimit === -1
      ? "Ilimitado"
      : c.userLimit}
</td>

      <td>

        <button
          class="btnFree"
          onclick="alterarPlano(
            '${c._id}',
            'free'
          )"
        >
          Free
        </button>

        <button
          class="btnBasic"
          onclick="alterarPlano(
            '${c._id}',
            'basic'
          )"
        >
          Basic
        </button>

        <button
          class="btnPro"
          onclick="alterarPlano(
            '${c._id}',
            'pro'
          )"
        >
          Pro
        </button>

      </td>

    </tr>

    `;

  });

  carregarUsuarios();

}

async function alterarPlano(
  id,
  plan
){

  await fetch(

    "/api/admin/company/" + id + "/plan",

    {

      method:"PUT",

      headers:{
        "Content-Type":
          "application/json"
      },

      credentials:"include",

      body: JSON.stringify({
        plan
      })

    }

  );

  load();

}

/* ===================== */
/* CRIAR EMPRESA */
/* ===================== */

async function criarEmpresa(){

  const name =
    document
    .getElementById("empresa")
    .value
    .trim();

  const username =
    document
    .getElementById("username")
    .value
    .trim();

  const password =
    document
    .getElementById("password")
    .value
    .trim();

  const plan =
    document
    .getElementById("plan")
    .value;

  if(
    !name ||
    !username ||
    !password
  ){
    alert(
      "Preencha todos os campos"
    );
    return;
  }

  const res =
    await fetch(
      "/api/admin/create-company",
      {

        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        credentials:"include",

        body: JSON.stringify({

          name,
          username,
          password,
          plan

        })

      }
    );

  const data =
    await res.json();

  if(!res.ok){

    alert(
      data.error ||
      "Erro ao criar"
    );

    return;

  }

  alert(
    "Empresa criada com sucesso!"
  );

  document
  .getElementById("empresa")
  .value = "";

  document
  .getElementById("username")
  .value = "";

  document
  .getElementById("password")
  .value = "";

  load();

}

/* ===================== */
/* LISTAR USERS */
/* ===================== */

async function carregarUsuarios(){

  const res =
    await fetch(
      "/api/admin/users",
      {
        credentials:"include"
      }
    );

  const usuarios =
    await res.json();

  const div =
    document.getElementById(
      "listaUsuarios"
    );

  div.innerHTML = "";

  usuarios.forEach(u => {

    div.innerHTML += `

    <div class="usuario">

      👤 ${u.username}

      <br>

      🏢 ${u.companyName || "Sem empresa"}

      <br>

      🔐 ${u.role}

    </div>

    `;

  });

}

load();

</script>

</body>
</html>
