  display:block;

  margin-top:5px;

}


.red{

  border-left:5px solid red;

}

}


.orange{

  border-left:5px solid orange;

}

}


/* ================= INPUT ================= */


input{

  padding:10px;

  padding:10px 15px;

  border:none;

  border-radius:6px;

  background:#16a34a;

  color:white;

}



button:hover{

  opacity:.85;

}

h3{

 color:#0f172a;

<div class="container">

<h3>
📋 Criar Chamado
</h3>


<input id="cpfcnpj" placeholder="CPF/CNPJ">

<input id="cliente" placeholder="Cliente">

<input id="telefone" placeholder="Telefone">

<input id="equipamento" placeholder="Equipamento">

<input id="problema" placeholder="Problema">


<br><br>


<button onclick="criar()">
Criar Chamado
</button>

<input
  id="busca"
  placeholder="🔍 Buscar cliente, telefone, equipamento ou OS..."
  onkeyup="filtrarChamados()"
  style="width:320px;padding:10px;margin:10px 5px 10px 0;border:1px solid #cbd5e1;border-radius:6px;"
>

<select
  id="filtroStatus"
  onchange="filtrarChamados()"
  style="padding:10px;border:1px solid #cbd5e1;border-radius:6px;"
>
  <option value="">Todos</option>
  <option value="aberto">🔴 Abertos</option>
  <option value="andamento">🟡 Em andamento</option>
  <option value="reparo">🟠 Em reparo</option>
  <option value="finalizado">🟢 Finalizados</option>
</select>

</div>



<h3>
Resumo
</h3>


<div id="stats" class="stats-grid"></div>



<h3>
Chamados
</h3>


<div id="lista"></div>

<script>

const stats = document.getElementById("stats");
const lista = document.getElementById("lista");

// ===================== USUÁRIO =====================

async function carregarUsuario(){

  const res = await fetch("/me", {
    credentials:"include"
  });


  if(res.status === 401){

    window.location.href="/";

    return;

  }


  const data = await res.json();


  document.getElementById("nomeUsuario").innerText =
    data.user?.username || "Usuário";


  document.getElementById("cargoUsuario").innerText =
    data.user?.role || "Usuário";

}

let chamados = [];

// ===================== PREENCHER CLIENTE =====================

function preencherCliente(){

  const params = new URLSearchParams(
    window.location.search
  );


  const cliente = params.get("cliente");
  const telefone = params.get("telefone");
  const cpfcnpj = params.get("cpfcnpj");


  if(cliente){

    document.getElementById("cliente").value = cliente;

  }


  if(telefone){

    document.getElementById("telefone").value = telefone;

  }


  if(cpfcnpj){

    document.getElementById("cpfcnpj").value = cpfcnpj;

  }

}

function renderChamados(listaChamados){

    lista.innerHTML = "";

    listaChamados.forEach(c => {

        const dataAbertura =
            c.createdAt
            ? new Date(c.createdAt).toLocaleString("pt-BR", {
                timeZone: "America/Cuiaba"
            })
            : "Sem data";

        lista.innerHTML += `

        <div class="card">

          <b>${c.cliente || ""}</b>

          <br><br>

          📱 ${c.telefone || ""}<br>
          📄 ${c.cpfcnpj || ""}<br>
          💻 ${c.equipamento || ""}<br>
          🛠 ${c.problema || ""}

          <br><br>

          📅 ${dataAbertura}

          <br><br>

          📌 <b style="
            color:${
              c.status === "aberto"
              ? "red"
              : c.status === "andamento"
              ? "orange"
              : c.status === "reparo"
              ? "#d97706"
              : "green"
            }
          ">
            ${String(c.status).toUpperCase()}
          </b>

          <br><br>

          <button onclick="status('${c._id}')">
            Status
          </button>

          ${
            c.status === "finalizado"
            ? `<button onclick="abrirLaudo('${c._id}')">
                Laudo
              </button>`
            : ""
          }

          <button onclick="del('${c._id}')">
            Excluir
          </button>

        </div>

        `;

    });

}

// ===================== FILTRO =====================

function filtrarChamados(){

  const texto =
    document.getElementById("busca")
    .value
    .toLowerCase();


  const status =
    document.getElementById("filtroStatus")
    .value;


  const filtrados =
    chamados.filter(c => {


      const procura =
        (
          (c.cliente || "") +
          (c.telefone || "") +
          (c.equipamento || "") +
          (c.cpfcnpj || "") +
          (c._id || "")
        )
        .toLowerCase();


      const encontrouTexto =
        procura.includes(texto);


      const encontrouStatus =
        !status ||
        c.status === status;


      return encontrouTexto && encontrouStatus;


    });


  renderChamados(filtrados);

}

/* ===================== LOAD ===================== */

async function load(){

  try {

    const res = await fetch("/api/tickets", {
      credentials:"include"
    });

    console.log("STATUS /api/tickets =", res.status);

    if(res.status === 401){
      alert("Sessão perdida");
      window.location.href="/";
      return;
    }

    chamados = await res.json();

    renderChamados(chamados);


    loadStats();


  } catch(err){

    console.log(err);
    alert("Erro ao carregar chamados");

  }

}



/* ===================== STATS ===================== */

function loadStats(){

  const aberto =
    chamados.filter(x => x.status === "aberto").length;


  const andamento =
    chamados.filter(x => x.status === "andamento").length;


  const reparo =
    chamados.filter(x => x.status === "reparo").length;


  const finalizado =
    chamados.filter(x => x.status === "finalizado").length;



  stats.innerHTML = `


    <div class="stat-card red">

      <h2>${aberto}</h2>

      <small>Abertos</small>

    </div>



    <div class="stat-card yellow">

      <h2>${andamento}</h2>

      <small>Andamento</small>

    </div>



    <div class="stat-card orange">

      <h2>${reparo}</h2>

      <small>Reparo</small>

    </div>



    <div class="stat-card green">

      <h2>${finalizado}</h2>

      <small>Finalizados</small>

    </div>


  `;


}



/* ===================== CRIAR ===================== */

async function criar(){


  const cliente =
    document.getElementById("cliente").value.trim();


  const telefone =
    document.getElementById("telefone").value.trim();


  const cpfcnpj =
    document.getElementById("cpfcnpj").value.trim();


  const equipamento =
    document.getElementById("equipamento").value.trim();


  const problema =
    document.getElementById("problema").value.trim();



  if(!cliente || !telefone || !equipamento || !problema){

    alert("Preencha todos os campos");

    return;

  }



  await fetch("/api/tickets", {

    method:"POST",

    headers:{
      "Content-Type":"application/json"
    },

    credentials:"include",

    body:JSON.stringify({

      cliente,
      telefone,
      cpfcnpj,
      equipamento,
      problema

    })

  });



  document.getElementById("cliente").value="";
  document.getElementById("telefone").value="";
  document.getElementById("cpfcnpj").value="";
  document.getElementById("equipamento").value="";
  document.getElementById("problema").value="";


  load();

}



/* ===================== STATUS ===================== */

async function status(id){


  const t =
    chamados.find(x => x._id === id);


  if(!t) return;



  let novo="aberto";


  if(t.status==="aberto")
    novo="andamento";


  else if(t.status==="andamento")
    novo="reparo";


  else if(t.status==="reparo")
    novo="finalizado";


  else if(t.status==="finalizado")
    novo="aberto";



  const res = await fetch("/api/tickets/"+id,{

    method:"PUT",

    headers:{
      "Content-Type":"application/json"
    },

    credentials:"include",

    body:JSON.stringify({
      status:novo
    })

  });



  const data = await res.json();



  if(data.whatsapp){

    window.open(data.whatsapp,"_blank");

  }



  load();

}



/* ===================== LAUDO ===================== */

function abrirLaudo(id){

  window.location.href =
    "/laudo.html?id=" + id;

}



/* ===================== DELETE ===================== */

async function del(id){


  if(!confirm("Deseja excluir?"))
    return;



  await fetch("/api/tickets/"+id,{

    method:"DELETE",

    credentials:"include"

  });



  load();

}



/* ===================== LOGOUT ===================== */

async function logout(){

  await fetch("/logout",{
    credentials:"include"
  });


  window.location.href="/";

}



/* ===================== INIT ===================== */

carregarUsuario();

preencherCliente();

load();


</script>
