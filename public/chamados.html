<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>Bits & Bytes - Chamados</title>


<style>

*{
  box-sizing:border-box;
}


body{

  margin:0;
  font-family:Arial;
  background:#f2f2f2;

}


/* ================= SIDEBAR ================= */

.sidebar{

  width:250px;

  background:#0f172a;

  min-height:100vh;

  color:white;

  position:fixed;

  left:0;

  top:0;

}


.logo{

  padding:20px;

  display:flex;

  gap:10px;

  align-items:center;

  border-bottom:1px solid rgba(255,255,255,.1);

}


.sidebar a{

  display:block;

  color:white;

  text-decoration:none;

  padding:14px 20px;

}


.sidebar a:hover{

  background:#1e293b;

}



.usuario{

  position:absolute;

  bottom:20px;

  left:20px;

}



/* ================= MAIN ================= */


.main{

  margin-left:250px;

  width:calc(100% - 250px);

  min-height:100vh;

}



/* ================= TOPBAR ================= */


.topbar{

  background:white;

  height:70px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:0 30px;

  box-shadow:0 2px 10px rgba(0,0,0,.08);

}



.topbar a{

  color:#dc2626;

  text-decoration:none;

  font-weight:bold;

}



/* ================= CONTAINER ================= */


.container{

  padding:20px;

}



/* ================= CARDS ================= */


.card{

  background:white;

  padding:20px;

  border-radius:10px;

  box-shadow:0 2px 8px rgba(0,0,0,.08);

  margin-bottom:15px;

}

/* ================= TABELA CHAMADOS ================= */

#tabelaChamados{

width:100%;

border-collapse:collapse;

margin-top:15px;

background:white;

}

#tabelaChamados th{

background:#0f172a;

color:white;

padding:12px;

text-align:left;

}

#tabelaChamados td{

padding:12px;

border-bottom:1px solid #eee;

vertical-align:middle;

}

#tabelaChamados tr:hover{

background:#f8fafc;

}

.status-aberto{

color:red;

font-weight:bold;

}

.status-andamento{

color:#ca8a04;

font-weight:bold;

}

.status-reparo{

color:#ea580c;

font-weight:bold;

}

.status-finalizado{

color:green;

font-weight:bold;

}

/* BADGES */

.badge{

display:inline-block;

padding:6px 12px;

border-radius:20px;

font-size:12px;

font-weight:bold;

color:white;

text-transform:uppercase;

}

.badge.status-aberto{

background:#dc2626;

}

.badge.status-andamento{

background:#eab308;

color:#111827;

}

.badge.status-reparo{

background:#f97316;

}

.badge.status-finalizado{

background:#16a34a;

}

/* ================= STATS CHAMADOS ================= */

.stats-grid{

  display:grid;

  grid-template-columns:repeat(4,1fr);

  gap:15px;

  margin-bottom:20px;

}


.stat-card{

  background:white;

  padding:20px;

  border-radius:10px;

  box-shadow:0 2px 8px rgba(0,0,0,.08);

  text-align:center;

  font-weight:bold;

}


.stat-card h2{

  margin:0;

  font-size:28px;

}


.stat-card small{

  display:block;

  margin-top:5px;

  color:#666;

}


.red{

  border-left:5px solid red;

}


.yellow{

  border-left:5px solid #facc15;

}


.orange{

  border-left:5px solid orange;

}


.green{

  border-left:5px solid #22c55e;

}

/* BARRA DE FILTROS */

.filtros{

  display:flex;
  gap:10px;
  align-items:center;
  margin:20px 0;
  flex-wrap:wrap;

}

.filtros input{

  flex:1;
  min-width:280px;

  padding:10px;

  border:1px solid #cbd5e1;

  border-radius:6px;

}

.filtros select{

  padding:10px;

  border:1px solid #cbd5e1;

  border-radius:6px;

  min-width:180px;

}

/* ================= INPUT ================= */


input{

  padding:10px;

  margin:3px;

  border-radius:6px;

  border:1px solid #cbd5e1;

}

#observacoes{

  display:block;

  margin-left:5px;

  width:calc(100% - 10px) !important;

}

/* ================= BUTTON ================= */


button{

  padding:10px 15px;

  border:none;

  border-radius:6px;

  cursor:pointer;

  background:#16a34a;

  color:white;

}



button:hover{

  opacity:.85;

}



/* TITULOS */


h3{

 color:#0f172a;

}

/* ================= AUTOCOMPLETE CLIENTE ================= */

.autocomplete-box{

  position:absolute;
  width:250px;
  max-height:200px;
  overflow-y:auto;
  z-index:999;

  background:white;

  border:none;
  box-shadow:none;

  border-radius:6px;

}

.autocomplete-item{

  padding:10px;
  cursor:pointer;
  border-bottom:1px solid #eee;

}


.autocomplete-item:hover{

  background:#f1f5f9;

}

</style>


</head>


<body>



<!-- SIDEBAR -->

<div class="sidebar">


<div class="logo">

<img src="/logo.png" width="45">


<div>

<br>

<small>Tecnology</small>

</div>


</div>



<a href="/dashboard.html">
🏠 Dashboard

</a>

<a href="#">

</a>

⚙️ Configurações
</a>




<div class="usuario">


<b id="nomeUsuario">
Carregando...
</b>

<br>

<small id="cargoUsuario">
Usuário
</small>


</div>



</div>




<!-- MAIN -->

<div class="main">



<div class="topbar">


<div>
📋 Chamados
</div>



<a href="javascript:void(0)" onclick="logout()">
Sair
</a>



</div>



<div class="container">


<div class="card">

<h3>
📋 Criar Chamado
</h3>


<div style="position:relative;display:inline-block">

<input id="cpfcnpj" 
placeholder="CPF/CNPJ"
oninput="buscarCliente('cpfcnpj')">

<div id="listaCpfcnpj" class="autocomplete-box"></div>

</div>


<div style="position:relative;display:inline-block">

<input id="cliente" 
placeholder="Cliente"
oninput="buscarCliente('cliente')">

<div id="listaCliente" class="autocomplete-box"></div>

</div>


<div style="position:relative;display:inline-block">

<input id="telefone" 
placeholder="Telefone"
oninput="buscarCliente('telefone')">

<div id="listaTelefone" class="autocomplete-box"></div>

</div>

<input id="equipamento" placeholder="Equipamento">

<input id="problema" placeholder="Problema">

<textarea 
id="observacoes"
placeholder="Observações da Entrada"
style="
width:100%;
height:80px;
padding:20px;
margin-top:20px;
border-radius:0px;
border:1px solid #cbd5e1;
resize:vertical;
font-family:Arial;
">
</textarea>


<br><br>


<button onclick="criar()">
Criar Chamado
</button>

</div>

<div class="filtros">

  <input
    id="busca"
    placeholder="🔍 Buscar cliente, telefone, equipamento ou OS..."
    onkeyup="filtrarChamados()"
  >

  <select
    id="filtroStatus"
    onchange="filtrarChamados()"
  >
    <option value="">📋 Todos</option>
    <option value="aberto">🔴 Abertos</option>
    <option value="andamento">🟡 Em andamento</option>
    <option value="reparo">🟠 Em reparo</option>
    <option value="finalizado">🟢 Finalizados</option>
  </select>

  <select
    id="ordenacao"
    onchange="filtrarChamados()"
  >
    <option value="novo">🆕 Mais recentes</option>
    <option value="antigo">📅 Mais antigos</option>
    <option value="os">🔢 Número da OS</option>
    <option value="cliente">👤 Cliente (A-Z)</option>
    <option value="status">📌 Status</option>
  </select>

</div>

<h3>
Resumo
</h3>


<div id="stats" class="stats-grid"></div>



<h3>
📋 Chamados
</h3>

<table id="tabelaChamados">

<thead>

<tr>

<th>OS / Origem</th>
<th>Cliente</th>
<th>Equipamento</th>
<th>Status</th>
<th>Data</th>
<th>Ações</th>

</tr>

</thead>

<tbody id="lista">

</tbody>

</table>

</div>

<script>

let clienteSelecionado = null;
let clientes = [];

// ===================== CARREGAR CLIENTES =====================

async function carregarClientes(){

  const res = await fetch("/api/clientes", {
    credentials:"include"
  });


  if(res.ok){

    clientes = await res.json();

  }

}

const stats = document.getElementById("stats");
const lista = document.getElementById("lista");

// ===================== USUÁRIO =====================

async function carregarUsuario(){

  const res = await fetch("/me", {
    credentials:"include"
  });


  if(res.status === 401){

    window.location.href="/";

    return;

  }


  const data = await res.json();


  document.getElementById("nomeUsuario").innerText =
    data.user?.username || "Usuário";


  document.getElementById("cargoUsuario").innerText =
    data.user?.role || "Usuário";

}

let chamados = [];

// ===================== PREENCHER CLIENTE =====================

function preencherCliente(){

  const params = new URLSearchParams(
    window.location.search
  );

  const clienteId = params.get("clienteId");
  const cliente = params.get("cliente");
  const telefone = params.get("telefone");
  const cpfcnpj = params.get("cpfcnpj");


  if(cliente){

    document.getElementById("cliente").value = cliente;

  }


  if(telefone){

    document.getElementById("telefone").value = telefone;

  }


  if(cpfcnpj){

    document.getElementById("cpfcnpj").value = cpfcnpj;

  }

}

function renderChamados(listaChamados){

    lista.innerHTML = "";

    listaChamados.forEach(c => {

        const dataAbertura =
            c.createdAt
            ? new Date(c.createdAt).toLocaleString("pt-BR", {
                timeZone: "America/Cuiaba"
            })
            : "-";

        let classeStatus = "";

        switch(c.status){

            case "aberto":
                classeStatus = "status-aberto";
                break;

            case "andamento":
                classeStatus = "status-andamento";
                break;

            case "reparo":
                classeStatus = "status-reparo";
                break;

            case "finalizado":
                classeStatus = "status-finalizado";
                break;

        }


        lista.innerHTML += `

<tr>

<td>

<b>OS ${c.numeroOS || "-"}</b>

${
    c.origem === "orcamento"
    ? `
        <br>
        <span style="
            display:inline-block;
            margin-top:5px;
            background:#fef3c7;
            color:#92400e;
            padding:3px 8px;
            border-radius:20px;
            font-size:11px;
            font-weight:bold;
        ">
            💰 GERADO POR ORÇAMENTO
        </span>
    `
    : `
        <br>
        <span style="
            display:inline-block;
            margin-top:5px;
            background:#dbeafe;
            color:#1d4ed8;
            padding:3px 8px;
            border-radius:20px;
            font-size:11px;
            font-weight:bold;
        ">
            🛠 CHAMADO DIRETO
        </span>
    `
}

</td>

<td>
  <a href="javascript:void(0)"
     onclick="abrirCliente('${c.cpfcnpj}')"
     style="
       color:#2563eb;
       text-decoration:none;
       font-weight:bold;
     ">
    ${c.cliente}
  </a>
</td>

<td>
${c.equipamento || ""}
</td>

<td>

<span class="badge ${classeStatus}">
${String(c.status || "").toUpperCase()}
</span>

</td>

<td>
${dataAbertura}
</td>

<td>

<button onclick="status('${c._id}')">
Status
</button>


<button onclick="imprimirOS('${c._id}')">
🖨 OS
</button>


${
c.status === "finalizado"
?
`
<button onclick="abrirLaudo('${c._id}')">
Laudo
</button>
`
:
"" 
}


<button onclick="del('${c._id}')">
Excluir
</button>

</td>

</tr>

`;

    });

}


// ===================== FILTRO =====================

function filtrarChamados(){

  const texto = document
    .getElementById("busca")
    .value
    .trim()
    .toLowerCase();

  const status = document
    .getElementById("filtroStatus")
    .value;

  const somenteNumero = /^\d+$/.test(texto);

  const filtrados = chamados.filter(c => {

    let encontrouTexto = false;

    // Se digitou apenas números, procura primeiro pela OS
    if(somenteNumero){

      encontrouTexto =
        String(c.numeroOS || "") === texto;

    }else{

      const procura = (
        (c.cliente || "") + " " +
        (c.telefone || "") + " " +
        (c.equipamento || "") + " " +
        (c.cpfcnpj || "") + " " +
        (c.problema || "")
      ).toLowerCase();

      encontrouTexto = procura.includes(texto);

    }

    const encontrouStatus =
      !status || c.status === status;

    return encontrouTexto && encontrouStatus;

  });

const ordenacao =
  document.getElementById("ordenacao").value;

switch(ordenacao){

  case "novo":
    filtrados.sort((a,b)=>
      new Date(b.createdAt) - new Date(a.createdAt)
    );
    break;

  case "antigo":
    filtrados.sort((a,b)=>
      new Date(a.createdAt) - new Date(b.createdAt)
    );
    break;

  case "os":
    filtrados.sort((a,b)=>
      (a.numeroOS || 0) - (b.numeroOS || 0)
    );
    break;

  case "cliente":
    filtrados.sort((a,b)=>
      (a.cliente || "").localeCompare(
        b.cliente || "",
        "pt-BR"
      )
    );
    break;

  case "status":
    filtrados.sort((a,b)=>
      (a.status || "").localeCompare(
        b.status || "",
        "pt-BR"
      )
    );
    break;

}

  renderChamados(filtrados);

}

/* ===================== LOAD ===================== */

async function load(){

	 console.log("🔄 LOAD EXECUTADO", new Date().toLocaleTimeString());


  try {

    const res = await fetch("/api/tickets", {
      credentials:"include"
    });

    console.log("STATUS /api/tickets =", res.status);

    if(res.status === 401){
      alert("Sessão perdida");
      window.location.href="/";
      return;
    }

    chamados = await res.json();

loadStats();

filtrarChamados();


  } catch(err){

    console.log(err);
    alert("Erro ao carregar chamados");

  }

}



/* ===================== STATS ===================== */

function loadStats(){

  const aberto =
    chamados.filter(x => x.status === "aberto").length;


  const andamento =
    chamados.filter(x => x.status === "andamento").length;


  const reparo =
    chamados.filter(x => x.status === "reparo").length;


  const finalizado =
    chamados.filter(x => x.status === "finalizado").length;



  stats.innerHTML = `


    <div class="stat-card red">

      <h2>${aberto}</h2>

      <small>Abertos</small>

    </div>



    <div class="stat-card yellow">

      <h2>${andamento}</h2>

      <small>Andamento</small>

    </div>



    <div class="stat-card orange">

      <h2>${reparo}</h2>

      <small>Reparo</small>

    </div>



    <div class="stat-card green">

      <h2>${finalizado}</h2>

      <small>Finalizados</small>

    </div>


  `;


}

// ===================== AUTOCOMPLETE =====================


function buscarCliente(campo){

  const valor =
    document.getElementById(campo).value
    .toLowerCase()
    .trim();


  const lista =
    document.getElementById(
      "lista" + campo.charAt(0).toUpperCase() + campo.slice(1)
    );


  lista.innerHTML="";


  if(valor.length < 2){

    return;

  }


  const encontrados = clientes.filter(c=>{


    if(campo==="cliente"){

      return (c.nome || c.cliente || "")
      .toLowerCase()
      .includes(valor);

    }


    if(campo==="cpfcnpj"){

      return (c.cpfcnpj || "")
      .toLowerCase()
      .includes(valor);

    }


    if(campo==="telefone"){

      return (c.telefone || "")
      .toLowerCase()
      .includes(valor);

    }


  }).slice(0,10);



  encontrados.forEach(c=>{


    const nome =
      c.nome || c.cliente;


    lista.innerHTML += `

    <div class="autocomplete-item"
    onclick='selecionarCliente(${JSON.stringify(c)})'>

    <b>${nome}</b>
    <br>

    <small>
    ${c.cpfcnpj || ""}
    ${c.telefone || ""}
    </small>

    </div>

    `;


  });

if (lista.innerHTML.trim() !== "") {

    lista.style.border = "1px solid #cbd5e1";
    lista.style.boxShadow = "0 4px 10px rgba(0,0,0,.15)";

} else {

    lista.style.border = "none";
    lista.style.boxShadow = "none";

}

}

function selecionarCliente(c){


  clienteSelecionado = c._id;


  document.getElementById("cliente").value =
    c.nome || c.cliente || "";


  document.getElementById("cpfcnpj").value =
    c.cpfcnpj || "";


  document.getElementById("telefone").value =
    c.telefone || "";


  document.getElementById("listaCliente").innerHTML="";
  document.getElementById("listaCpfcnpj").innerHTML="";
  document.getElementById("listaTelefone").innerHTML="";

["listaCliente","listaCpfcnpj","listaTelefone"].forEach(id => {
    const el = document.getElementById(id);
    el.style.border = "none";
    el.style.boxShadow = "none";
});


}


/* ===================== CRIAR ===================== */

async function criar(){

  const cliente =
    document.getElementById("cliente").value.trim();

  const telefone =
    document.getElementById("telefone").value.trim();

  const cpfcnpj =
    document.getElementById("cpfcnpj").value.trim();

  const equipamento =
    document.getElementById("equipamento").value.trim();

  const problema =
    document.getElementById("problema").value.trim();

const observacoes =
  document.getElementById("observacoes").value.trim();

  if(!cliente || !telefone || !equipamento || !problema){

    alert("Preencha todos os campos");
    return;

  }

  await fetch("/api/tickets", {

    method:"POST",

    headers:{
      "Content-Type":"application/json"
    },

    credentials:"include",

body:JSON.stringify({

  clienteId: clienteSelecionado,

  cliente,
  telefone,
  cpfcnpj,
  equipamento,
  problema,
  observacoes

})

  });

  document.getElementById("cliente").value="";
  document.getElementById("telefone").value="";
  document.getElementById("cpfcnpj").value="";
  document.getElementById("equipamento").value="";
  document.getElementById("problema").value="";
  document.getElementById("observacoes").value="";

  load();

}



/* ===================== STATUS ===================== */

async function status(id){


  const t =
    chamados.find(x => x._id === id);


  if(!t) return;



  let novo="aberto";


  if(t.status==="aberto")
    novo="andamento";


  else if(t.status==="andamento")
    novo="reparo";


  else if(t.status==="reparo")
    novo="finalizado";


  else if(t.status==="finalizado")
    novo="aberto";



  const res = await fetch("/api/tickets/"+id,{

    method:"PUT",

    headers:{
      "Content-Type":"application/json"
    },

    credentials:"include",

    body:JSON.stringify({
      status:novo
    })

  });



  const data = await res.json();



  if(data.whatsapp){

    window.open(data.whatsapp,"_blank");

  }



  load();

}



/* ===================== LAUDO ===================== */

function abrirLaudo(id){

  window.location.href =
    "/laudo.html?id=" + id;

}



/* ===================== DELETE ===================== */

async function del(id){


  if(!confirm("Deseja excluir?"))
    return;



  await fetch("/api/tickets/"+id,{

    method:"DELETE",

    credentials:"include"

  });



  load();

}

function abrirCliente(cpfcnpj){

    window.location.href =
        "/clientes.html?buscar=" +
        encodeURIComponent(cpfcnpj);

}


/* ===================== LOGOUT ===================== */

async function logout(){

  await fetch("/logout",{
    credentials:"include"
  });


  window.location.href="/";

}

/* ===================== IMPRIMIR OS ===================== */

function imprimirOS(id){

    window.open(
        "/api/tickets/" + id + "/pdf",
        "_blank"
    );

}

/* ===================== INIT ===================== */

carregarUsuario();

preencherCliente();

carregarClientes();

load();


/* ===================== ATUALIZAÇÃO AUTOMÁTICA ===================== */

setInterval(() => {

    load();

}, 10000);

</script>

<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>

<script src="/pwa-sync.js"></script>

<script src="/onesignal-init.js"></script>

</body>
</html>
