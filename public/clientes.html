<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>Bits & Bytes - Clientes</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;

font-family:Arial;

background:#f2f2f2;

}


/* SIDEBAR */

.sidebar{

width:250px;

background:#0f172a;

min-height:100vh;

color:white;

position:fixed;

left:0;

top:0;

}


.logo{

padding:20px;

display:flex;

gap:10px;

align-items:center;

border-bottom:1px solid rgba(255,255,255,.1);

}


.sidebar a{

display:block;

color:white;

text-decoration:none;

padding:14px 20px;

}


.sidebar a:hover{

background:#1e293b;

}



.usuario{

position:absolute;

bottom:20px;

left:20px;

}




/* MAIN */

.main{

margin-left:250px;

width:calc(100% - 250px);

min-height:100vh;

}




/* TOPBAR */

.topbar{

height:70px;

background:white;

display:flex;

align-items:center;

justify-content:space-between;

padding:0 30px;

box-shadow:0 2px 10px rgba(0,0,0,.08);

}



.topbar a{

color:#dc2626;

text-decoration:none;

font-weight:bold;

}




/* CONTAINER */

.container{

padding:20px;

}




/* CARD */

.card{

background:white;

padding:20px;

border-radius:10px;

box-shadow:0 2px 8px rgba(0,0,0,.08);

margin-bottom:15px;

}




/* BUSCA */

input{

width:100%;

padding:10px;

border:1px solid #ccc;

border-radius:6px;

margin-bottom:15px;

}




/* MODAL */

.modal{

display:none;

position:fixed;

z-index:999;

left:0;

top:0;

width:100%;

height:100%;

background:rgba(0,0,0,.5);

}



.modal-content{

background:white;

width:90%;

max-width:700px;

margin:50px auto;

padding:20px;

border-radius:10px;

max-height:80vh;

overflow:auto;

}



.close{

float:right;

font-size:25px;

cursor:pointer;

}



.chamado{

background:#f5f5f5;

padding:12px;

margin-bottom:10px;

border-radius:8px;

border-left:5px solid #0f172a;

}


</style>

</head>


<body>



<!-- SIDEBAR -->

<div class="sidebar">


<div class="logo">


<img src="/logo.png" width="45">


<div>

<b>Bits & Bytes</b>

<br>

<small>Tecnology</small>

</div>


</div>



<a href="/dashboard.html">
🏠 Dashboard
</a>

<a href="/clientes.html">
👥 Clientes
</a>

<a href="/chamados.html">
📋 Chamados
</a>

<a href="#">
💰 Orçamentos
</a>

<a href="/services.html">
🛠 Serviços
</a>

<a href="/laudos.html">
📄 Laudos Técnicos
</a>

<a href="#">
📦 Estoque
</a>

<a href="#">
💵 Financeiro
</a>

<a href="#">
📊 Relatórios
</a>

<a href="#">
⚙️ Configurações
</a>



<div class="usuario">

<b id="nomeUsuario">
Carregando...
</b>

<br>

<small id="cargoUsuario">
Usuário
</small>

</div>


</div>





<!-- MAIN -->

<div class="main">


<div class="topbar">


<div>
👥 Clientes
</div>


<a href="javascript:void(0)" onclick="logout()">
Sair
</a>


</div>




<div class="container">


<div class="card">


<h2>
👥 Lista de Clientes
</h2>



<input
id="busca"
placeholder="Buscar por nome, telefone ou CPF"
onkeyup="filtrar()"
>



<div id="lista"></div>



</div>


</div>


</div>





<!-- MODAL HISTÓRICO -->

<div id="modalHistorico" class="modal">


<div class="modal-content">


<span class="close" onclick="fecharModal()">
&times;
</span>


<h2 id="tituloHistorico"></h2>


<div id="dadosCliente"></div>


<hr>


<h3>
Histórico de Chamados
</h3>


<div id="conteudoHistorico"></div>


</div>


</div>

<script>

/* ===================== LOGIN CHECK ===================== */
async function verificarLogin(){

  const res = await fetch("/me", {
    credentials:"include"
  });

  if(res.status === 401){
    window.location.href="/";
    return false;
  }

  return true;
}

/* ===================== DOM ===================== */
const lista = document.getElementById("lista");

let clientes = [];
let clienteSelecionado = null;

// ===================== USUÁRIO =====================

async function carregarUsuario(){

  const res = await fetch("/me", {
    credentials:"include"
  });


  if(res.status === 401){

    window.location.href="/";

    return;

  }


  const data = await res.json();


  document.getElementById("nomeUsuario").innerText =
    data.user?.username || "Usuário";


  document.getElementById("cargoUsuario").innerText =
    data.user?.role || "Usuário";

}

/* ===================== LOAD ===================== */
async function load(){

  try {

    const res = await fetch(
      "/api/clientes/list",
      {
        credentials: "include"
      }
    );

    const data = await res.json();

    clientes = data;

    if (!res.ok) {

      console.error(data);

      alert(
        data.error ||
        "Erro ao carregar clientes"
      );

      return;
    }

    render(clientes);

  } catch (err) {

    console.error(err);

    alert(
      "Erro de conexão com servidor"
    );
  }
}

function render(listaClientes){

  lista.innerHTML = "";

  if(!listaClientes.length){

    lista.innerHTML = `
      <div class="card">
        Nenhum cliente encontrado.
      </div>
    `;

    return;
  }

  listaClientes.sort((a,b) =>
    (a.nome || "").localeCompare(
      (b.nome || ""),
      "pt-BR",
      { sensitivity:"base" }
    )
  );

  listaClientes.forEach(c => {

  lista.innerHTML += `
    <div
      class="card"
      onclick='historico(${JSON.stringify(c.nome || "")})'
      style="cursor:pointer;"
    >

      <b>${c.nome || "Sem nome"}</b>

      <div class="info">
        📱 ${c.telefone || "Não informado"}
      </div>

      <div class="info">
        📄 ${c.cpfcnpj || "Não informado"}
      </div>

    </div>
  `;

});

}

function filtrar(){

  const termo =
    document.getElementById("busca")
      .value
      .toLowerCase();

  const resultado = clientes.filter(c => {

    return (
      String(c.nome || "")
        .toLowerCase()
        .includes(termo)

      ||

      String(c.telefone || "")
        .toLowerCase()
        .includes(termo)

      ||

      String(c.cpfcnpj || "")
        .toLowerCase()
        .includes(termo)
    );

  });

  render(resultado);

}

async function historico(nome){

  clienteSelecionado = clientes.find(
    c => c.nome === nome
  );

  try {

    const res = await fetch(
      "/api/clientes/historico/" +
      encodeURIComponent(nome),
      {
        credentials:"include"
      }
    );


    const chamados = await res.json();


    document.getElementById("tituloHistorico")
  .innerHTML =
  "Ficha do Cliente - " + nome;


const dados =
  document.getElementById("dadosCliente");


dados.innerHTML = `

  <div class="chamado">

    <b>Cliente:</b>
    ${clienteSelecionado?.nome || nome}

    <br>

    <b>Telefone:</b>
    ${clienteSelecionado?.telefone || "-"}

    <br>

    <b>CPF/CNPJ:</b>
    ${clienteSelecionado?.cpfcnpj || "-"}

  </div>

`;

const resumo = chamados.reduce((acc, c)=>{

  acc.total++;

  if(c.status === "aberto"){
    acc.abertos++;
  }

  if(c.status === "andamento"){
    acc.andamento++;
  }

  if(c.status === "reparo"){
    acc.reparo++;
  }

  if(c.status === "finalizado"){
    acc.finalizados++;
  }

  return acc;

},{
  total:0,
  abertos:0,
  andamento:0,
  reparo:0,
  finalizados:0
});


dados.innerHTML += `

<div class="chamado">

<b>Resumo do Cliente</b>

<br><br>

📋 Total de chamados:
${resumo.total}

<br>

🔴 Abertos:
${resumo.abertos}

<br>

🟡 Em andamento:
${resumo.andamento}

<br>

🔵 Em reparo:
${resumo.reparo}

<br>

🟢 Finalizados:
${resumo.finalizados}

<br><br>

<button onclick="novoChamado()">
  ➕ Novo Chamado
</button>

</div>

`;


    const conteudo =
      document.getElementById("conteudoHistorico");


    conteudo.innerHTML = "";


    if(!chamados.length){

      conteudo.innerHTML = `
        <div class="chamado">
          Nenhum chamado encontrado.
        </div>
      `;

    }


    chamados.forEach(c=>{


      conteudo.innerHTML += `

        <div class="chamado">

          <b>OS:</b>
          ${c.numeroOS || "-"}

          <br>

          <b>Equipamento:</b>
          ${c.equipamento || "-"}

          <br>

          <b>Problema:</b>
          ${c.problema || "-"}

          <br>

          <b>Status:</b>
          ${c.status || "-"}

          <br>

          <b>Data:</b>
          ${
            c.createdAt
            ?
            new Date(c.createdAt)
            .toLocaleDateString("pt-BR")
            :
            "-"
          }

        </div>

      `;


    });


    document.getElementById("modalHistorico")
      .style.display="block";


  } catch(err){

    console.log(err);

    alert(
      "Erro ao carregar histórico"
    );

  }

}


function fecharModal(){

  document.getElementById("modalHistorico")
    .style.display="none";

}

function novoChamado(){

  window.location.href =
    "/chamados.html?cliente=" +
    encodeURIComponent(clienteSelecionado.nome) +
    "&telefone=" +
    encodeURIComponent(clienteSelecionado.telefone || "") +
    "&cpfcnpj=" +
    encodeURIComponent(clienteSelecionado.cpfcnpj || "");

}

/* ===================== LOGOUT ===================== */

async function logout(){

  await fetch("/logout",{
    credentials:"include"
  });

  window.location.href="/";

}

/* ===================== INIT ===================== */
(async()=>{

  const ok = await verificarLogin();

  if(ok){

    carregarUsuario();

    load();

  }

})();

</script>

</body>
</html>
