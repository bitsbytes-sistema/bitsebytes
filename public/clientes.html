<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Clientes</title>

<style>

body {
  font-family: Arial;
  background:#f2f2f2;
  margin:0;
}

.header {
  background:#2c2c44;
  color:white;
  padding:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.container {
  padding:20px;
}

.card {
  background:white;
  padding:15px;
  margin-bottom:10px;
  border-radius:8px;
  box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

a {
  color:white;
  text-decoration:none;
}

.info {
  margin-top:5px;
}

</style>
</head>

<body>

<div class="header">

  <div>
    Clientes
  </div>

  <div>
    <a href="/dashboard.html">Voltar</a>
  </div>

</div>

<div class="container">

  <h2>Lista de Clientes</h2>

  <input
    id="busca"
    placeholder="Buscar por nome, telefone ou CPF"
    onkeyup="filtrar()"
    style="width:100%;padding:10px;margin-bottom:15px;border:1px solid #ccc;border-radius:6px;"
  >

  <div id="lista"></div>

</div>

<script>

/* ===================== LOGIN CHECK ===================== */
async function verificarLogin(){

  const res = await fetch("/me", {
    credentials:"include"
  });

  if(res.status === 401){
    window.location.href="/";
    return false;
  }

  return true;
}

/* ===================== DOM ===================== */
const lista = document.getElementById("lista");

let clientes = [];

/* ===================== LOAD ===================== */
async function load(){

  try {

    const res = await fetch(
      "/api/clientes/list",
      {
        credentials: "include"
      }
    );

    const data = await res.json();

    clientes = data;

    if (!res.ok) {

      console.error(data);

      alert(
        data.error ||
        "Erro ao carregar clientes"
      );

      return;
    }

    render(clientes);

  } catch (err) {

    console.error(err);

    alert(
      "Erro de conexão com servidor"
    );
  }
}

function render(listaClientes){

  lista.innerHTML = "";

  if(!listaClientes.length){

    lista.innerHTML = `
      <div class="card">
        Nenhum cliente encontrado.
      </div>
    `;

    return;
  }

listaClientes.sort((a,b) =>
  (a.nome || "").localeCompare(
    (b.nome || ""),
    "pt-BR",
    { sensitivity: "base" }
  )
);

  listaClientes.forEach(c => {

    lista.innerHTML += `
      <div class="card">

        <b>${c.nome || "Sem nome"}</b>

        <div class="info">
          📱 ${c.telefone || "Não informado"}
        </div>

        <div class="info">
          📄 ${c.cpfcnpj || "Não informado"}
        </div>

      </div>
    `;

  });

}

function filtrar(){

  const termo =
    document.getElementById("busca")
      .value
      .toLowerCase();

  const resultado = clientes.filter(c => {

    return (
      String(c.nome || "")
        .toLowerCase()
        .includes(termo)

      ||

      String(c.telefone || "")
        .toLowerCase()
        .includes(termo)

      ||

      String(c.cpfcnpj || "")
        .toLowerCase()
        .includes(termo)
    );

  });

  render(resultado);

}

/* ===================== INIT ===================== */
(async()=>{

  const ok = await verificarLogin();

  if(ok){
    load();
  }

})();

</script>

</body>
</html>
