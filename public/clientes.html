<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>Bits & Bytes - Clientes</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;

font-family:Arial;

background:#f2f2f2;

}


/* SIDEBAR */

.sidebar{

width:250px;

background:#0f172a;

min-height:100vh;

color:white;

position:fixed;

left:0;

top:0;

}


.logo{

padding:20px;

display:flex;

gap:10px;

align-items:center;

border-bottom:1px solid rgba(255,255,255,.1);

}


.sidebar a{

display:block;

color:white;

text-decoration:none;

padding:14px 20px;

}


.sidebar a:hover{

background:#1e293b;

}



.usuario{

position:absolute;

bottom:20px;

left:20px;

}




/* MAIN */

.main{

margin-left:250px;

width:calc(100% - 250px);

min-height:100vh;

}




/* TOPBAR */

.topbar{

height:70px;

background:white;

display:flex;

align-items:center;

justify-content:space-between;

padding:0 30px;

box-shadow:0 2px 10px rgba(0,0,0,.08);

}



.topbar a{

color:#dc2626;

text-decoration:none;

font-weight:bold;

}




/* CONTAINER */

.container{

padding:20px;

}




/* CARD */

.card{

background:white;

padding:20px;

border-radius:10px;

box-shadow:0 2px 8px rgba(0,0,0,.08);

margin-bottom:15px;

}




/* BUSCA */

input{

width:100%;

padding:10px;

border:1px solid #ccc;

border-radius:6px;

margin-bottom:15px;

}




/* MODAL */

.modal{

display:none;

position:fixed;

top:0;

left:0;

width:100%;

height:100%;

background:rgba(0,0,0,.35);

z-index:999;

}



.modal-content{

position:absolute;

right:0;

top:0;

width:500px;

max-width:100%;

height:100%;

background:white;

padding:25px;

overflow:auto;

box-shadow:-5px 0 20px rgba(0,0,0,.15);

animation:abrirPainel .25s ease;

}



.close{

float:right;

font-size:25px;

cursor:pointer;

}



.chamado{

background:#f5f5f5;

padding:12px;

margin-bottom:10px;

border-radius:8px;

border-left:5px solid #0f172a;

}

@keyframes abrirPainel{

from{

transform:translateX(100%);

}

to{

transform:translateX(0);

}

}

</style>

</head>


<body>



<!-- SIDEBAR -->

<div class="sidebar">


<div class="logo">


<img src="/logo.png" width="45">


<div>

<b>Bits & Bytes</b>

<br>

<small>Tecnology</small>

</div>


</div>



<a href="/dashboard.html">
🏠 Dashboard
</a>

<a href="/clientes.html">
👥 Clientes
</a>

<a href="/chamados.html">
📋 Chamados
</a>

<a href="/orcamentos.html">
💰 Orçamentos</a>

<a href="/services.html">
🛠 Serviços
</a>

<a href="/laudos.html">
📄 Laudos Técnicos
</a>

<a href="/estoque.html">
📦 Estoque
</a>

<a href="/vendas.html">
🛒 Vendas
</a>

<a href="/financeiro.html">
💵 Financeiro
</a>

<a href="/lembretes.html">
🔔 Lembretes
</a>

<a href="/relatorios.html">
📊 Relatórios
</a>

<a href="/configuracoes.html">
⚙️ Configurações
</a>



<div class="usuario">

<b id="nomeUsuario">
Carregando...
</b>

<br>

<small id="cargoUsuario">
Usuário
</small>

</div>


</div>





<!-- MAIN -->

<div class="main">


<div class="topbar">


<div>
👥 Clientes
</div>


<a href="javascript:void(0)" onclick="logout()">
Sair
</a>


</div>




<div class="container">


<div class="card">

<div style="
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:15px;
">

<h2 style="margin:0;">
👥 Lista de Clientes
</h2>

<button onclick="abrirNovoCliente()">
➕ Novo Cliente
</button>

</div>

<input
id="busca"
placeholder="Buscar por nome, telefone ou CPF"
onkeyup="filtrar()"
>

<div id="lista"></div>



</div>


</div>


</div>





<!-- MODAL HISTÓRICO -->

<div id="modalHistorico" class="modal">


<div class="modal-content">


<span class="close" onclick="fecharModal()">
&times;
</span>


<h2 id="tituloHistorico"></h2>


<div id="dadosCliente"></div>


<hr>


<h3>
Histórico de Chamados
</h3>


<div id="conteudoHistorico"></div>


</div>


</div>

<div id="modalCliente" class="modal">

<div class="modal-content">

<span class="close" onclick="fecharNovoCliente()">
&times;
</span>

<h2>👤 Novo Cliente</h2>

<input id="novoNome" placeholder="Nome">

<input id="novoTelefone" placeholder="Telefone">

<label>🎂 Data de Nascimento</label>

<input
type="date"
id="novoAniversario">

<input id="novoCpf" placeholder="CPF/CNPJ">

<input id="novoEndereco" placeholder="Endereço">

<input id="novoBairro" placeholder="Bairro">

<input id="novoCidade" placeholder="Cidade">

<input id="novoEstado" placeholder="Estado">

<input id="novoCep" placeholder="CEP">

<button onclick="salvarNovoCliente()">
Salvar Cliente
</button>

</div>

</div>

<script>

/* ===================== LOGIN CHECK ===================== */
async function verificarLogin(){

  const res = await fetch("/me", {
    credentials:"include"
  });

  if(res.status === 401){
    window.location.href="/";
    return false;
  }

  return true;
}

/* ===================== DOM ===================== */
const lista = document.getElementById("lista");

let clientes = [];
let clienteSelecionado = null;

// ===================== USUÁRIO =====================

async function carregarUsuario(){

  const res = await fetch("/me", {
    credentials:"include"
  });


  if(res.status === 401){

    window.location.href="/";

    return;

  }


  const data = await res.json();


  document.getElementById("nomeUsuario").innerText =
    data.user?.username || "Usuário";


  document.getElementById("cargoUsuario").innerText =
    data.user?.role || "Usuário";

}

async function salvarNovoCliente(){

  const cliente = {

    nome: document.getElementById("novoNome").value.trim(),

    telefone: document.getElementById("novoTelefone").value.trim(),

    aniversario: document.getElementById("novoAniversario").value,

    cpfcnpj: document.getElementById("novoCpf").value.trim(),

    endereco: document.getElementById("novoEndereco").value.trim(),

    bairro: document.getElementById("novoBairro").value.trim(),

    cidade: document.getElementById("novoCidade").value.trim(),

    estado: document.getElementById("novoEstado").value.trim(),

    cep: document.getElementById("novoCep").value.trim()

  };

  if(!cliente.nome){

    alert("Informe o nome do cliente.");

    return;

  }

  try{

    const res = await fetch("/api/clientes",{

      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      credentials:"include",

      body: JSON.stringify(cliente)

    });

    if(!res.ok){

      alert("Erro ao cadastrar cliente.");

      return;

    }

    fecharNovoCliente();

    await load();

    alert("Cliente cadastrado com sucesso!");

  }catch(err){

    console.log(err);

    alert("Erro ao cadastrar cliente.");

  }

}

/* ===================== LOAD ===================== */
async function load(){

  try {

    const res = await fetch(
      "/api/clientes",
      {
        credentials: "include"
      }
    );

    const data = await res.json();

    clientes = data;

    if (!res.ok) {

      console.error(data);

      alert(
        data.error ||
        "Erro ao carregar clientes"
      );

      return;
    }

    render(clientes);

// Se veio da tela de chamados
const params = new URLSearchParams(window.location.search);

const buscar = params.get("buscar");

if(buscar){

  document.getElementById("busca").value = buscar;

  filtrar();

  // abre automaticamente a ficha do cliente encontrado
  const cliente = clientes.find(c =>
    String(c._id) === buscar
);

  if(cliente){

    historico(cliente.nome);

  }

}


  } catch (err) {

    console.error(err);

    alert(
      "Erro de conexão com servidor"
    );
  }
}

function render(listaClientes){

  lista.innerHTML = "";

  if(!listaClientes.length){

    lista.innerHTML = `
      <div class="card">
        Nenhum cliente encontrado.
      </div>
    `;

    return;
  }

  listaClientes.sort((a,b) =>
    (a.nome || "").localeCompare(
      (b.nome || ""),
      "pt-BR",
      { sensitivity:"base" }
    )
  );

  listaClientes.forEach(c => {

  lista.innerHTML += `
    <div
      class="card"
      onclick='historico("${c._id}")'
      style="cursor:pointer;"
    >

      <b>${c.nome || "Sem nome"}</b>

      <div class="info">
        📱 ${c.telefone || "Não informado"}
      </div>

      <div class="info">
        📄 ${c.cpfcnpj || "Não informado"}
      </div>

    </div>
  `;

});

}

function filtrar(){

  const termo =
    document.getElementById("busca")
      .value
      .toLowerCase();

  const resultado = clientes.filter(c => {

    return (
      String(c.nome || "")
        .toLowerCase()
        .includes(termo)

      ||

      String(c.telefone || "")
        .toLowerCase()
        .includes(termo)

      ||

      String(c.cpfcnpj || "")
        .toLowerCase()
        .includes(termo)
    );

  });

  render(resultado);

}

async function historico(clienteId){

  clienteSelecionado = clientes.find(
  c => c._id === clienteId
);

  try {

    const res = await fetch(
      "/api/clientes/historico/" +
encodeURIComponent(clienteId),
      {
        credentials:"include"
      }
    );


    const historicoData = await res.json();

const chamados = historicoData.chamados || [];
const vendas = historicoData.vendas || [];


    document.getElementById("tituloHistorico")
  .innerHTML =
  "Ficha do Cliente - " + (clienteSelecionado?.nome || "");


const dados =
  document.getElementById("dadosCliente");


dados.innerHTML = `

<div class="card">

<h3 style="margin-top:0;color:#0f172a;">
👤 Dados do Cliente
</h3>

<table style="width:100%;border-collapse:collapse;">

<tr>
<td style="padding:8px;"><b>👤 Nome</b></td>
<td>${clienteSelecionado?.nome || "-"}</td>
</tr>

<tr>
<td style="padding:8px;"><b>📱 Telefone</b></td>
<td>${clienteSelecionado?.telefone || "-"}</td>
</tr>

<tr>
<td style="padding:8px;"><b>🎂 Nascimento</b></td>

<td>${
clienteSelecionado?.aniversario
?
(() => {

  const d = new Date(clienteSelecionado.aniversario);

  return (
    String(d.getUTCDate()).padStart(2,"0")
    + "/" +
    String(d.getUTCMonth() + 1).padStart(2,"0")
    + "/" +
    d.getUTCFullYear()
  );

})()
:
"-"
}</td>

</tr>

<tr>
<td style="padding:8px;"><b>📄 CPF/CNPJ</b></td>
<td>${clienteSelecionado?.cpfcnpj || "-"}</td>
</tr>

<tr>
<td style="padding:8px;"><b>🏠 Endereço</b></td>
<td>${clienteSelecionado?.endereco || "-"}</td>
</tr>

<tr>
<td style="padding:8px;"><b>🏘️ Bairro</b></td>
<td>${clienteSelecionado?.bairro || "-"}</td>
</tr>

<tr>
<td style="padding:8px;"><b>🏙️ Cidade</b></td>
<td>${clienteSelecionado?.cidade || "-"}</td>
</tr>

<tr>
<td style="padding:8px;"><b>📍 Estado</b></td>
<td>${clienteSelecionado?.estado || "-"}</td>
</tr>

<tr>
<td style="padding:8px;"><b>📮 CEP</b></td>
<td>${clienteSelecionado?.cep || "-"}</td>
</tr>

</table>

<br>

<button onclick="editarCliente()">
✏️ Editar Cliente
</button>

</div>

`;

const resumo = chamados.reduce((acc, c)=>{

  acc.total++;

  if(c.status === "aberto"){
    acc.abertos++;
  }

  if(c.status === "andamento"){
    acc.andamento++;
  }

  if(c.status === "reparo"){
    acc.reparo++;
  }

  if(c.status === "finalizado"){
    acc.finalizados++;
  }

  return acc;

},{
  total:0,
  abertos:0,
  andamento:0,
  reparo:0,
  finalizados:0
});


const totalVendas = vendas.length;

const totalVendido = vendas.reduce(
  (total, venda) => {

    if(venda.status === "cancelada"){
      return total;
    }

    return total + Number(
      venda.total || 0
    );

  },
  0
);


dados.innerHTML += `

<div class="card">

<h3 style="margin-top:0;color:#0f172a;">
📊 Resumo
</h3>

<div style="line-height:30px;">

📋 <b>Total de OS:</b> ${resumo.total}<br>

🔴 <b>Abertos:</b> ${resumo.abertos}<br>

🟡 <b>Em andamento:</b> ${resumo.andamento}<br>

🟠 <b>Em reparo:</b> ${resumo.reparo}<br>

🟢 <b>Finalizados:</b> ${resumo.finalizados}<br>

🛒 <b>Total de vendas:</b> ${totalVendas}<br>

💰 <b>Total vendido:</b>
${totalVendido.toLocaleString(
  "pt-BR",
  {
    style:"currency",
    currency:"BRL"
  }
)}

</div>

<br>

<button onclick="novoChamado()">
➕ Novo Chamado
</button>

</div>

`;


    const conteudo =
      document.getElementById("conteudoHistorico");


    conteudo.innerHTML = "";


    if(!chamados.length){

      conteudo.innerHTML = `
        <div class="chamado">
          Nenhum chamado encontrado.
        </div>
      `;

    }


    chamados.forEach(c=>{


      conteudo.innerHTML += `

        <div class="chamado">

          <b>OS:</b>
          ${c.numeroOS || "-"}

          <br>

          <b>Equipamento:</b>
          ${c.equipamento || "-"}

          <br>

          <b>Problema:</b>
          ${c.problema || "-"}

          <br>

          <b>Status:</b>
          ${c.status || "-"}

          <br>

          <b>Data:</b>
          ${
            c.createdAt
            ?
            new Date(c.createdAt)
            .toLocaleDateString("pt-BR")
            :
            "-"
          }

        </div>

      `;


    });


/* =====================================================
   HISTÓRICO DE VENDAS
===================================================== */

conteudo.innerHTML += `

  <hr>

  <h3>
    🛒 Histórico de Vendas
  </h3>

`;


if(!vendas.length){

  conteudo.innerHTML += `

    <div class="chamado">

      Nenhuma venda encontrada para este cliente.

    </div>

  `;

}else{

  vendas.forEach(venda => {

    const dataVenda =
      venda.createdAt
        ? new Date(
            venda.createdAt
          ).toLocaleString("pt-BR")
        : "-";


    const status =
      venda.status === "cancelada"

        ? `
          <span style="
            color:#dc2626;
            font-weight:bold;
          ">
            ❌ Cancelada
          </span>
        `

        : `
          <span style="
            color:#16a34a;
            font-weight:bold;
          ">
            ✅ Finalizada
          </span>
        `;


    let produtosVenda = "";


    if(
      Array.isArray(venda.itens) &&
      venda.itens.length
    ){

      venda.itens.forEach(item => {

        produtosVenda += `

          <div style="
            padding:6px 0;
            border-bottom:1px solid #e5e7eb;
          ">

            📦 <b>
              ${item.nomeProduto || "Produto"}
            </b>

            — ${item.quantidade}x

            ${Number(
              item.precoUnitario || 0
            ).toLocaleString(
              "pt-BR",
              {
                style:"currency",
                currency:"BRL"
              }
            )}

            =

            <b>
              ${Number(
                item.subtotal || 0
              ).toLocaleString(
                "pt-BR",
                {
                  style:"currency",
                  currency:"BRL"
                }
              )}
            </b>

          </div>

        `;

      });

    }


    conteudo.innerHTML += `

      <div class="chamado"
        style="
          border-left:5px solid #16a34a;
        "
      >

        <b>
          🛒 Venda #${venda.numeroVenda || "-"}
        </b>

        <br>

        <b>📅 Data:</b>
        ${dataVenda}

        <br>

        <b>💳 Pagamento:</b>
        ${venda.formaPagamento || "-"}

        <br><br>

        <b>📦 Produtos:</b>

        <div style="
          margin-top:8px;
          background:white;
          padding:10px;
          border-radius:6px;
        ">

          ${produtosVenda}

        </div>

        <br>

        <b>💰 Subtotal:</b>

        ${Number(
          venda.subtotal || 0
        ).toLocaleString(
          "pt-BR",
          {
            style:"currency",
            currency:"BRL"
          }
        )}

        <br>

        <b>🏷️ Desconto:</b>

        ${Number(
          venda.desconto || 0
        ).toLocaleString(
          "pt-BR",
          {
            style:"currency",
            currency:"BRL"
          }
        )}

        <br>

        <b>💵 Total:</b>

        <span style="
          font-size:18px;
          font-weight:bold;
        ">

          ${Number(
            venda.total || 0
          ).toLocaleString(
            "pt-BR",
            {
              style:"currency",
              currency:"BRL"
            }
          )}

        </span>

        <br><br>

        <b>Status:</b>
        ${status}

      </div>

    `;

  });

}


document.getElementById("modalHistorico")
  .style.display="block";


  } catch(err){

    console.log(err);

    alert(
      "Erro ao carregar histórico"
    );

  }

}



function fecharModal(){

  document.getElementById("modalHistorico")
    .style.display="none";

}

function novoChamado(){

  window.location.href =
    "/chamados.html?clienteId=" +
    encodeURIComponent(clienteSelecionado._id) +
    "&cliente=" +
    encodeURIComponent(clienteSelecionado.nome || "") +
    "&telefone=" +
    encodeURIComponent(clienteSelecionado.telefone || "") +
    "&cpfcnpj=" +
    encodeURIComponent(clienteSelecionado.cpfcnpj || "");

}

async function editarCliente(){

  const nome = prompt("Nome:", clienteSelecionado.nome || "");
  if(nome === null) return;

  const telefone = prompt("Telefone:", clienteSelecionado.telefone || "");
  if(telefone === null) return;

const aniversario = prompt(
"Data de nascimento (AAAA-MM-DD):",
clienteSelecionado.aniversario
?
clienteSelecionado.aniversario.substring(0,10)
:
""
);

if(aniversario === null) return;

  const cpfcnpj = prompt("CPF/CNPJ:", clienteSelecionado.cpfcnpj || "");
  if(cpfcnpj === null) return;

  const endereco = prompt("Endereço:", clienteSelecionado.endereco || "");
  if(endereco === null) return;

  const bairro = prompt("Bairro:", clienteSelecionado.bairro || "");
  if(bairro === null) return;

  const cidade = prompt("Cidade:", clienteSelecionado.cidade || "");
  if(cidade === null) return;

  const estado = prompt("Estado:", clienteSelecionado.estado || "");
  if(estado === null) return;

  const cep = prompt("CEP:", clienteSelecionado.cep || "");
  if(cep === null) return;

  const res = await fetch("/api/clientes/editar",{

    method:"PUT",

    headers:{
      "Content-Type":"application/json"
    },

    credentials:"include",

    body:JSON.stringify({

      nomeAntigo: clienteSelecionado.nome,

      nome,
      telefone,
      aniversario,
      cpfcnpj,
      endereco,
      bairro,
      cidade,
      estado,
      cep

    })

  });

  const data = await res.json();

  if(data.ok){

    alert("Cliente atualizado com sucesso!");

    fecharModal();

    load();

  }else{

    alert("Erro ao atualizar.");

  }

}

function abrirNovoCliente(){

  document.getElementById("modalCliente").style.display = "block";

}

function fecharNovoCliente(){

  document.getElementById("modalCliente").style.display = "none";

}

/* ===================== LOGOUT ===================== */

async function logout(){

  await fetch("/logout",{
    credentials:"include"
  });

  window.location.href="/";

}



/* ===================== INIT ===================== */
(async()=>{

  const ok = await verificarLogin();

  if(ok){

    carregarUsuario();

    load();

  }

})();

document.getElementById("modalHistorico").onclick = function(e){

  if(e.target === this){

    fecharModal();

  }

};

document.getElementById("modalCliente").onclick = function(e){

  if(e.target === this){

    fecharNovoCliente();

  }

};


</script>

</body>
</html>
