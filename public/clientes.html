<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Clientes</title>

<style>

body {
  font-family: Arial;
  background:#f2f2f2;
  margin:0;
}

.header {
  background:#2c2c44;
  color:white;
  padding:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.container {
  padding:20px;
}

.card {
  background:white;
  padding:15px;
  margin-bottom:10px;
  border-radius:8px;
  box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

a {
  color:white;
  text-decoration:none;
}

.info {
  margin-top:5px;
}

.modal {
  display:none;
  position:fixed;
  z-index:999;
  left:0;
  top:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.5);
}

.modal-content {

  background:white;
  width:90%;
  max-width:700px;
  margin:50px auto;
  padding:20px;
  border-radius:10px;
  max-height:80vh;
  overflow:auto;

}

.close {

  float:right;
  font-size:25px;
  cursor:pointer;

}

.chamado {

  background:#f5f5f5;
  padding:12px;
  margin-bottom:10px;
  border-radius:8px;
  border-left:5px solid #2c2c44;

}

</style>
</head>

<body>

<div class="header">

  <div>
    Clientes
  </div>

  <div>
    <a href="/dashboard.html">Voltar</a>
  </div>

</div>

<div class="container">

  <h2>Lista de Clientes</h2>

  <input
    id="busca"
    placeholder="Buscar por nome, telefone ou CPF"
    onkeyup="filtrar()"
    style="width:100%;padding:10px;margin-bottom:15px;border:1px solid #ccc;border-radius:6px;"
  >

  <div id="lista"></div>

</div>


<!-- MODAL HISTÓRICO -->

<div id="modalHistorico" class="modal">

  <div class="modal-content">

    <span class="close" onclick="fecharModal()">
      &times;
    </span>

    <h2 id="tituloHistorico"></h2>

    <div id="dadosCliente"></div>

    <hr>

    <h3>Histórico de Chamados</h3>

    <div id="conteudoHistorico"></div>

  </div>

</div>

<script>

/* ===================== LOGIN CHECK ===================== */
async function verificarLogin(){

  const res = await fetch("/me", {
    credentials:"include"
  });

  if(res.status === 401){
    window.location.href="/";
    return false;
  }

  return true;
}

/* ===================== DOM ===================== */
const lista = document.getElementById("lista");

let clientes = [];
let clienteSelecionado = null;

/* ===================== LOAD ===================== */
async function load(){

  try {

    const res = await fetch(
      "/api/clientes/list",
      {
        credentials: "include"
      }
    );

    const data = await res.json();

    clientes = data;

    if (!res.ok) {

      console.error(data);

      alert(
        data.error ||
        "Erro ao carregar clientes"
      );

      return;
    }

    render(clientes);

  } catch (err) {

    console.error(err);

    alert(
      "Erro de conexão com servidor"
    );
  }
}

function render(listaClientes){

  lista.innerHTML = "";

  if(!listaClientes.length){

    lista.innerHTML = `
      <div class="card">
        Nenhum cliente encontrado.
      </div>
    `;

    return;
  }

  listaClientes.sort((a,b) =>
    (a.nome || "").localeCompare(
      (b.nome || ""),
      "pt-BR",
      { sensitivity:"base" }
    )
  );

  listaClientes.forEach(c => {

  lista.innerHTML += `
    <div
      class="card"
      onclick='historico(${JSON.stringify(c.nome || "")})'
      style="cursor:pointer;"
    >

      <b>${c.nome || "Sem nome"}</b>

      <div class="info">
        📱 ${c.telefone || "Não informado"}
      </div>

      <div class="info">
        📄 ${c.cpfcnpj || "Não informado"}
      </div>

    </div>
  `;

});

}

function filtrar(){

  const termo =
    document.getElementById("busca")
      .value
      .toLowerCase();

  const resultado = clientes.filter(c => {

    return (
      String(c.nome || "")
        .toLowerCase()
        .includes(termo)

      ||

      String(c.telefone || "")
        .toLowerCase()
        .includes(termo)

      ||

      String(c.cpfcnpj || "")
        .toLowerCase()
        .includes(termo)
    );

  });

  render(resultado);

}

async function historico(nome){

  clienteSelecionado = clientes.find(
    c => c.nome === nome
  );

  try {

    const res = await fetch(
      "/api/clientes/historico/" +
      encodeURIComponent(nome),
      {
        credentials:"include"
      }
    );


    const chamados = await res.json();


    document.getElementById("tituloHistorico")
  .innerHTML =
  "Ficha do Cliente - " + nome;


const dados =
  document.getElementById("dadosCliente");


dados.innerHTML = `

  <div class="chamado">

    <b>Cliente:</b>
    ${clienteSelecionado?.nome || nome}

    <br>

    <b>Telefone:</b>
    ${clienteSelecionado?.telefone || "-"}

    <br>

    <b>CPF/CNPJ:</b>
    ${clienteSelecionado?.cpfcnpj || "-"}

  </div>

`;

const resumo = chamados.reduce((acc, c)=>{

  acc.total++;

  if(c.status === "aberto"){
    acc.abertos++;
  }

  if(c.status === "andamento"){
    acc.andamento++;
  }

  if(c.status === "reparo"){
    acc.reparo++;
  }

  if(c.status === "finalizado"){
    acc.finalizados++;
  }

  return acc;

},{
  total:0,
  abertos:0,
  andamento:0,
  reparo:0,
  finalizados:0
});


dados.innerHTML += `

<div class="chamado">

<b>Resumo do Cliente</b>

<br><br>

📋 Total de chamados:
${resumo.total}

<br>

🔴 Abertos:
${resumo.abertos}

<br>

🟡 Em andamento:
${resumo.andamento}

<br>

🔵 Em reparo:
${resumo.reparo}

<br>

🟢 Finalizados:
${resumo.finalizados}

<br><br>

<button onclick="novoChamado()">
  ➕ Novo Chamado
</button>

</div>

`;


    const conteudo =
      document.getElementById("conteudoHistorico");


    conteudo.innerHTML = "";


    if(!chamados.length){

      conteudo.innerHTML = `
        <div class="chamado">
          Nenhum chamado encontrado.
        </div>
      `;

    }


    chamados.forEach(c=>{


      conteudo.innerHTML += `

        <div class="chamado">

          <b>OS:</b>
          ${c.numeroOS || "-"}

          <br>

          <b>Equipamento:</b>
          ${c.equipamento || "-"}

          <br>

          <b>Problema:</b>
          ${c.problema || "-"}

          <br>

          <b>Status:</b>
          ${c.status || "-"}

          <br>

          <b>Data:</b>
          ${
            c.createdAt
            ?
            new Date(c.createdAt)
            .toLocaleDateString("pt-BR")
            :
            "-"
          }

        </div>

      `;


    });


    document.getElementById("modalHistorico")
      .style.display="block";


  } catch(err){

    console.log(err);

    alert(
      "Erro ao carregar histórico"
    );

  }

}


function fecharModal(){

  document.getElementById("modalHistorico")
    .style.display="none";

}

function novoChamado(){

  window.location.href =
    "/chamados.html?cliente=" +
    encodeURIComponent(clienteSelecionado.nome) +
    "&telefone=" +
    encodeURIComponent(clienteSelecionado.telefone || "") +
    "&cpfcnpj=" +
    encodeURIComponent(clienteSelecionado.cpfcnpj || "");

}

/* ===================== INIT ===================== */
(async()=>{

  const ok = await verificarLogin();

  if(ok){
    load();
  }

})();

</script>

</body>
</html>
