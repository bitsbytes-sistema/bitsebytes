<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Dashboard</title>

<style>
body { font-family: Arial; background:#f2f2f2; }
.card { background:white; padding:10px; margin:10px; border-radius:6px; }
</style>

</head>

<body>

<h2>Dashboard</h2>
<button onclick="logout()">Sair</button>

<h3>Criar Chamado</h3>

<input id="cliente" placeholder="Cliente">
<input id="telefone" placeholder="Telefone">
<input id="cpfcnpj" placeholder="CPF/CNPJ">
<input id="equipamento" placeholder="Equipamento">
<input id="problema" placeholder="Problema">

<button onclick="criar()">Criar</button>

<h3>Chamados</h3>
<div id="lista"></div>

<script>

/* LOGIN CHECK */
const user = JSON.parse(localStorage.getItem("user"));
if (!user) window.location.href = "/";

/* LOGOUT */
function logout(){
  localStorage.removeItem("user");
  window.location.href = "/";
}

/* LOAD */
async function load(){
  try {
    const res = await fetch("/api/tickets");

    if (!res.ok) {
      alert("Erro servidor");
      return;
    }

    const data = await res.json();

    const lista = document.getElementById("lista");
    lista.innerHTML = "";

    data.forEach(c => {
      lista.innerHTML += `
        <div class="card">
          <b>${c.cliente}</b><br>
          ${c.telefone}<br>
          ${c.equipamento}<br>
          ${c.problema}<br>
          ${c.status}<br>
          <button onclick="del('${c._id}')">Excluir</button>
        </div>
      `;
    });

  } catch {
    alert("Erro conexão");
  }
}

/* CREATE */
async function criar(){
  try {
    const res = await fetch("/abrir-chamado", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        cliente: cliente.value,
        telefone: telefone.value,
        cpfcnpj: cpfcnpj.value,
        equipamento: equipamento.value,
        problema: problema.value
      })
    });

    const json = await res.json();

    if (!json.ok) {
      alert("Erro ao criar");
      return;
    }

    alert("Chamado criado!");
    load();

  } catch {
    alert("Erro servidor");
  }
}

/* DELETE */
async function del(id){
  await fetch("/api/tickets/"+id,{ method:"DELETE" });
  load();
}

load();

</script>

</body>
</html>
