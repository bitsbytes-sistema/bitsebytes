<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Dashboard</title>

<style>
body {
  font-family: Arial;
  background: #f2f2f2;
  padding: 20px;
}

h2, h3 {
  color: #333;
}

input {
  padding: 8px;
  margin: 5px;
  border-radius: 5px;
  border: 1px solid #ccc;
}

button {
  padding: 8px 12px;
  border: none;
  border-radius: 5px;
  background: #007bff;
  color: white;
  cursor: pointer;
}

button:hover {
  background: #0056b3;
}

.card {
  background: white;
  padding: 15px;
  margin-top: 10px;
  border-radius: 8px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

#lista {
  margin-top: 20px;
}

#stats {
  margin-top: 10px;
  font-weight: bold;
}
</style>

</head>

<body>

<h2>Dashboard</h2>
<button onclick="logout()">Sair</button>

<h3>Status</h3>
<div id="stats"></div>

<h3>Criar Chamado</h3>

<input id="cliente" placeholder="Cliente">
<input id="telefone" placeholder="Telefone">
<input id="cpfcnpj" placeholder="CPF/CNPJ">
<input id="equipamento" placeholder="Equipamento">
<input id="problema" placeholder="Problema">

<button onclick="criar()">Criar</button>

<h3>Chamados</h3>
<div id="lista"></div>

<script>

/* LOGIN CHECK */
const user = JSON.parse(localStorage.getItem("user"));
if (!user) window.location.href = "/";

/* LOGOUT */
function logout(){
  localStorage.removeItem("user");
  window.location.href = "/";
}

/* ===================== STATS ===================== */
function loadStats(chamados){
  const aberto = chamados.filter(x=>x.status==="aberto").length;
  const andamento = chamados.filter(x=>x.status==="andamento").length;
  const finalizado = chamados.filter(x=>x.status==="finalizado").length;

  document.getElementById("stats").innerHTML = `
    🔴 Abertos: ${aberto} |
    🟡 Andamento: ${andamento} |
    🟢 Finalizados: ${finalizado}
  `;
}

/* ===================== LOAD ===================== */
async function load(){
  try {
    const res = await fetch("/api/tickets");
    const data = await res.json();

    loadStats(data);

    const lista = document.getElementById("lista");
    lista.innerHTML = "";

    data.forEach(c => {
      lista.innerHTML += `
        <div class="card">
          <b>${c.cliente}</b><br>
          ${c.telefone}<br>
          ${c.equipamento}<br>
          ${c.problema}<br>
          <b>Status:</b> ${c.status}<br>
          <button onclick="del('${c._id}')">Excluir</button>
        </div>
      `;
    });

  } catch {
    alert("Erro ao carregar");
  }
}

/* ===================== CREATE ===================== */
async function criar(){
  try {
    const res = await fetch("/abrir-chamado", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        cliente: cliente.value,
        telefone: telefone.value,
        cpfcnpj: cpfcnpj.value,
        equipamento: equipamento.value,
        problema: problema.value
      })
    });

    const json = await res.json();

    if (!json.ok) {
      alert("Erro ao criar");
      return;
    }

    alert("Chamado criado!");
    load();

  } catch {
    alert("Erro servidor");
  }
}

/* ===================== DELETE ===================== */
async function del(id){
  await fetch("/api/tickets/"+id,{ method:"DELETE" });
  load();
}

/* INIT */
load();

</script>

</body>
</html>
