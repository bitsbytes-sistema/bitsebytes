<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Dashboard</title>

<style>
body { font-family: Arial; margin:0; background:#f2f2f2; }

.header {
  background:#2c2c44;
  color:white;
  padding:15px;
  display:flex;
  justify-content:space-between;
}

.container { padding:20px; }

.card {
  background:white;
  padding:15px;
  border-radius:8px;
  margin-bottom:10px;
  box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

input { padding:10px; margin:5px; border-radius:5px; border:1px solid #ccc; }

button {
  padding:10px;
  background:#4CAF50;
  color:white;
  border:none;
  border-radius:5px;
  cursor:pointer;
}

button:hover{ background:#3d9140; }

a{ color:white; text-decoration:none; }
</style>
</head>

<body>

<div class="header">
  <div>Bits & Bytes</div>

  <div>
    <a href="/clientes.html">Clientes</a> |
    <a href="#" onclick="logout()">Sair</a>
  </div>
</div>

<div class="container">

<h3 id="plano">Plano: Teste</h3>

<h3>Resumo</h3>
<div id="stats"></div>

<h3>Criar Chamado</h3>

<input id="cpfcnpj" placeholder="CPF/CNPJ" onblur="buscarCliente()">
<input id="cliente" placeholder="Cliente">
<input id="telefone" placeholder="Telefone">
<input id="equipamento" placeholder="Equipamento">
<input id="problema" placeholder="Problema">

<button onclick="criar()">Criar</button>

<h3>Chamados</h3>
<div id="lista"></div>

</div>

<script>

const user = JSON.parse(localStorage.getItem("user"));

if (!user){
  window.location.href = "/login.html";
}

/* 🔥 FIX: função que faltava */
function buscarCliente(){
  // ainda não implementado
}

/* logout */
function logout(){
  localStorage.removeItem("user");
  window.location.href = "/login.html";
}

let chamados = [];

/* ===================== LOAD ===================== */
async function load(){

  try {
    const res = await fetch("/api/tickets");

    const data = await res.json();

    if (!res.ok) {
      console.error("ERRO BACKEND:", data);
      alert(data.error || "Erro ao carregar chamados");
      return;
    }

    if (!Array.isArray(data)) {
      console.error("Resposta inválida:", data);
      return;
    }

    chamados = data;

    lista.innerHTML = "";

    chamados.forEach(c => {

      const dataAbertura = c.createdAt
        ? new Date(c.createdAt).toLocaleString("pt-BR", {
            timeZone: "America/Cuiaba",
            hour12: false
          })
        : "Sem data";

      lista.innerHTML += `
        <div class="card">

          <b>${c.cliente}</b><br>

          📱 ${c.telefone}<br>
          💻 ${c.equipamento}<br>
          🛠 ${c.problema}<br>

          📅 Abertura: ${dataAbertura}<br><br>

          📌 <b style="color:${
            c.status==="aberto"?"red":
            c.status==="andamento"?"orange":
            "green"
          }">${c.status}</b><br><br>

          <button onclick="status('${c._id}')">Status</button>
          <button onclick="del('${c._id}')">Excluir</button>

        </div>
      `;
    });

    loadStats();

  } catch (err) {
    console.error("ERRO FETCH:", err);
    alert("Erro de conexão com servidor");
  }
}

/* ===================== STATUS ===================== */
async function status(id){

  const t = chamados.find(x => x._id === id);

  let novo = "aberto";

  if (t.status === "aberto") novo = "andamento";
  else if (t.status === "andamento") novo = "finalizado";

  await fetch("/api/tickets/" + id, {
    method: "PUT",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ status: novo })
  });

  load();
}

/* ===================== CREATE ===================== */
async function criar(){

  const res = await fetch("/abrir-chamado", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      cliente: document.getElementById("cliente").value,
      telefone: document.getElementById("telefone").value,
      cpfcnpj: document.getElementById("cpfcnpj").value,
      equipamento: document.getElementById("equipamento").value,
      problema: document.getElementById("problema").value
    })
  });

  const data = await res.json();

  if (!data.ok) {
    alert(data.error || "Erro ao criar chamado");
    return;
  }

  load();
}

/* ===================== DELETE ===================== */
async function del(id){

  await fetch("/api/tickets/" + id, {
    method: "DELETE"
  });

  load();
}

/* ===================== STATS ===================== */
function loadStats(){

  const aberto = chamados.filter(x => x.status === "aberto").length;
  const andamento = chamados.filter(x => x.status === "andamento").length;
  const finalizado = chamados.filter(x => x.status === "finalizado").length;

  stats.innerHTML = `
    🔴 Abertos: ${aberto} |
    🟡 Andamento: ${andamento} |
    🟢 Finalizados: ${finalizado}
  `;
}

load();

</script>

</body>
</html>
