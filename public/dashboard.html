<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<title>Dashboard - Bits & Bytes</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#f3f4f6;
}

.header{
  background:#111827;
  color:white;
  padding:15px 25px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.header a{
  color:white;
  text-decoration:none;
  margin-left:15px;
}

.container{
  padding:25px;
}

h2,h3{
  margin-bottom:15px;
}

.card{
  background:white;
  padding:15px;
  border-radius:10px;
  margin-bottom:15px;
  box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

input{
  padding:12px;
  margin:5px;
  border:1px solid #ccc;
  border-radius:6px;
  width:220px;
}

button{
  padding:12px 18px;
  border:none;
  border-radius:6px;
  background:#2563eb;
  color:white;
  cursor:pointer;
  font-weight:bold;
}

button:hover{
  background:#1d4ed8;
}

.status-aberto{
  color:red;
  font-weight:bold;
}

.status-andamento{
  color:orange;
  font-weight:bold;
}

.status-finalizado{
  color:green;
  font-weight:bold;
}

.stats{
  margin-bottom:20px;
  font-size:18px;
}

</style>
</head>

<body>

<div class="header">

  <div>
    <strong>Bits & Bytes</strong>
  </div>

  <div>
    <a href="/clientes">Clientes</a>
    <a href="/admin">Admin</a>
    <a href="#" onclick="logout()">Sair</a>
  </div>

</div>

<div class="container">

  <h2 id="plano">
    Plano: Carregando...
  </h2>

  <div class="stats" id="stats"></div>

  <div class="card">

    <h3>Criar Chamado</h3>

    <input id="cpfcnpj" placeholder="CPF/CNPJ">

    <input id="cliente" placeholder="Cliente">

    <input id="telefone" placeholder="Telefone">

    <input id="equipamento" placeholder="Equipamento">

    <input id="problema" placeholder="Problema">

    <button onclick="criar()">
      Criar Chamado
    </button>

  </div>

  <h3>Chamados</h3>

  <div id="lista"></div>

</div>

<script>

const lista = document.getElementById("lista");
const stats = document.getElementById("stats");

let chamados = [];

/* =========================
   USER
========================= */

async function loadUser(){

  try {

    const res = await fetch("/me", {
      credentials:"include"
    });

    if(res.status === 401){

      window.location.href="/";
      return;

    }

    const data = await res.json();

    document.getElementById("plano").innerText =
      "Plano: " + (
        data.user.role || "Padrão"
      );

  } catch(err){

    console.error(err);

  }

}

/* =========================
   LOAD
========================= */

async function load(){

  try {

    const res = await fetch("/tickets", {
      credentials:"include"
    });

    if(res.status === 401){

      window.location.href="/";
      return;

    }

    chamados = await res.json();

    lista.innerHTML = "";

    chamados.forEach(c => {

      const statusClass =
        c.status === "aberto"
        ? "status-aberto"
        : c.status === "andamento"
        ? "status-andamento"
        : "status-finalizado";

      lista.innerHTML += `

        <div class="card">

          <b>${c.cliente || ""}</b>

          <br><br>

          📱 ${c.telefone || ""}

          <br>

          💻 ${c.equipamento || ""}

          <br>

          🛠 ${c.problema || ""}

          <br><br>

          Status:
          <span class="${statusClass}">
            ${c.status || ""}
          </span>

          <br><br>

          <button onclick="status('${c._id}')">
            Alterar Status
          </button>

          <button onclick="del('${c._id}')">
            Excluir
          </button>

        </div>

      `;

    });

    loadStats();

  } catch(err){

    console.error(err);

    alert("Erro ao carregar chamados");

  }

}

/* =========================
   STATS
========================= */

function loadStats(){

  const aberto =
    chamados.filter(
      x => x.status === "aberto"
    ).length;

  const andamento =
    chamados.filter(
      x => x.status === "andamento"
    ).length;

  const finalizado =
    chamados.filter(
      x => x.status === "finalizado"
    ).length;

  stats.innerHTML = `
    🔴 Abertos: ${aberto}
    |
    🟡 Andamento: ${andamento}
    |
    🟢 Finalizados: ${finalizado}
  `;

}

/* =========================
   CREATE
========================= */

async function criar(){

  try {

    const res = await fetch("/tickets", {

      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      credentials:"include",

      body:JSON.stringify({

        cliente:
          document.getElementById("cliente").value,

        telefone:
          document.getElementById("telefone").value,

        cpfcnpj:
          document.getElementById("cpfcnpj").value,

        equipamento:
          document.getElementById("equipamento").value,

        problema:
          document.getElementById("problema").value

      })

    });

    const data = await res.json();

    if(!res.ok){

      alert(data.message || "Erro");
      return;

    }

    document.getElementById("cliente").value = "";
    document.getElementById("telefone").value = "";
    document.getElementById("cpfcnpj").value = "";
    document.getElementById("equipamento").value = "";
    document.getElementById("problema").value = "";

    load();

  } catch(err){

    console.error(err);

    alert("Erro ao criar chamado");

  }

}

/* =========================
   STATUS + WHATSAPP
========================= */

async function status(id){

  const t = chamados.find(
    x => x._id === id
  );

  if(!t){
    return;
  }

  let novo = "aberto";

  if(t.status === "aberto"){

    novo = "andamento";

  }

  else if(t.status === "andamento"){

    novo = "finalizado";

  }

  // 🔥 ABRE POPUP ANTES
  const popup = window.open("", "_blank");

  try {

    const res = await fetch("/tickets/" + id, {

      method:"PUT",

      headers:{
        "Content-Type":"application/json"
      },

      credentials:"include",

      body:JSON.stringify({
        status:novo
      })

    });

    const data = await res.json();

    console.log(data);

    if(data.whatsapp){

      popup.location.href = data.whatsapp;

    } else {

      popup.close();

      alert(
        "Telefone não encontrado"
      );

    }

    load();

  } catch(err){

    console.error(err);

    popup.close();

    alert(
      "Erro ao atualizar status"
    );

  }

}

/* =========================
   DELETE
========================= */

async function del(id){

  if(!confirm("Deseja excluir este chamado?")){
    return;
  }

  try {

    await fetch("/tickets/" + id, {

      method:"DELETE",

      credentials:"include"

    });

    load();

  } catch(err){

    console.error(err);

    alert("Erro ao excluir");

  }

}

/* =========================
   LOGOUT
========================= */

function logout(){

  fetch("/logout", {

    method:"POST",

    credentials:"include"

  }).then(() => {

    window.location.href="/";

  });

}

/* =========================
   INIT
========================= */

loadUser();
load();

</script>

</body>
</html>
