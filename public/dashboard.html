<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Dashboard</title>

<style>
body{
  font-family:Arial;
  margin:0;
  background:#f2f2f2;
}

.header{
  background:#2c2c44;
  color:white;
  padding:15px;
  display:flex;
  justify-content:space-between;
}

.container{
  padding:20px;
}

.card{
  background:white;
  padding:15px;
  border-radius:8px;
  margin-bottom:10px;
}

input{
  padding:10px;
  margin:5px;
}

button{
  padding:10px;
  background:#4CAF50;
  color:white;
  border:none;
  cursor:pointer;
}

a{
  color:white;
  text-decoration:none;
}
</style>
</head>

<body>

<div class="header">

  <div>
    Bits & Bytes
  </div>

  <div>
    <a href="/clientes">Clientes</a> |
    <a href="#" onclick="logout()">
      Sair
    </a>
  </div>

</div>

<div class="container">

  <h3 id="plano">
    Plano: Carregando...
  </h3>

  <h3>Resumo</h3>

  <div id="stats"></div>

  <h3>Criar Chamado</h3>

  <input id="cpfcnpj" placeholder="CPF/CNPJ">
  <input id="cliente" placeholder="Cliente">
  <input id="telefone" placeholder="Telefone">
  <input id="equipamento" placeholder="Equipamento">
  <input id="problema" placeholder="Problema">

  <button onclick="criar()">
    Criar
  </button>

  <h3>Chamados</h3>

  <div id="lista"></div>

</div>

<script>

const stats = document.getElementById("stats");
const lista = document.getElementById("lista");

let chamados = [];

/* =========================
   USER
========================= */

async function loadUser(){

  const res = await fetch("/me", {
    credentials:"include"
  });

  if(res.status === 401){

    window.location.href="/";
    return;

  }

  const data = await res.json();

  document.getElementById("plano").innerText =
    "Plano: " + (data.user.role || "Padrão");

}

/* =========================
   LOAD
========================= */

async function load(){

  const res = await fetch("/tickets", {
    credentials:"include"
  });

  if(res.status === 401){

    window.location.href="/";
    return;

  }

  chamados = await res.json();

  lista.innerHTML = "";

  chamados.forEach(c => {

    lista.innerHTML += `
      <div class="card">

        <b>${c.cliente || ""}</b><br><br>

        📱 ${c.telefone || ""}<br>
        💻 ${c.equipamento || ""}<br>
        🛠 ${c.problema || ""}<br><br>

        📌 ${c.status || ""}

        <br><br>

        <button onclick="status('${c._id}')">
          Status
        </button>

        <button onclick="del('${c._id}')">
          Excluir
        </button>

      </div>
    `;

  });

  loadStats();

}

/* =========================
   STATS
========================= */

function loadStats(){

  const aberto =
    chamados.filter(
      x => x.status === "aberto"
    ).length;

  const andamento =
    chamados.filter(
      x => x.status === "andamento"
    ).length;

  const finalizado =
    chamados.filter(
      x => x.status === "finalizado"
    ).length;

  stats.innerHTML = `
    🔴 ${aberto}
    |
    🟡 ${andamento}
    |
    🟢 ${finalizado}
  `;

}

/* =========================
   CREATE
========================= */

async function criar(){

  await fetch("/tickets", {

    method:"POST",

    headers:{
      "Content-Type":"application/json"
    },

    credentials:"include",

    body:JSON.stringify({

      cliente:
        document.getElementById("cliente").value,

      telefone:
        document.getElementById("telefone").value,

      cpfcnpj:
        document.getElementById("cpfcnpj").value,

      equipamento:
        document.getElementById("equipamento").value,

      problema:
        document.getElementById("problema").value

    })

  });

  load();

}

/* =========================
   STATUS
========================= */

async function status(id){

  const t = chamados.find(
    x => x._id === id
  );

  if(!t) return;

  let novo = "aberto";

  if(t.status === "aberto")
    novo = "andamento";

  else if(t.status === "andamento")
    novo = "finalizado";

  await fetch("/tickets/" + id, {

    method:"PUT",

    headers:{
      "Content-Type":"application/json"
    },

    credentials:"include",

    body:JSON.stringify({
      status:novo
    })

  });

  load();

}

/* =========================
   DELETE
========================= */

async function del(id){

  if(!confirm("Excluir chamado?"))
    return;

  await fetch("/tickets/" + id, {

    method:"DELETE",
    credentials:"include"

  });

  load();

}

/* =========================
   LOGOUT
========================= */

function logout(){

  fetch("/logout", {

    method:"POST",
    credentials:"include"

  }).then(() => {

    window.location.href="/";

  });

}

/* =========================
   INIT
========================= */

loadUser();
load();

</script>

</body>
</html>
