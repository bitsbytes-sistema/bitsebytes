<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Dashboard</title>

<style>
body {
  font-family: Arial;
  margin:0;
  background:#f2f2f2;
}

.header {
  background:#2c2c44;
  color:white;
  padding:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.container {
  padding:20px;
}

.card {
  background:white;
  padding:15px;
  border-radius:8px;
  margin-bottom:10px;
  box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

input {
  padding:10px;
  margin:5px;
  border-radius:5px;
  border:1px solid #ccc;
}

button {
  padding:10px;
  background:#4CAF50;
  color:white;
  border:none;
  border-radius:5px;
  cursor:pointer;
}

button:hover {
  background:#3d9140;
}

a {
  color:white;
  text-decoration:none;
}
</style>
</head>

<body>

<div class="header">
  <div>Bits & Bytes</div>
  <div>
    <a href="/clientes">Clientes</a> |
    <a href="#" onclick="logout()">Sair</a>
  </div>
</div>

<div class="container">

  <h3 id="plano">Plano: Teste</h3>

  <h3>Resumo</h3>
  <div id="stats"></div>

  <h3>Criar Chamado</h3>

  <input id="cpfcnpj" placeholder="CPF/CNPJ">
  <input id="cliente" placeholder="Cliente">
  <input id="telefone" placeholder="Telefone">
  <input id="equipamento" placeholder="Equipamento">
  <input id="problema" placeholder="Problema">

  <button onclick="criar()">Criar</button>

  <h3>Chamados</h3>

  <div id="lista"></div>

</div>

<script>

const stats = document.getElementById("stats");
const lista = document.getElementById("lista");

/* ===================== AUTH CHECK ===================== */
async function checkAuth() {
  const res = await fetch("/tickets", {
    credentials: "include"
  });

  if (res.status === 401) {
    window.location.href = "/";
  }
}

/* ===================== LOGOUT ===================== */
function logout() {
  fetch("/logout", {
    method: "POST",
    credentials: "include"
  }).then(() => {
    window.location.href = "/";
  });
}

/* ===================== LOAD ===================== */
let chamados = [];

async function load() {
  try {

    const res = await fetch("/tickets", {
      credentials: "include"
    });

    if (res.status === 401) {
      window.location.href = "/";
      return;
    }

    const data = await res.json();

    chamados = Array.isArray(data) ? data : [];

    lista.innerHTML = "";

    chamados.forEach(c => {

      const dataAbertura = c.createdAt
        ? new Date(c.createdAt).toLocaleString("pt-BR")
        : "Sem data";

      lista.innerHTML += `
        <div class="card">

          <b>${c.cliente || ""}</b><br><br>

          📱 ${c.telefone || ""}<br>
          💻 ${c.equipamento || ""}<br>
          🛠 ${c.problema || ""}<br><br>

          📅 ${dataAbertura}<br><br>

          📌 <b style="color:${
            c.status === "aberto"
              ? "red"
              : c.status === "andamento"
              ? "orange"
              : "green"
          }">
            ${c.status || ""}
          </b>

          <br><br>

          <button onclick="status('${c._id}')">Status</button>
          <button onclick="del('${c._id}')">Excluir</button>

        </div>
      `;
    });

    loadStats();

  } catch (err) {
    console.error(err);
  }
}

/* ===================== STATUS ===================== */
async function status(id) {

  const t = chamados.find(x => x._id === id);
  if (!t) return;

  let novo = "aberto";

  if (t.status === "aberto") novo = "andamento";
  else if (t.status === "andamento") novo = "finalizado";

  const res = await fetch("/tickets/" + id, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    credentials: "include",
    body: JSON.stringify({ status: novo })
  });

  await res.json();

  load();
}

/* ===================== CREATE ===================== */
async function criar() {

  const res = await fetch("/tickets", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    credentials: "include",
    body: JSON.stringify({
      cliente: document.getElementById("cliente").value,
      telefone: document.getElementById("telefone").value,
      cpfcnpj: document.getElementById("cpfcnpj").value,
      equipamento: document.getElementById("equipamento").value,
      problema: document.getElementById("problema").value
    })
  });

  const data = await res.json();

  if (!data._id) {
    alert("Erro ao criar chamado");
    return;
  }

  document.getElementById("cliente").value = "";
  document.getElementById("telefone").value = "";
  document.getElementById("cpfcnpj").value = "";
  document.getElementById("equipamento").value = "";
  document.getElementById("problema").value = "";

  load();
}

/* ===================== DELETE ===================== */
async function del(id) {

  if (!confirm("Excluir chamado?")) return;

  await fetch("/tickets/" + id, {
    method: "DELETE",
    credentials: "include"
  });

  load();
}

/* ===================== STATS ===================== */
function loadStats() {

  const aberto = chamados.filter(x => x.status === "aberto").length;
  const andamento = chamados.filter(x => x.status === "andamento").length;
  const finalizado = chamados.filter(x => x.status === "finalizado").length;

  stats.innerHTML = `
    🔴 Abertos: ${aberto} |
    🟡 Andamento: ${andamento} |
    🟢 Finalizados: ${finalizado}
  `;
}

/* ===================== INIT ===================== */
checkAuth();
load();

</script>

</body>
</html>
