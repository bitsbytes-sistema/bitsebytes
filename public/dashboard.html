<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Dashboard</title>

<style>

body{
  display:flex;
}

.sidebar{
  width:250px;
  background:#0f172a;
  min-height:100vh;
  color:white;
  position:fixed;
  left:0;
  top:0;
}

.logo{
  padding:20px;
  display:flex;
  gap:10px;
  align-items:center;
  border-bottom:1px solid rgba(255,255,255,.1);
}

.sidebar a{
  display:block;
  color:white;
  text-decoration:none;
  padding:14px 20px;
}

.sidebar a:hover{
  background:#1e293b;
}

.usuario{
  position:absolute;
  bottom:20px;
  left:20px;
}

.main{
  margin-left:250px;
  width:100%;
}

.topbar{
  background:white;
  height:70px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 30px;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.header{
  background:#2c2c44;
  color:white;
  padding:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.container{
  padding:20px;
}

.card{
  background:white;
  padding:15px;
  border-radius:8px;
  margin-bottom:10px;
  box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

input{
  padding:10px;
  margin:5px;
  border-radius:5px;
  border:1px solid #ccc;
}

button{
  padding:10px;
  background:#4CAF50;
  color:white;
  border:none;
  border-radius:5px;
  cursor:pointer;
  margin-right:5px;
  margin-top:5px;
}

button:hover{
  background:#3d9140;
}

a{
  color:white;
  text-decoration:none;
}

</style>
</head>

<body>

<div class="sidebar">

  <div class="logo">
    <img src="/logo.png" width="45">
    <div>
      <b>Bits & Bytes</b><br>
      <small>Tecnologia</small>
    </div>
  </div>

  <a href="/dashboard.html">🏠 Dashboard</a>
  <a href="/clientes.html">👥 Clientes</a>
  <a href="#">📋 Chamados</a>
  <a href="#">💰 Orçamentos</a>
  <a href="#">🛠 Serviços</a>
  <a href="#">📄 Laudos Técnicos</a>
  <a href="#">📦 Peças e Estoque</a>
  <a href="#">💵 Financeiro</a>
  <a href="#">📊 Relatórios</a>
  <a href="#">⚙️ Configurações</a>

  <div class="usuario">
    <b>Genilton</b><br>
    <small>Administrador</small>
  </div>

</div>

<div class="main">

<div class="topbar">

  <div>
    Sistema de Gestão
  </div>

  <div>
    <a href="javascript:void(0)" onclick="logout()">Sair</a>
  </div>

</div>

<div class="container">

  <h3 id="plano">
    Plano: Carregando...
  </h3>

  <h3>Resumo</h3>

  <div id="stats"></div>

  <h3>Criar Chamado</h3>

  <input id="cpfcnpj" placeholder="CPF/CNPJ">
  <input id="cliente" placeholder="Cliente">
  <input id="telefone" placeholder="Telefone">
  <input id="equipamento" placeholder="Equipamento">
  <input id="problema" placeholder="Problema">

  <button onclick="criar()">
    Criar
  </button>

  <h3>Chamados</h3>

  <div id="lista"></div>

</div>

<script>

const stats = document.getElementById("stats");
const lista = document.getElementById("lista");

let chamados = [];

/* ===================== EMPRESA ===================== */

async function carregarEmpresa(){

  try {

    const res = await fetch("/me", {
      credentials:"include"
    });

    console.log("STATUS /me =", res.status);

    if(res.status === 401){
      alert("Sessão perdida em /me");
      window.location.href="/";
      return;
    }

    const data = await res.json();

    if(data.company){
      document.getElementById("plano").innerText =
        "Plano: " + (data.company.plan || "Free");
    }

  } catch(err){
    console.log(err);
  }

}

/* ===================== LOAD ===================== */

async function load(){

  try {

    const res = await fetch("/api/tickets", {
  credentials:"include"
});

console.log("STATUS /api/tickets =", res.status);

if(res.status === 401){
  alert("Sessão perdida em /api/tickets");
  window.location.href="/";
  return;
}

    chamados = await res.json();

    lista.innerHTML = "";

    chamados.forEach(c => {

      const dataAbertura =
        c.createdAt
        ? new Date(c.createdAt).toLocaleString("pt-BR", {
            timeZone: "America/Cuiaba"
          })
        : "Sem data";

      lista.innerHTML += `

        <div class="card">

          <b>${c.cliente || ""}</b>

          <br><br>

          📱 ${c.telefone || ""}<br>
          📄 ${c.cpfcnpj || ""}<br>
          💻 ${c.equipamento || ""}<br>
          🛠 ${c.problema || ""}

          <br><br>

          📅 ${dataAbertura}

          <br><br>

          📌 <b style="
            color:${
              c.status === "aberto"
              ? "red"
              : c.status === "andamento"
              ? "orange"
              : c.status === "reparo"
              ? "#d97706"
              : "green"
            }
          ">
            ${String(c.status).toUpperCase()}
          </b>

          <br><br>

          <button onclick="status('${c._id}')">
            Status
          </button>

          ${
            c.status === "finalizado"
            ? `<button onclick="abrirLaudo('${c._id}')">Laudo</button>`
            : ""
          }

          <button onclick="del('${c._id}')">
            Excluir
          </button>

        </div>

      `;

    });

    loadStats();

  } catch(err){
    console.log(err);
    alert("Erro ao carregar chamados");
  }

}

/* ===================== STATS ===================== */

function loadStats(){

  const aberto =
    chamados.filter(x => x.status === "aberto").length;

  const andamento =
    chamados.filter(x => x.status === "andamento").length;

  const reparo =
    chamados.filter(x => x.status === "reparo").length;

  const finalizado =
    chamados.filter(x => x.status === "finalizado").length;

  stats.innerHTML = `
    🔴 Abertos: ${aberto}
    |
    🟡 Andamento: ${andamento}
    |
    🟠 Reparo: ${reparo}
    |
    🟢 Finalizados: ${finalizado}
  `;
}

/* ===================== CRIAR ===================== */

async function criar(){

  const cliente = document.getElementById("cliente").value.trim();
  const telefone = document.getElementById("telefone").value.trim();
  const cpfcnpj = document.getElementById("cpfcnpj").value.trim();
  const equipamento = document.getElementById("equipamento").value.trim();
  const problema = document.getElementById("problema").value.trim();

  if(!cliente || !telefone || !equipamento || !problema){
    alert("Preencha todos os campos");
    return;
  }

  await fetch("/api/tickets", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    credentials: "include",
    body: JSON.stringify({
      cliente,
      telefone,
      cpfcnpj,
      equipamento,
      problema
    })
  });

  document.getElementById("cliente").value = "";
  document.getElementById("telefone").value = "";
  document.getElementById("cpfcnpj").value = "";
  document.getElementById("equipamento").value = "";
  document.getElementById("problema").value = "";

  load();
}

/* ===================== STATUS ===================== */

async function status(id){

  const t = chamados.find(x => x._id === id);
  if(!t) return;

  let novo = "aberto";

  if(t.status === "aberto") novo = "andamento";
  else if(t.status === "andamento") novo = "reparo";
  else if(t.status === "reparo") novo = "finalizado";
  else if(t.status === "finalizado") novo = "aberto"; // opcional ciclo

  const res = await fetch("/api/tickets/" + id, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    credentials: "include",
    body: JSON.stringify({ status: novo })
  });

  const data = await res.json();

  if(data.whatsapp){
    window.open(data.whatsapp, "_blank");
  }

  load();
}

/* ===================== LAUDO ===================== */

function abrirLaudo(id){
  window.location.href = "/laudo.html?id=" + id;
}

/* ===================== DELETE ===================== */

async function del(id){

  if(!confirm("Deseja excluir?")) return;

  await fetch("/api/tickets/" + id, {
    method: "DELETE",
    credentials: "include"
  });

  load();
}

/* ===================== LOGOUT ===================== */

async function logout(){
  await fetch("/logout", { credentials: "include" });
  window.location.href = "/";
}

/* ===================== INIT ===================== */

carregarEmpresa();
load();

</script>

</div>
</div>

</body>
</html>
