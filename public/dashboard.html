<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Dashboard</title>

<style>

body{
  font-family:Arial;
  margin:0;
  background:#f2f2f2;
}

.header{
  background:#2c2c44;
  color:white;
  padding:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.container{
  padding:20px;
}

.card{
  background:white;
  padding:15px;
  border-radius:8px;
  margin-bottom:10px;
  box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

input{
  padding:10px;
  margin:5px;
  border-radius:5px;
  border:1px solid #ccc;
}

button{
  padding:10px;
  background:#4CAF50;
  color:white;
  border:none;
  border-radius:5px;
  cursor:pointer;
  margin-right:5px;
  margin-top:5px;
}

button:hover{
  background:#3d9140;
}

.btn-laudo{
  background:#2563eb;
}

.btn-laudo:hover{
  background:#1d4ed8;
}

a{
  color:white;
  text-decoration:none;
}

</style>
</head>

<body>

<div class="header">

  <div>
    Bits & Bytes
  </div>

  <div>
    <a href="/clientes.html">Clientes</a> |
    <a href="#" onclick="logout()">Sair</a>
  </div>

</div>

<div class="container">

  <h3 id="plano">
    Plano: Carregando...
  </h3>

  <h3>Resumo</h3>

  <div id="stats"></div>

  <h3>Criar Chamado</h3>

  <input
    id="cpfcnpj"
    placeholder="CPF/CNPJ"
  >

  <input
    id="cliente"
    placeholder="Cliente"
  >

  <input
    id="telefone"
    placeholder="Telefone"
  >

  <input
    id="equipamento"
    placeholder="Equipamento"
  >

  <input
    id="problema"
    placeholder="Problema"
  >

  <button onclick="criar()">
    Criar
  </button>

  <h3>Chamados</h3>

  <div id="lista"></div>

</div>

<script>

/* ===================== */
/* DOM */
/* ===================== */

const stats =
  document.getElementById("stats");

const lista =
  document.getElementById("lista");

/* ===================== */
/* VAR */
/* ===================== */

let chamados = [];

/* ===================== */
/* EMPRESA */
/* ===================== */

async function carregarEmpresa(){

  try {

    const res =
      await fetch(
        "/me",
        {
          credentials: "include"
        }
      );

    if(res.status === 401){

      window.location.href = "/";

      return;
    }

    const data =
      await res.json();

    if(data.company){

      document
      .getElementById("plano")
      .innerText =
        "Plano: " +
        (
          data.company.plan ||
          "Free"
        );

    }

  } catch(err){

    console.log(err);

  }

}

/* ===================== */
/* LOAD */
/* ===================== */

async function load(){

  try {

    const res =
      await fetch(
        "/api/tickets",
        {
          credentials: "include"
        }
      );

    if(res.status === 401){

      window.location.href = "/";

      return;
    }

    chamados =
      await res.json();

    lista.innerHTML = "";

    chamados.forEach(c => {

      const dataAbertura =
        c.createdAt
        ? new Date(c.createdAt)
          .toLocaleString(
            "pt-BR",
            {
              timeZone:
                "America/Cuiaba"
            }
          )
        : "Sem data";

      lista.innerHTML += `

      <div class="card">

        <b>${c.cliente || ""}</b>

        <br><br>

        📱 ${c.telefone || ""}

        <br>

        📄 ${c.cpfcnpj || ""}

        <br>

        💻 ${c.equipamento || ""}

        <br>

        🛠 ${c.problema || ""}

        <br><br>

        📅 ${dataAbertura}

        <br><br>

        📌
        <b style="color:${
          c.status === "aberto"
          ? "red"
          : c.status === "andamento"
          ? "orange"
          : "green"
        }">

          ${String(c.status).toUpperCase()}

        </b>

        <br><br>

        <button onclick="status('${c._id}')">
          Status
        </button>

        <button onclick="del('${c._id}')">
          Excluir
        </button>

        <button
          class="btn-laudo"
          onclick="gerarLaudo('${c._id}')"
        >
          Gerar Laudo
        </button>

      </div>

      `;

    });

    loadStats();

  } catch(err){

    console.log(err);

    alert(
      "Erro ao carregar chamados"
    );

  }

}

/* ===================== */
/* STATS */
/* ===================== */

function loadStats(){

  const aberto =
    chamados.filter(
      x => x.status === "aberto"
    ).length;

  const andamento =
    chamados.filter(
      x => x.status === "andamento"
    ).length;

  const finalizado =
    chamados.filter(
      x => x.status === "finalizado"
    ).length;

  stats.innerHTML = `

    🔴 Abertos: ${aberto}
    |
    🟡 Andamento: ${andamento}
    |
    🟢 Finalizados: ${finalizado}

  `;

}

/* ===================== */
/* CRIAR */
/* ===================== */

async function criar(){

  const cliente =
    document.getElementById("cliente").value.trim();

  const telefone =
    document.getElementById("telefone").value.trim();

  const cpfcnpj =
    document.getElementById("cpfcnpj").value.trim();

  const equipamento =
    document.getElementById("equipamento").value.trim();

  const problema =
    document.getElementById("problema").value.trim();

  if(
    !cliente ||
    !telefone ||
    !equipamento ||
    !problema
  ){
    alert(
      "Preencha todos os campos"
    );
    return;
  }

  const res =
    await fetch(
      "/api/tickets",
      {

        method: "POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        credentials: "include",

        body: JSON.stringify({

          cliente,
          telefone,
          cpfcnpj,
          equipamento,
          problema

        })

      }
    );

  const data =
    await res.json();

  if(!res.ok){

    alert(
      data.error ||
      "Erro ao criar chamado"
    );

    return;

  }

  document.getElementById("cliente").value = "";
  document.getElementById("telefone").value = "";
  document.getElementById("cpfcnpj").value = "";
  document.getElementById("equipamento").value = "";
  document.getElementById("problema").value = "";

  load();

}

/* ===================== */
/* STATUS */
/* ===================== */

async function status(id){

  const t =
    chamados.find(
      x => x._id === id
    );

  if(!t) return;

  let novo = "aberto";

  if(t.status === "aberto"){

    novo = "andamento";

  }

  else if(
    t.status === "andamento"
  ){

    novo = "finalizado";

  }

  const res =
    await fetch(
      "/api/tickets/" + id,
      {

        method: "PUT",

        headers:{
          "Content-Type":
            "application/json"
        },

        credentials: "include",

        body: JSON.stringify({
          status: novo
        })

      }
    );

  const data =
    await res.json();

  if(data.whatsapp){

    window.open(
      data.whatsapp,
      "_blank"
    );

  }

  load();

}

/* ===================== */
/* DELETE */
/* ===================== */

async function del(id){

  if(
    !confirm(
      "Deseja excluir?"
    )
  ){
    return;
  }

  await fetch(
    "/api/tickets/" + id,
    {
      method: "DELETE",
      credentials: "include"
    }
  );

  load();

}

/* ===================== */
/* LAUDO */
/* ===================== */

function gerarLaudo(id){

  window.open(
    "/laudo.html?id=" + id,
    "_blank"
  );

}

/* ===================== */
/* LOGOUT */
/* ===================== */

async function logout(){

  await fetch(
    "/logout",
    {
      credentials: "include"
    }
  );

  window.location.href = "/";

}

/* ===================== */
/* INIT */
/* ===================== */

carregarEmpresa();

load();

</script>

</body>
</html>
