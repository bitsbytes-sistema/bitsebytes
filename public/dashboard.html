<script>

let chamados = [];

async function load() {
  const res = await fetch("/api/tickets");
  chamados = await res.json();

  lista.innerHTML = "";

  chamados.forEach(c => {
    lista.innerHTML += `
      <div class="card">
        <b>${c.cliente}</b><br>
        📱 ${c.telefone}<br>
        💻 ${c.equipamento}<br>
        🛠 ${c.problema}<br>
        📌 <b style="color:${
          c.status === "aberto" ? "red" :
          c.status === "andamento" ? "orange" :
          "green"
        }">${c.status}</b><br>

        <button onclick="status('${c._id}')">Status</button>
        <button onclick="del('${c._id}')">Excluir</button>
      </div>
    `;
  });

  loadStats();
}

async function status(id) {
  const t = chamados.find(x => x._id === id);

  let novo = "aberto";
  if (t.status === "aberto") novo = "andamento";
  else if (t.status === "andamento") novo = "finalizado";

  const res = await fetch("/api/tickets/" + id, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ status: novo })
  });

  const data = await res.json();

  if (data.whatsapp) {
    window.open(data.whatsapp, "_blank");
  }

  load();
}

/* 🔥 FIX PRINCIPAL AQUI */
async function criar() {

  const body = {
    cliente: cliente.value,
    telefone: telefone.value,
    cpfcnpj: cpfcnpj.value,
    equipamento: equipamento.value,
    problema: problema.value
  };

  const res = await fetch("/abrir-chamado", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });

  const data = await res.json();

  if (res.status === 403 || data.error) {
    alert(data.error || "Limite atingido!");
    return;
  }

  cliente.value = "";
  telefone.value = "";
  cpfcnpj.value = "";
  equipamento.value = "";
  problema.value = "";

  load();
}

async function buscarCliente() {
  // REMOVIDO porque /api/clientes NÃO existe no seu backend
  return;
}

async function del(id) {
  await fetch("/api/tickets/" + id, { method: "DELETE" });
  load();
}

async function loadStats() {
  const aberto = chamados.filter(x => x.status === "aberto").length;
  const andamento = chamados.filter(x => x.status === "andamento").length;
  const finalizado = chamados.filter(x => x.status === "finalizado").length;

  stats.innerHTML = `
    🔴 Abertos: ${aberto} |
    🟡 Andamento: ${andamento} |
    🟢 Finalizados: ${finalizado}
  `;
}

/* 🔥 FIX PLAN SAFE */
async function loadPlano() {
  try {
    const res = await fetch("/session");
    const data = await res.json();

    if (!data.logged) return;

    plano.innerText = "Plano: " + (data.company?.plan || "sem plano");

  } catch (err) {
    console.log(err);
  }
}

load();
loadPlano();

</script>
