<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Dashboard</title>

<style>
body { font-family: Arial; margin:0; background:#f2f2f2; }
.header { background:#2c2c44; color:white; padding:15px; display:flex; justify-content:space-between; }
.container { padding:20px; }
.card { background:white; padding:15px; margin-bottom:10px; border-radius:8px; }
input { padding:10px; margin:5px; }
button { padding:10px; background:#4CAF50; color:white; border:none; cursor:pointer; }
</style>
</head>

<body>

<div class="header">
  <div>Bits & Bytes</div>
  <button onclick="logout()">Sair</button>
</div>

<div class="container">

<h3>Chamados</h3>
<div id="lista"></div>

<h3>Criar Chamado</h3>

<input id="cliente" placeholder="Cliente">
<input id="telefone" placeholder="Telefone">
<input id="cpfcnpj" placeholder="CPF/CNPJ">
<input id="equipamento" placeholder="Equipamento">
<input id="problema" placeholder="Problema">

<button onclick="criar()">Criar</button>

</div>

<script>

/* LOGIN CHECK */
const user = JSON.parse(localStorage.getItem("user"));
if (!user) window.location.href = "/";

/* LOGOUT */
function logout() {
  localStorage.removeItem("user");
  window.location.href = "/";
}

/* LISTA */
let chamados = [];

async function load() {
  const res = await fetch("/api/tickets");
  chamados = await res.json();

  const lista = document.getElementById("lista");
  lista.innerHTML = "";

  chamados.forEach(c => {
    lista.innerHTML += `
      <div class="card">
        <b>${c.cliente}</b><br>
        ${c.telefone}<br>
        ${c.equipamento}<br>
        ${c.problema}<br>
        <b>${c.status}</b><br>

        <button onclick="del('${c._id}')">Excluir</button>
      </div>
    `;
  });
}

/* CRIAR */
async function criar() {
  await fetch("/abrir-chamado", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      cliente: cliente.value,
      telefone: telefone.value,
      cpfcnpj: cpfcnpj.value,
      equipamento: equipamento.value,
      problema: problema.value
    })
  });

  load();
}

/* DELETE */
async function del(id) {
  await fetch("/api/tickets/" + id, { method: "DELETE" });
  load();
}

load();

</script>

</body>
</html>
