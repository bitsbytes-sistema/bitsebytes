<body>

<div class="header">

  <div>
    Bits & Bytes
  </div>

  <div>
    <a href="/clientes.html">Clientes</a> |
    <a href="#" onclick="logout()">Sair</a>
  </div>

</div>

<div class="container">

  <h3 id="plano">Plano: Teste</h3>

  <h3>Resumo</h3>
  <div id="stats"></div>

  <h3>Criar Chamado</h3>

  <input id="cpfcnpj" placeholder="CPF/CNPJ" onblur="buscarCliente()">
  <input id="cliente" placeholder="Cliente">
  <input id="telefone" placeholder="Telefone">
  <input id="equipamento" placeholder="Equipamento">
  <input id="problema" placeholder="Problema">

  <button onclick="criar()">Criar</button>

  <h3>Chamados</h3>

  <div id="lista"></div>

</div>

<script>

/* ===================== DOM ===================== */
const stats = document.getElementById("stats");
const lista = document.getElementById("lista");

/* ===================== LOGIN ===================== */
const user = JSON.parse(localStorage.getItem("user"));

if (!user) {
  window.location.href = "/";
}

/* ===================== BUSCAR CLIENTE ===================== */
function buscarCliente(){
  // futuro
}

/* ===================== LOGOUT ===================== */
function logout(){

  localStorage.removeItem("user");

  fetch("/logout", {
    credentials: "include"
  });

  window.location.href = "/";
}

/* ===================== VAR ===================== */
let chamados = [];

/* ===================== LOAD ===================== */
async function load(){

  try {

    const res = await fetch("/api/tickets", {
      credentials: "include"
    });

    const data = await res.json();

    if (!res.ok) {

      console.error("ERRO BACKEND:", data);

      alert(data.error || "Erro ao carregar chamados");

      return;
    }

    chamados = Array.isArray(data)
      ? data
      : [];

    lista.innerHTML = "";

    chamados.forEach(c => {

      const dataAbertura = c.createdAt
        ? new Date(c.createdAt).toLocaleString(
            "pt-BR",
            {
              timeZone: "America/Cuiaba",
              hour12: false
            }
          )
        : "Sem data";

      lista.innerHTML += `
        <div class="card">

          <b>${c.cliente || ""}</b><br><br>

          📱 ${c.telefone || ""}<br>
          💻 ${c.equipamento || ""}<br>
          🛠 ${c.problema || ""}<br><br>

          📅 Abertura: ${dataAbertura}<br><br>

          📌 <b style="color:${
            c.status === "aberto"
              ? "red"
              : c.status === "andamento"
              ? "orange"
              : "green"
          }">
            ${c.status || ""}
          </b>

          <br><br>

          <button onclick="status('${c._id}')">
            Status
          </button>

          <button onclick="del('${c._id}')">
            Excluir
          </button>

        </div>
      `;
    });

    loadStats();

  } catch (err) {

    console.error("ERRO FETCH:", err);

    alert("Erro de conexão com servidor");
  }
}

/* ===================== STATUS ===================== */
async function status(id){

  const t = chamados.find(
    x => x._id === id
  );

  if (!t) {
    return;
  }

  let novo = "aberto";

  if (t.status === "aberto") {

    novo = "andamento";

  } else if (t.status === "andamento") {

    novo = "finalizado";
  }

  const res = await fetch(
    "/api/tickets/" + id,
    {
      method: "PUT",
      headers: {
        "Content-Type": "application/json"
      },
      credentials: "include",
      body: JSON.stringify({
        status: novo
      })
    }
  );

  const data = await res.json();

  if (data.whatsapp) {

    window.open(
      data.whatsapp,
      "_blank"
    );
  }

  load();
}

/* ===================== CREATE ===================== */
async function criar(){

  const res = await fetch(
    "/abrir-chamado",
    {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      credentials: "include",
      body: JSON.stringify({
        cliente: document.getElementById("cliente").value,
        telefone: document.getElementById("telefone").value,
        cpfcnpj: document.getElementById("cpfcnpj").value,
        equipamento: document.getElementById("equipamento").value,
        problema: document.getElementById("problema").value
      })
    }
  );

  const data = await res.json();

  if (!data.ok) {

    alert(
      data.error ||
      "Erro ao criar chamado"
    );

    return;
  }

  document.getElementById("cliente").value = "";
  document.getElementById("telefone").value = "";
  document.getElementById("cpfcnpj").value = "";
  document.getElementById("equipamento").value = "";
  document.getElementById("problema").value = "";

  load();
}

/* ===================== DELETE ===================== */
async function del(id){

  if (!confirm("Deseja excluir este chamado?")) {
    return;
  }

  await fetch(
    "/api/tickets/" + id,
    {
      method: "DELETE",
      credentials: "include"
    }
  );

  load();
}

/* ===================== STATS ===================== */
function loadStats(){

  const aberto = chamados.filter(
    x => x.status === "aberto"
  ).length;

  const andamento = chamados.filter(
    x => x.status === "andamento"
  ).length;

  const finalizado = chamados.filter(
    x => x.status === "finalizado"
  ).length;

  stats.innerHTML = `
    🔴 Abertos: ${aberto}
    |
    🟡 Andamento: ${andamento}
    |
    🟢 Finalizados: ${finalizado}
  `;
}

/* ===================== INIT ===================== */
load();

</script>

</body>
</html>
