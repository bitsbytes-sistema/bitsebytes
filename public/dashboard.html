<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Dashboard</title>

<style>

body{
  display:flex;
  margin:0;
  font-family:Arial;
}

/* SIDEBAR */
.sidebar{
  width:250px;
  background:#0f172a;
  min-height:100vh;
  color:white;
  position:fixed;
  left:0;
  top:0;
}

.logo{
  padding:20px;
  display:flex;
  gap:10px;
  align-items:center;
  border-bottom:1px solid rgba(255,255,255,.1);
}

.sidebar a{
  display:block;
  color:white;
  text-decoration:none;
  padding:14px 20px;
}

.sidebar a:hover{
  background:#1e293b;
}

.usuario{
  position:absolute;
  bottom:20px;
  left:20px;
}

/* MAIN */
.main{
  margin-left:250px;
  width:100%;
  background:#f2f2f2;
  min-height:100vh;
}

/* TOPBAR */
.topbar{
  background:white;
  height:70px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 30px;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
}

/* CONTAINER */
.container{
  padding:20px;
}

/* STATS GRID */
.stats-grid{
  display:grid;
  grid-template-columns:repeat(4, 1fr);
  gap:15px;
}

/* CARDS */
.stat-card{
  background:white;
  padding:20px;
  border-radius:10px;
  box-shadow:0 2px 8px rgba(0,0,0,0.08);
  text-align:center;
  font-weight:bold;
}

.stat-card h2{
  margin:0;
  font-size:28px;
}

.stat-card small{
  display:block;
  margin-top:5px;
  color:#666;
}

.red{ border-left:5px solid red; }
.yellow{ border-left:5px solid #facc15; }
.orange{ border-left:5px solid orange; }
.green{ border-left:5px solid #22c55e; }

</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

  <div class="logo">
    <img src="/logo.png" width="45">
    <div>
      <b>Bits & Bytes</b><br>
      <small>Tecnology</small>
    </div>
  </div>

  <a href="/dashboard.html">🏠 Dashboard</a>
  <a href="/clientes.html">👥 Clientes</a>
  <a href="/chamados.html">📋 Chamados</a>
  <a href="#">💰 Orçamentos</a>
  <a href="#">🛠 Serviços</a>
  <a href="#">📄 Laudos Técnicos</a>
  <a href="#">📦 Estoque</a>
  <a href="#">💵 Financeiro</a>
  <a href="#">📊 Relatórios</a>
  <a href="#">⚙️ Configurações</a>

  <div class="usuario">
    <b id="nomeUsuario">Carregando...</b><br>
    <small id="cargoUsuario">Usuário</small>
  </div>

</div>

<!-- MAIN -->
<div class="main">

  <div class="topbar">
    <div>📊 Dashboard</div>
    <a href="javascript:void(0)" onclick="logout()">Sair</a>
  </div>

  <div class="container">

    <h3>Resumo Geral</h3>

    <div id="stats" class="stats-grid"></div>

  </div>

</div>

<script>

/* ===================== USUÁRIO ===================== */
async function carregarUsuario(){

  const res = await fetch("/me", {
    credentials:"include"
  });

  if(res.status === 401){
    window.location.href="/";
    return;
  }

  const data = await res.json();

  document.getElementById("nomeUsuario").innerText =
    data.user?.username || "Usuário";

  document.getElementById("cargoUsuario").innerText =
    data.user?.role || "Usuário";
}


/* ===================== STATS ===================== */
async function loadStats(){

  const res = await fetch("/api/tickets", {
    credentials:"include"
  });

  const chamados = await res.json();

  const aberto = chamados.filter(x => x.status === "aberto").length;
  const andamento = chamados.filter(x => x.status === "andamento").length;
  const reparo = chamados.filter(x => x.status === "reparo").length;
  const finalizado = chamados.filter(x => x.status === "finalizado").length;

  document.getElementById("stats").innerHTML = `

    <div class="stat-card red">
      <h2>${aberto}</h2>
      <small>Abertos</small>
    </div>

    <div class="stat-card yellow">
      <h2>${andamento}</h2>
      <small>Andamento</small>
    </div>

    <div class="stat-card orange">
      <h2>${reparo}</h2>
      <small>Reparo</small>
    </div>

    <div class="stat-card green">
      <h2>${finalizado}</h2>
      <small>Finalizados</small>
    </div>

  `;
}


/* ===================== LOGOUT ===================== */
async function logout(){
  await fetch("/logout", { credentials:"include" });
  window.location.href="/";
}


/* INIT */
carregarUsuario();
loadStats();

</script>

</body>
</html>
