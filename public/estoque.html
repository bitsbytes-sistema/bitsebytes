<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<title>Bits & Bytes - Estoque</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial;
    background:#f2f2f2;
}

/* ================= SIDEBAR ================= */

.sidebar{

    width:250px;
    background:#0f172a;
    min-height:100vh;
    color:white;
    position:fixed;
    left:0;
    top:0;

}

.logo{

    padding:20px;
    display:flex;
    gap:10px;
    align-items:center;
    border-bottom:1px solid rgba(255,255,255,.1);

}

.sidebar a{

    display:block;
    color:white;
    text-decoration:none;
    padding:14px 20px;

}

.sidebar a:hover{

    background:#1e293b;

}

.usuario{

    position:absolute;
    bottom:20px;
    left:20px;

}

/* ================= MAIN ================= */

.main{

    margin-left:250px;
    width:calc(100% - 250px);
    min-height:100vh;

}

/* ================= TOPBAR ================= */

.topbar{

    height:70px;
    background:white;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 30px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);

}

.topbar a{

    color:#dc2626;
    text-decoration:none;
    font-weight:bold;

}

/* ================= CONTAINER ================= */

.container{

    padding:20px;

}

/* ================= CARD ================= */

.card{

    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);

}

/* ================= TABLE ================= */

table{

    width:100%;
    border-collapse:collapse;
    background:white;
    table-layout:fixed;

}

th{

    background:#0f172a;
    color:white;
    padding:10px;
    text-align:center;

}

td{

    padding:10px;
    border-bottom:1px solid #eee;
    text-align:center;
    vertical-align:middle;

}

th:nth-child(1),
td:nth-child(1){ width:90px; }

th:nth-child(2),
td:nth-child(2){ width:250px; }

th:nth-child(3),
td:nth-child(3){ width:150px; }

th:nth-child(4),
td:nth-child(4){ width:90px; }

th:nth-child(5),
td:nth-child(5){ width:120px; }

th:nth-child(6),
td:nth-child(6){ width:120px; }

th:nth-child(7),
td:nth-child(7){ width:180px; }

/* ================= BUTTON ================= */

button{

    padding:8px 12px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    background:#2563eb;
    color:white;

}

button:hover{

    opacity:.9;

}

td button{

    margin:4px;
    min-width:60px;

}

</style>

</head>

<body>

<div class="sidebar">

    <div class="logo">

        <img src="/logo.png" width="45">

        <div>

            <b>Bits & Bytes</b><br>

            <small>Tecnology</small>

        </div>

    </div>

    <a href="/dashboard.html">🏠 Dashboard</a>
    <a href="/clientes.html">👥 Clientes</a>
    <a href="/chamados.html">📋 Chamados</a>
    <a href="/orcamentos.html">💰 Orçamentos</a>
    <a href="/services.html">🛠 Serviços</a>
    <a href="/laudos.html">📄 Laudos Técnicos</a>
    <a href="/estoque.html">📦 Estoque</a>
    <a href="/financeiro.html">💵 Financeiro</a>
    <a href="/relatorios.html">📊 Relatórios</a>
    <a href="/configuracoes.html">⚙️ Configurações</a>

    <div class="usuario">

        <b id="nomeUsuario">Carregando...</b>

        <br>

        <small id="cargoUsuario"></small>

    </div>

</div>

<div class="main">

    <div class="topbar">

        <div>📦 Estoque</div>

        <a href="javascript:void(0)" onclick="logout()">
            Sair
        </a>

    </div>

    <div class="container">

        <h2>📦 Estoque</h2>

        <button onclick="novoProduto()">

            ➕ Novo Produto

        </button>

        <br><br>

        <div class="card">

            <table>

                <thead>

                    <tr>

                        <th>Código</th>
                        <th>Produto</th>
                        <th>Categoria</th>
                        <th>Qtde</th>
                        <th>Custo</th>
                        <th>Venda</th>
                        <th>Ações</th>

                    </tr>

                </thead>

                <tbody id="lista">

                </tbody>

            </table>

        </div>

    </div>

</div>

<script>

let produtos = [];

/* ================= USUÁRIO ================= */

async function carregarUsuario(){

    const res = await fetch("/me",{
        credentials:"include"
    });

    if(res.status === 401){
        window.location.href="/";
        return;
    }

    const data = await res.json();

    document.getElementById("nomeUsuario").innerText =
        data.user.username;

    document.getElementById("cargoUsuario").innerText =
        data.user.role;

}

/* ================= LISTAR PRODUTOS ================= */

async function load(){

    const res = await fetch("/api/products",{
        credentials:"include"
    });

    if(!res.ok){

        alert("Erro ao carregar produtos.");

        return;

    }

    produtos = await res.json();

    if(!Array.isArray(produtos)){

        produtos = [];

    }

    render();

}

/* ================= RENDER ================= */

function render(){

    const lista = document.getElementById("lista");

    lista.innerHTML = "";

    if(produtos.length === 0){

        lista.innerHTML = `
            <tr>
                <td colspan="7" style="text-align:center;">
                    Nenhum produto cadastrado.
                </td>
            </tr>
        `;

        return;
    }

    produtos.forEach(p=>{

let estoque = "";

if((p.quantidade || 0) <= 0){

    estoque =
    '<span style="color:#dc2626;font-weight:bold;">🔴 0</span>';

}else if((p.quantidade || 0) <= 5){

    estoque =
    '<span style="color:#f59e0b;font-weight:bold;">🟡 ' +
    (p.quantidade || 0) +
    '</span>';

}else{

    estoque =
    '<span style="color:#16a34a;font-weight:bold;">🟢 ' +
    (p.quantidade || 0) +
    '</span>';

}

        lista.innerHTML += `

        <tr>

            <td>${p.codigo || "-"}</td>

            <td>${p.nome}</td>

            <td>${p.categoria || "-"}</td>

            <td>${estoque}</td>

            <td>
                ${Number(p.custo || 0).toLocaleString("pt-BR",{
                    style:"currency",
                    currency:"BRL"
                })}
            </td>

            <td>
                ${Number(p.venda || 0).toLocaleString("pt-BR",{
                    style:"currency",
                    currency:"BRL"
                })}
            </td>

            <td>

                <button
                    onclick="abrir('${p._id}')">
                    Abrir
                </button>

                <button
                    style="background:#dc2626"
                    onclick="excluirProduto('${p._id}')">
                    Excluir
                </button>

            </td>

        </tr>

        `;

    });

}

/* ================= NOVO ================= */

function novoProduto(){

    location.href="/novo-produto.html";

}

/* ================= ABRIR ================= */

function abrir(id){

    location.href="/produto.html?id="+id;

}

/* ================= EXCLUIR ================= */

async function excluirProduto(id){

    if(!confirm("Deseja excluir este produto?"))
        return;

    const res = await fetch(
        "/api/products/"+id,
        {
            method:"DELETE",
            credentials:"include"
        }
    );

    const data = await res.json();

    if(data.ok){

        load();

    }else{

        alert(data.error || "Erro ao excluir.");

    }

}

/* ================= LOGOUT ================= */

async function logout(){

    await fetch("/logout",{
        credentials:"include"
    });

    location.href="/";

}

/* ================= INIT ================= */

window.onload=()=>{

    carregarUsuario();

    load();

};

</script>

</body>
</html>
