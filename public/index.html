<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Bits & Bytes - Login</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #1f1f2e, #2c2c44);
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.box {
  background: white;
  padding: 40px;
  border-radius: 12px;
  width: 320px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  text-align: center;
}

h2 {
  margin-bottom: 20px;
  color: #333;
}

input {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  border: 1px solid #ccc;
  border-radius: 6px;
}

button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  background: #4CAF50;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-weight: bold;
}

button:hover {
  background: #45a049;
}

.logo {
  font-size: 22px;
  font-weight: bold;
  color: #4CAF50;
  margin-bottom: 10px;
}

.msg {
  margin-top: 10px;
  font-size: 13px;
  color: red;
}
</style>

</head>
<body>

<div class="box">
  <div class="logo">Bits & Bytes</div>

  <h2>Login SaaS</h2>

  <form id="loginForm">
    <input type="text" id="username" placeholder="Usuário" required>
    <input type="password" id="password" placeholder="Senha" required>

    <button type="submit">Entrar</button>

    <div class="msg" id="msg"></div>
  </form>
</div>

<script>
const form = document.getElementById("loginForm");
const msg = document.getElementById("msg");

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  msg.innerText = "Entrando...";

  const res = await fetch("/login", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      username: username.value,
      password: password.value
    })
  });

  const data = await res.json();

  if (data.success) {
    window.location.href = "/dashboard.html";
  } else {
    msg.innerText = "Login inválido";
  }
});
</script>

</body>
</html>
