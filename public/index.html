<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bits & Bytes Tecnology - Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;

    background:
        radial-gradient(
            circle at 50% 35%,
            rgba(0,102,255,.13),
            transparent 38%
        ),
        linear-gradient(
            90deg,
            rgba(1,8,20,.88) 0%,
            rgba(1,8,20,.48) 28%,
            rgba(1,8,20,.38) 50%,
            rgba(1,8,20,.48) 72%,
            rgba(1,8,20,.88) 100%
        ),
        linear-gradient(
            180deg,
            rgba(0,7,18,.30) 0%,
            rgba(0,7,18,.48) 55%,
            rgba(0,7,18,.90) 100%
        ),
        url("/login-background.png");

    background-size:
        auto,
        auto,
        auto,
        cover;

    background-position:
        center,
        center,
        center,
        center center;

    background-repeat:no-repeat;
    background-attachment:fixed;

    color:#ffffff;
    overflow-x:hidden;
}


/* =====================================================
   CAMADA PRINCIPAL
===================================================== */

.login-page{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
}


/* =====================================================
   MARCA SUPERIOR
===================================================== */

.brand-area{
    display:flex;
    justify-content:center;
    align-items:center;
    padding:28px 20px 8px;
    padding-bottom:35px;
}

.brand{
    display:flex;
    flex-direction:column;
    justify-content:center;
    text-align:center;
    align-items:center;
    gap:20px;
}

.brand-logo{
    width:200px;
    max-height:195px;
    object-fit:contain;
    filter:
        drop-shadow(0 0 12px rgba(0,132,255,.35))
        drop-shadow(0 0 24px rgba(0,132,255,.20));
}

.brand-text{
    line-height:1.05;
}

.brand-title{
    font-size:46px;
    font-weight:800;
    letter-spacing:1px;
    color:#ffffff;
    text-shadow:0 3px 14px rgba(0,0,0,.65);
}

.brand-title span{
    display:block;
    margin-top:5px;
    color:#1694ff;
    font-size:30px;
    letter-spacing:8px;
    font-weight:700;
}

.brand-subtitle{
    margin-top:8px;
    font-size:20px;
    color:#f8fafc;
}


/* =====================================================
   BENEFÍCIOS À ESQUERDA
===================================================== */

.beneficios{
    position:absolute;
    left:42px;
    top:85px;
    display:flex;
    flex-direction:column;
    gap:26px;
    z-index:2;
}

.beneficio{
    display:flex;
    align-items:center;
    gap:15px;
    font-size:17px;
    color:#f8fafc;
    text-shadow:0 2px 6px rgba(0,0,0,.7);
}

.beneficio-icone{
    width:38px;
    height:38px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#168cff;
    font-size:27px;
    filter:drop-shadow(0 0 8px rgba(0,140,255,.65));
}


/* =====================================================
   ÁREA CENTRAL
===================================================== */

.login-content{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:22px 20px 120px;
}


/* =====================================================
   CARD LOGIN
===================================================== */

.login-card{
    position:relative;
    width:100%;
    max-width:650px;

    background:
        linear-gradient(
            180deg,
            rgba(3,14,29,.94),
            rgba(2,10,22,.97)
        );

    border:1px solid #148cff;
    border-radius:24px;

    box-shadow:
        0 0 0 1px rgba(0,132,255,.12),
        0 0 26px rgba(0,132,255,.28),
        0 28px 80px rgba(0,0,0,.65);

    padding:72px 54px 28px;
}


/* =====================================================
   CADEADO SUPERIOR
===================================================== */

.lock-circle{
    position:absolute;
    top:-46px;
    left:50%;
    transform:translateX(-50%);

    width:92px;
    height:92px;

    border-radius:50%;
    border:1px solid #168cff;

    background:
        radial-gradient(
            circle at center,
            #062a50,
            #020b17 70%
        );

    display:flex;
    align-items:center;
    justify-content:center;

    color:#168cff;
    font-size:43px;

    box-shadow:
        0 0 20px rgba(0,140,255,.32);
}


/* =====================================================
   TÍTULOS
===================================================== */

.login-card h1{
    text-align:center;
    font-size:34px;
    margin-bottom:8px;
}

.login-subtitle{
    text-align:center;
    color:#b8c0cc;
    font-size:18px;
    margin-bottom:34px;
}


/* =====================================================
   CAMPOS
===================================================== */

.field{
    position:relative;
    margin-bottom:16px;
}

.field-icon{
    position:absolute;
    left:18px;
    top:50%;
    transform:translateY(-50%);
    font-size:23px;
    color:#0f172a;
}

.field input{
    width:100%;
    height:58px;

    border:1px solid #455366;
    border-radius:9px;

    background:rgba(4,13,25,.72);
    color:#ffffff;

    padding:0 54px;
    font-size:18px;
    outline:none;

    transition:.2s;
}

.field input::placeholder{
    color:#9ca8b7;
}

.field input:focus{
    border-color:#168cff;
    box-shadow:
        0 0 0 3px rgba(22,140,255,.10),
        0 0 15px rgba(22,140,255,.10);
}

.password-toggle{
    position:absolute;
    right:17px;
    top:50%;
    transform:translateY(-50%);

    border:none;
    background:transparent;

    color:#475569;
    font-size:22px;

    width:auto;
    padding:0;
    margin:0;

    cursor:pointer;
}


/* =====================================================
   OPÇÕES LOGIN
===================================================== */

.login-options{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    margin:20px 0 26px;
}

.remember{
    display:flex;
    align-items:center;
    gap:10px;
    cursor:pointer;
    color:#f8fafc;
}

.remember input{
    width:21px;
    height:21px;
    accent-color:#168cff;
}

.forgot{
    color:#1694ff;
    text-decoration:none;
    font-size:16px;
}

.forgot:hover{
    text-decoration:underline;
}


/* =====================================================
   BOTÃO ENTRAR
===================================================== */

.btn-login{
    width:100%;
    height:62px;

    border:none;
    border-radius:8px;

    background:
        linear-gradient(
            180deg,
            #1784ff,
            #0b54d9
        );

    color:#ffffff;

    font-size:22px;
    font-weight:700;

    cursor:pointer;

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.18),
        0 8px 25px rgba(0,88,255,.28);

    transition:.2s;
}

.btn-login:hover{
    filter:brightness(1.08);
    transform:translateY(-1px);
}

.btn-login:disabled{
    opacity:.65;
    cursor:not-allowed;
    transform:none;
}


/* =====================================================
   SEPARADOR
===================================================== */

.separator{
    display:flex;
    align-items:center;
    gap:16px;
    margin:28px 0 18px;
    color:#aeb8c6;
}

.separator::before,
.separator::after{
    content:"";
    flex:1;
    height:1px;
    background:#344257;
}


/* =====================================================
   ACESSO RÁPIDO
===================================================== */

.quick-access{
    display:flex;
    justify-content:center;
}

.quick-button{
    width:310px;
    height:54px;

    border:1px solid #475569;
    border-radius:8px;

    background:rgba(5,14,25,.72);
    color:#ffffff;

    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;

    font-size:17px;
    cursor:pointer;
}

.quick-button:hover{
    border-color:#168cff;
}


/* =====================================================
   ERRO
===================================================== */

.error{
    min-height:22px;
    color:#fb7185;
    text-align:center;
    margin-top:18px;
    font-size:14px;
}


/* =====================================================
   COPYRIGHT
===================================================== */

.card-footer{
    text-align:center;
    margin-top:18px;
    color:#aeb8c6;
    font-size:15px;
    line-height:1.5;
}

.card-footer strong{
    color:#168cff;
    font-weight:500;
}


/* =====================================================
   BARRA INFERIOR
===================================================== */

.bottom-bar{
    min-height:82px;

    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    align-items:center;

    padding:0 55px;

    background:rgba(1,9,20,.78);

    border-top:1px solid rgba(82,109,143,.40);

    backdrop-filter:blur(8px);
}

.contact-item{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:16px;

    color:#d6dde7;
    font-size:18px;
}

.contact-icon{
    color:#168cff;
    font-size:25px;
}


/* =====================================================
   MOBILE / PWA
===================================================== */

@media(max-width:1100px){

    .beneficios{
        display:none;
    }

    .brand-title{
        font-size:38px;
    }

    .brand-title span{
        font-size:25px;
    }

}


@media(max-width:760px){

    body{
        background-position:center center;
    }

    .brand-area{
        padding-top:22px;
    }

    .brand{
        flex-direction:column;
        gap:8px;
        text-align:center;
    }

    .brand-logo{
        width:120px;
    }

    .brand-title{
        font-size:27px;
    }

    .brand-title span{
        font-size:20px;
        letter-spacing:4px;
    }

    .brand-subtitle{
        font-size:15px;
    }

    .login-content{
        padding-top:58px;
        padding-bottom:35px;
    }

    .login-card{
        max-width:520px;
        padding:
            62px
            22px
            24px;

        border-radius:18px;
    }

    .login-card h1{
        font-size:28px;
    }

    .login-subtitle{
        font-size:15px;
    }

    .login-options{
        align-items:flex-start;
        flex-direction:column;
        gap:14px;
    }

    .quick-button{
        width:100%;
    }

    .bottom-bar{
        grid-template-columns:1fr;
        gap:10px;
        padding:18px;
    }

    .contact-item{
        font-size:14px;
    }

}


@media(max-width:430px){

    .brand-logo{
        width:105px;
    }

    .brand-title{
        font-size:23px;
    }

    .brand-title span{
        font-size:17px;
    }

    .login-card{
        padding-left:16px;
        padding-right:16px;
    }

    .field input{
        font-size:16px;
    }

}


.field input:-webkit-autofill,
.field input:-webkit-autofill:hover,
.field input:-webkit-autofill:focus,
.field input:-webkit-autofill:active{
    -webkit-text-fill-color:#ffffff !important;
    -webkit-box-shadow:0 0 0 1000px #071321 inset !important;
    box-shadow:0 0 0 1000px #071321 inset !important;
    caret-color:#ffffff !important;
    border:1px solid #455366 !important;
}
</style>
</head>


<body>

<div class="login-page">


    <header class="brand-area">

        <div class="brand">

            <img
                src="/logo.png"
                class="brand-logo"
                alt="Bits & Bytes Tecnology"
            >

            <div class="brand-text">

                <div class="brand-title">
                    BITS & BYTES
                    <span>TECNOLOGY</span>
                </div>

                <div class="brand-subtitle">
                    Sistemas e Assistência Técnica
                </div>

            </div>

        </div>

    </header>


    <!-- =================================================
         LOGIN
    ================================================== -->

    <main class="login-content">

        <section class="login-card">


            <div class="lock-circle">
                🔒
            </div>


            <h1>
                Bem-vindo!
            </h1>

            <div class="login-subtitle">
                Faça login para acessar o sistema
            </div>


            <form id="loginForm">


                <div class="field">

                    <span class="field-icon">👤</span>

                    <input
                        type="text"
                        id="username"
                        placeholder="Usuário"
                        required
                        autocomplete="username"
                    >

                </div>


                <div class="field">

                    <span class="field-icon">
                        🔒
                    </span>

                    <input
                        type="password"
                        id="password"
                        placeholder="Senha"
                        required
                        autocomplete="current-password"
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        id="togglePassword"
                        aria-label="Mostrar senha"
                    >
                        👁
                    </button>

                </div>


                <div class="login-options">

                    <label class="remember">

                        <input
                            type="checkbox"
                            id="rememberMe"
                        >

                        <span>
                            Lembrar-me
                        </span>

                    </label>


                    <a
                        href="#"
                        class="forgot"
                        onclick="return false;"
                    >
                        Esqueceu sua senha?
                    </a>

                </div>


                <button
                    type="submit"
                    id="btnLogin"
                    class="btn-login"
                >
                    Entrar &nbsp; →
                </button>


                <div
                    class="error"
                    id="erro"
                ></div>


            </form>


            <div class="separator">
                <span>ou</span>
            </div>


            <div class="quick-access">

                <button
                    type="button"
                    class="quick-button"
                    onclick="return false;"
                >
                    🛡
                    <span>Acesso Rápido</span>
                    <span class="quick-chevron" aria-hidden="true">
    <svg
        viewBox="0 0 24 24"
        width="16"
        height="16"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
    >
        <path d="m6 9 6 6 6-6"></path>
    </svg>
</span>
                </button>

            </div>


            <div class="card-footer">

                © 2026 Bits & Bytes
                <strong>Tecnology</strong>

                <br>

                Todos os direitos reservados.

            </div>


        </section>

    </main>


    <!-- =================================================
         RODAPÉ
    ================================================== -->




</div>


<script>


/* =====================================================
   MOSTRAR / OCULTAR SENHA
===================================================== */

const campoSenha =
    document.getElementById(
        "password"
    );


const botaoSenha =
    document.getElementById(
        "togglePassword"
    );


botaoSenha.addEventListener(
    "click",
    () => {

        if(
            campoSenha.type ===
            "password"
        ){

            campoSenha.type =
                "text";

            botaoSenha.innerText =
                "⊘";

            botaoSenha.setAttribute(
                "aria-label",
                "Ocultar senha"
            );

        } else {

            campoSenha.type =
                "password";

            botaoSenha.innerText =
                "👁";

            botaoSenha.setAttribute(
                "aria-label",
                "Mostrar senha"
            );

        }

    }
);


/* =====================================================
   LEMBRAR USUÁRIO
===================================================== */

const campoUsuario =
    document.getElementById(
        "username"
    );


const lembrar =
    document.getElementById(
        "rememberMe"
    );


const usuarioSalvo =
    localStorage.getItem(
        "bitsbytes_usuario"
    );


if(usuarioSalvo){

    campoUsuario.value =
        usuarioSalvo;

    lembrar.checked =
        true;

}


lembrar.addEventListener(
    "change",
    () => {

        if(!lembrar.checked){

            localStorage.removeItem(
                "bitsbytes_usuario"
            );

        }

    }
);


/* =====================================================
   LOGIN
===================================================== */

document
    .getElementById(
        "loginForm"
    )
    .addEventListener(
        "submit",
        async (e) => {

            e.preventDefault();


            const erro =
                document.getElementById(
                    "erro"
                );


            const btn =
                document.getElementById(
                    "btnLogin"
                );


            erro.innerText =
                "";

            btn.innerText =
                "Entrando...";

            btn.disabled =
                true;


            try{

                const username =
                    campoUsuario.value;


                const password =
                    campoSenha.value;


                const res =
                    await fetch(
                        "/login",
                        {

                            method:
                                "POST",

                            credentials:
                                "include",

                            headers:{
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({
                                    username,
                                    password
                                })

                        }
                    );


                const data =
                    await res.json();


                if(data.success){

                    if(
                        lembrar.checked
                    ){

                        localStorage.setItem(
                            "bitsbytes_usuario",
                            username
                        );

                    } else {

                        localStorage.removeItem(
                            "bitsbytes_usuario"
                        );

                    }


                    window.location.href =
                        "/dashboard";

                } else {

                    erro.innerText =
                        data.error ||
                        data.message ||
                        "Usuário ou senha inválidos";

                }


            }catch(err){

                console.error(
                    err
                );


                erro.innerText =
                    "Erro ao conectar com servidor";

            }


            btn.innerText =
                "Entrar →";

            btn.disabled =
                false;

        }
    );


</script>

</body>
</html>
