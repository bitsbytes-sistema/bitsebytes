<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Bits & Bytes Assistência Técnica</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, sans-serif;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:#fff;
  padding:20px;
}

.login-box{
  background:#111827;
  padding:40px;
  border-radius:12px;
  width:100%;
  max-width:350px;
  text-align:center;
  box-shadow:0 0 20px rgba(0,0,0,0.5);
}

.logo{
  width:190px;
  margin-bottom:15px;
}

h2{
  margin-bottom:25px;
  font-size:22px;
}

input{
  width:100%;
  padding:12px;
  margin:10px 0;
  border:none;
  border-radius:6px;
  outline:none;
  font-size:15px;
}

button{
  width:100%;
  padding:12px;
  background:#2563eb;
  color:#fff;
  border:none;
  border-radius:6px;
  cursor:pointer;
  margin-top:10px;
  font-weight:bold;
  font-size:15px;
}

button:hover{
  background:#1d4ed8;
}

.error{
  color:#f87171;
  margin-top:15px;
  font-size:14px;
}

.loading{
  opacity:0.7;
  pointer-events:none;
}

</style>
</head>

<body>

<div class="login-box">

  <img src="/logo.png" class="logo" alt="Logo">

  <h2>Bits & Bytes Assistência Técnica</h2>

  <form id="loginForm">

    <input
      type="text"
      id="username"
      placeholder="Usuário"
      required
      autocomplete="username"
    >

    <input
      type="password"
      id="password"
      placeholder="Senha"
      required
      autocomplete="current-password"
    >

    <button type="submit" id="btnLogin">
      Entrar
    </button>

  </form>

  <div class="error" id="erro"></div>

</div>

<script>

document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const erro = document.getElementById("erro");
  const btn = document.getElementById("btnLogin");

  erro.innerText = "";
  btn.innerText = "Entrando...";
  btn.disabled = true;

  try {

    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    const res = await fetch("/login", {
      method: "POST",
      credentials: "include", // 🔥 ESSENCIAL (você já tem, ok)
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        username,
        password
      })
    });

    const data = await res.json();

    if (data.success) {

  window.location.href = "/dashboard";

} else {

  erro.innerText =
    data.error ||
    data.message ||
    "Usuário ou senha inválidos";

}

  } catch (err) {
    console.error(err);
    erro.innerText = "Erro ao conectar com servidor";
  }

  btn.innerText = "Entrar";
  btn.disabled = false;

});

</script>

</body>
</html>
