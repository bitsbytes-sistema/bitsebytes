<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laudo Técnico</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:Arial;
  background:#f3f4f6;
  padding:30px;
  color:#111827;
}

.laudo{
  max-width:900px;
  margin:auto;
  background:#fff;
  padding:40px;
  border-radius:15px;
  box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

.topo{
  display:flex;
  justify-content:space-between;
  border-bottom:2px solid #e5e7eb;
  padding-bottom:20px;
  margin-bottom:20px;
}

.logo{font-size:24px;font-weight:bold;color:#2563eb;}

.titulo{text-align:right;}

.bloco{margin-top:20px;}

h2{color:#2563eb;font-size:18px;margin-bottom:10px;}

.info{
  background:#f9fafb;
  padding:15px;
  border-radius:10px;
}

textarea{
  width:100%;
  min-height:120px;
  border:none;
  outline:none;
  background:transparent;
  font-size:15px;
  resize:vertical;
}

.status{
  background:#e5e7eb;
  padding:4px 10px;
  border-radius:8px;
  display:inline-block;
  font-weight:bold;
}

button{
  margin-top:20px;
  background:#2563eb;
  color:#fff;
  border:none;
  padding:12px 18px;
  border-radius:10px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="laudo">

  <div class="topo">
    <div class="logo">Bits & Bytes</div>
    <div class="titulo">
      <h1>LAUDO TÉCNICO</h1>
      <p>OS: <span id="osid"></span></p>
      <p id="dataAtual"></p>
    </div>
  </div>

  <div class="bloco">
    <h2>Cliente</h2>
    <div class="info" id="cliente"></div>
  </div>

  <div class="bloco">
    <h2>Equipamento</h2>
    <div class="info">
      <div id="equipamento"></div>
      <div id="status" class="status"></div>
    </div>
  </div>

  <div class="bloco">
    <h2>Problema</h2>
    <div class="info" id="problema"></div>
  </div>

  <div class="bloco">
    <h2>Diagnóstico</h2>
    <div class="info">
      <textarea id="diagnostico"></textarea>
    </div>
  </div>

  <div class="bloco">
    <h2>Serviço Realizado</h2>
    <div class="info">
      <textarea id="servico"></textarea>
    </div>
  </div>

  <div class="bloco">
    <h2>Conclusão Técnica</h2>
    <div class="info">
      <textarea id="conclusao"></textarea>
    </div>
  </div>

  <button onclick="salvarLaudo()">Salvar</button>

</div>

<script>

let ticketId = null;
let timeout = null;

/* ===================== CARREGAR ===================== */
async function carregarLaudo() {

  ticketId = new URLSearchParams(window.location.search).get("id");

  console.log("Ticket ID:", ticketId);

  if (!ticketId) {
    alert("ID do ticket não encontrado na URL");
    return;
  }

  try {

    const res = await fetch("/api/tickets/" + ticketId, {
      credentials: "include"
    });

    console.log("Status API:", res.status);

    if (!res.ok) {
      console.error("Erro na API ao carregar ticket");
      return;
    }

    const t = await res.json();

    console.log("DADOS RECEBIDOS:", t);

    if (!t) {
      console.error("Ticket vazio");
      return;
    }

    document.getElementById("osid").innerText = t._id || "";

    document.getElementById("cliente").innerText = t.cliente || "";
    document.getElementById("equipamento").innerText = t.equipamento || "";
    document.getElementById("status").innerText = (t.status || "").toUpperCase();
    document.getElementById("problema").innerText = t.problema || "";

    document.getElementById("diagnostico").value = t.diagnostico || "";
    document.getElementById("servico").value = t.servico || "";
    document.getElementById("conclusao").value = t.conclusao || "";

    document.getElementById("dataAtual").innerText =
      new Date().toLocaleString("pt-BR");

  } catch (err) {
    console.error("Erro ao carregar laudo:", err);
  }
}

/* ===================== SALVAR ===================== */
function salvarLaudo() {

  if (!ticketId) return;

  clearTimeout(timeout);

  timeout = setTimeout(async () => {

    try {

      const payload = {
        diagnostico: document.getElementById("diagnostico").value || "",
        servico: document.getElementById("servico").value || "",
        conclusao: document.getElementById("conclusao").value || ""
      };

      const res = await fetch("/api/tickets/" + ticketId + "/laudo", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        credentials: "include",
        body: JSON.stringify(payload)
      });

      if (!res.ok) {
        console.error("Erro ao salvar laudo");
      }

    } catch (err) {
      console.error("Erro no salvamento:", err);
    }

  }, 500);

}

/* EVENTS */
document.getElementById("diagnostico").addEventListener("input", salvarLaudo);
document.getElementById("servico").addEventListener("input", salvarLaudo);
document.getElementById("conclusao").addEventListener("input", salvarLaudo);

carregarLaudo();

</script>

</body>
</html>
