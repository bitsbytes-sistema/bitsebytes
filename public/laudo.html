<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Laudo Técnico</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;
  background:#f3f4f6;
  padding:30px;
  color:#111827;
}

.laudo{
  max-width:900px;
  margin:auto;
  background:#fff;
  border-radius:15px;
  padding:40px;
  box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

.topo{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:30px;
  border-bottom:2px solid #e5e7eb;
  padding-bottom:20px;
}

.logo{
  font-size:28px;
  font-weight:bold;
  color:#2563eb;
}

.titulo{
  text-align:right;
}

.titulo h1{
  font-size:28px;
}

.titulo p{
  color:#6b7280;
}

.bloco{
  margin-top:25px;
}

.bloco h2{
  font-size:18px;
  margin-bottom:10px;
  color:#2563eb;
}

.info{
  background:#f9fafb;
  border-radius:10px;
  padding:15px;
  line-height:1.8;
}

.footer{
  margin-top:50px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.assinatura{
  margin-top:50px;
}

.linha{
  width:250px;
  border-top:1px solid #000;
  margin-top:50px;
  padding-top:5px;
  text-align:center;
}

button{
  background:#2563eb;
  color:#fff;
  border:none;
  padding:14px 20px;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

button:hover{
  opacity:0.9;
}

textarea{
  width:100%;
  min-height:140px;
  border:none;
  resize:vertical;
  outline:none;
  background:transparent;
  font-size:15px;
  font-family:Arial;
  line-height:1.8;
}

.status{
  font-weight:bold;
  padding:4px 10px;
  border-radius:8px;
  background:#e5e7eb;
  display:inline-block;
}

/* PRINT */
@media print{
  button{
    display:none;
  }

  body{
    background:#fff;
    padding:0;
  }

  .laudo{
    box-shadow:none;
  }
}

</style>
</head>

<body>

<div class="laudo">

  <div class="topo">

    <div class="logo">
      Bits & Bytes Tecnology
    </div>

    <div class="titulo">
      <h1>LAUDO TÉCNICO</h1>
      <p>OS: <strong id="osid"></strong></p>
      <p id="dataAtual"></p>
    </div>

  </div>

  <div class="bloco">

    <h2>Dados do Cliente</h2>

    <div class="info">
      <strong>Cliente:</strong> <span id="cliente"></span><br>
      <strong>CPF/CNPJ:</strong> <span id="cpfcnpj"></span><br>
      <strong>Telefone:</strong> <span id="telefone"></span>
    </div>

  </div>

  <div class="bloco">

    <h2>Equipamento</h2>

    <div class="info">

      <strong>Equipamento:</strong> <span id="equipamento"></span><br>

      <strong>Status:</strong>
      <span id="status" class="status"></span>

    </div>

  </div>

  <div class="bloco">

    <h2>Problema Relatado</h2>

    <div class="info">
      <span id="problema"></span>
    </div>

  </div>

  <div class="bloco">

    <h2>Diagnóstico Técnico</h2>

    <div class="info">

      <textarea id="diagnostico"
        placeholder="Descreva detalhadamente o diagnóstico técnico realizado..."></textarea>

    </div>

  </div>

  <div class="bloco">

    <h2>Serviço Realizado</h2>

    <div class="info">

      <textarea id="servico"
        placeholder="Descreva o serviço executado, peças trocadas, reparos realizados..."></textarea>

    </div>

  </div>

  <!-- NOVO: CONCLUSÃO PROFISSIONAL -->
  <div class="bloco">

    <h2>Conclusão Técnica</h2>

    <div class="info">

      <textarea id="conclusao"
        placeholder="Conclusão final do atendimento técnico e situação do equipamento..."></textarea>

    </div>

  </div>

  <div class="footer">

    <button onclick="window.print()">
      Baixar / Imprimir PDF
    </button>

    <div class="assinatura">

      <div class="linha">
        Responsável Técnico
      </div>

    </div>

  </div>

</div>

<script>

let ticketId = null;

/* CARREGAR */
async function carregarLaudo(){

  const params = new URLSearchParams(window.location.search);
  ticketId = params.get("id");

  if(!ticketId){
    alert("Laudo não encontrado");
    return;
  }

  const res = await fetch("/api/tickets", { credentials:"include" });
  const tickets = await res.json();

  const ticket = tickets.find(t => t._id === ticketId);

  if(!ticket){
    alert("Chamado não encontrado");
    return;
  }

  document.getElementById("osid").innerText = ticket._id;

  document.getElementById("cliente").innerText = ticket.cliente || "";
  document.getElementById("cpfcnpj").innerText = ticket.cpfcnpj || "";
  document.getElementById("telefone").innerText = ticket.telefone || "";
  document.getElementById("equipamento").innerText = ticket.equipamento || "";

  document.getElementById("status").innerText =
    String(ticket.status || "").toUpperCase();

  document.getElementById("problema").innerText = ticket.problema || "";

  document.getElementById("diagnostico").value = ticket.diagnostico || "";
  document.getElementById("servico").value = ticket.servico || "";
  document.getElementById("conclusao").value = ticket.conclusao || "";

  document.getElementById("dataAtual").innerText =
    new Date().toLocaleString("pt-BR");

}

/* SALVAR */
async function salvarLaudo(){

  if(!ticketId) return;

  try{

    await fetch("/api/tickets/" + ticketId + "/laudo",{
      method:"PUT",
      headers:{ "Content-Type":"application/json" },
      credentials:"include",
      body: JSON.stringify({
        diagnostico: document.getElementById("diagnostico").value,
        servico: document.getElementById("servico").value,
        conclusao: document.getElementById("conclusao").value
      })
    });

  }catch(err){
    console.log(err);
  }

}

/* AUTO SAVE */
document.getElementById("diagnostico").addEventListener("input", salvarLaudo);
document.getElementById("servico").addEventListener("input", salvarLaudo);
document.getElementById("conclusao").addEventListener("input", salvarLaudo);

carregarLaudo();

</script>

</body>
</html>
