<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<title>Laudos Técnicos</title>

<style>

body{
  display:flex;
  margin:0;
  font-family:Arial;
  background:#f2f2f2;
}

/* SIDEBAR */

.sidebar{
  width:250px;
  background:#0f172a;
  min-height:100vh;
  color:white;
  position:fixed;
  left:0;
  top:0;
}

.logo{
  padding:20px;
  display:flex;
  gap:10px;
  align-items:center;
  border-bottom:1px solid rgba(255,255,255,.1);
}

.sidebar a{
  display:block;
  color:white;
  text-decoration:none;
  padding:14px 20px;
}

.sidebar a:hover{
  background:#1e293b;
}

.usuario{
  position:absolute;
  bottom:20px;
  left:20px;
}

/* MAIN */

.main{
  margin-left:250px;
  width:100%;
}

.topbar{

  height:70px;
  background:white;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 30px;

  box-shadow:0 2px 10px rgba(0,0,0,.08);

}

/* CONTAINER */

.container{

  padding:20px;

}

/* CARD */

.card{

  background:white;

  padding:20px;

  border-radius:10px;

  box-shadow:0 2px 8px rgba(0,0,0,.08);

}

/* BOTÃO */

.btn{

  background:#2563eb;
  color:white;

  border:0;

  padding:10px 15px;

  border-radius:6px;

  cursor:pointer;

}

/* INPUT */

input{

  width:100%;

  padding:10px;

  margin:20px 0;

  border:1px solid #ccc;

  border-radius:6px;

  box-sizing:border-box;

}

/* TABELA */

table{

  width:100%;

  border-collapse:collapse;

}

th{

  background:#0f172a;

  color:white;

  padding:12px;

}

td{

  padding:12px;

  border-bottom:1px solid #eee;

}

.status{

  color:green;
  font-weight:bold;

}

button{

  padding:8px 12px;

  border:0;

  border-radius:5px;

  cursor:pointer;

}

</style>

</head>

<body>

<div class="sidebar">

<div class="logo">

<img src="/logo.png" width="45">

<div>

<b>Bits & Bytes</b><br>

<small>Tecnology</small>

</div>

</div>

<a href="/dashboard.html">🏠 Dashboard</a>
<a href="/clientes.html">👥 Clientes</a>
<a href="/chamados.html">📋 Chamados</a>
<a href="/orcamentos.html">💰 Orçamentos</a>
<a href="/services.html">🛠 Peças e Serviços</a>
<a href="/laudos.html">📄 Laudos Técnicos</a>
<a href="/estoque.html">📦 Estoque</a>
<a href="/vendas.html">🛒 Vendas</a>
<a href="/financeiro.html">💵 Financeiro</a>
<a href="/lembretes.html">🔔 Lembretes</a>
<a href="/relatorios.html">📊 Relatórios</a>
<a href="/configuracoes.html">⚙️ Configurações</a>

<div class="usuario">

<b id="nomeUsuario">
Carregando...
</b>

<br>

<small id="cargoUsuario">
Usuário
</small>

</div>

</div>

<div class="main">

<div class="topbar">

<div>
📄 Laudos Técnicos
</div>

<a href="javascript:void(0)" onclick="logout()">
Sair
</a>

</div>

<div class="container">

<div class="card">

<h2>Laudos Técnicos</h2>

<input
id="busca"
placeholder="Buscar por cliente, equipamento ou OS..."
onkeyup="filtrar()"
>

<table>

<thead>

<tr>

<th>OS</th>
<th>Cliente</th>
<th>Equipamento</th>
<th>Data</th>
<th>Status</th>
<th>Ações</th>

</tr>

</thead>

<tbody id="lista">

</tbody>

</table>

</div>

</div>

</div>

<script>

const lista = document.getElementById("lista");

let laudos = [];

/* ===================== USUÁRIO ===================== */

async function carregarUsuario(){

  const res = await fetch("/me",{
    credentials:"include"
  });

  if(res.status===401){
    location.href="/";
    return;
  }

  const data = await res.json();

  document.getElementById("nomeUsuario").innerText =
    data.user?.username || "Usuário";

  document.getElementById("cargoUsuario").innerText =
    data.user?.role || "Usuário";

}

/* ===================== CARREGAR ===================== */

async function carregar(){

  const res = await fetch("/api/tickets",{
    credentials:"include"
  });

  const chamados = await res.json();

  laudos = chamados.filter(c => c.status === "finalizado");

  mostrar(laudos);

}

/* ===================== TABELA ===================== */

function mostrar(listaLaudos){

  lista.innerHTML="";

  if(listaLaudos.length===0){

    lista.innerHTML=`
      <tr>
        <td colspan="6" style="text-align:center;">
          Nenhum laudo encontrado.
        </td>
      </tr>
    `;

    return;

  }

  listaLaudos.forEach(c=>{

    lista.innerHTML += `

      <tr>

        <td>${c.numeroOS || "-"}</td>

        <td>${c.cliente || "-"}</td>

        <td>${c.equipamento || "-"}</td>

        <td>${
          c.createdAt
          ? new Date(c.createdAt).toLocaleDateString("pt-BR")
          : "-"
        }</td>

        <td>
          <span class="status">
            Finalizado
          </span>
        </td>

        <td>

          <button onclick="abrirLaudo('${c._id}')">
            👁️ Abrir
          </button>

        </td>

      </tr>

    `;

  });

}

/* ===================== BUSCA ===================== */

function filtrar(){

  const termo =
    document.getElementById("busca")
    .value
    .toLowerCase();

  mostrar(

    laudos.filter(c=>

      String(c.cliente || "")
      .toLowerCase()
      .includes(termo)

      ||

      String(c.equipamento || "")
      .toLowerCase()
      .includes(termo)

      ||

      String(c.numeroOS || "")
      .includes(termo)

    )

  );

}

/* ===================== ABRIR ===================== */

function abrirLaudo(id){

  location.href="/laudo.html?id="+id;

}

/* ===================== LOGOUT ===================== */

async function logout(){

  await fetch("/logout",{
    credentials:"include"
  });

  location.href="/";

}

/* ===================== INIT ===================== */

carregarUsuario();
carregar();

</script>

</body>
</html>
