<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Login - Bits & Bytes</title>

<link rel="manifest" href="/manifest.json">

<meta name="theme-color" content="#0f172a">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="apple-mobile-web-app-title" content="Bits & Bytes">

<link rel="apple-touch-icon" href="/logo.png">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, sans-serif;
}

body{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg, #0f172a, #1e293b);
  color:#fff;
}

/* CONTAINER */
.login-box{
  background:#111827;
  padding:40px;
  border-radius:12px;
  width:320px;
  text-align:center;
  box-shadow:0 0 20px rgba(0,0,0,0.5);
}

/* LOGO */
.logo{
  width:100px;
  margin-bottom:10px;
}

h2{
  margin-bottom:20px;
}

/* INPUTS */
input{
  width:100%;
  padding:12px;
  margin:10px 0;
  border:none;
  border-radius:6px;
  outline:none;
}

/* BOTÃO */
button{
  width:100%;
  padding:12px;
  background:#2563eb;
  color:#fff;
  border:none;
  border-radius:6px;
  cursor:pointer;
  margin-top:10px;
  font-weight:bold;
}

button:hover{
  background:#1d4ed8;
}

/* ERRO */
.error{
  color:#f87171;
  margin-top:15px;
  font-size:14px;
  line-height:1.4;
}
</style>
</head>

<body>

<div class="login-box">

  <!-- LOGO -->
  <img src="/logo.png" class="logo">
  <h2>Bits & Bytes Assistência Técnica</h2>

  <!-- FORM -->
<!-- TESTE -->
  <form id="loginForm">
    <input type="text" id="username" placeholder="Usuário" required>
    <input type="password" id="password" placeholder="Senha" required>
    <button type="submit">Entrar</button>
  </form>

  <div class="error" id="erro"></div>

</div>

<script>
document.getElementById("loginForm").addEventListener("submit", async (e)=>{
console.log("SUBMIT INTERCEPTADO");
alert("SUBMIT INTERCEPTADO");

  e.preventDefault();

  const username = document.getElementById("username").value;
  const password = document.getElementById("password").value;

  const res = await fetch("/login", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ username, password })
  });

  const data = await res.json();

  if(data.success){

  window.location.href = "/dashboard.html";

}else{

  if(data.error){

    document.getElementById("erro").innerText = data.error;

  }else{

    document.getElementById("erro").innerText = "Login inválido";

  }

}

});

</script>

</body>
</html>
