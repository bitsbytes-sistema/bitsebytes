<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Bits & Bytes - Login</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #1f1f2e, #2c2c44);
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.container {
  background: #fff;
  padding: 40px;
  border-radius: 12px;
  width: 340px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  text-align: center;
}

.logo {
  font-size: 22px;
  font-weight: bold;
  color: #4CAF50;
  margin-bottom: 10px;
}

h2 {
  margin-bottom: 20px;
  color: #333;
}

input {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  border: 1px solid #ccc;
  border-radius: 6px;
  outline: none;
}

button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  background: #4CAF50;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-weight: bold;
  transition: 0.2s;
}

button:hover {
  background: #45a049;
}

.msg {
  margin-top: 10px;
  font-size: 13px;
  color: red;
}

.small {
  font-size: 12px;
  color: #777;
  margin-top: 15px;
}
</style>

</head>
<body>

<div class="container">
  <div class="logo">Bits & Bytes</div>

  <h2>Login do Sistema</h2>

  <form id="loginForm">
    <input type="text" id="username" placeholder="Usuário" required>
    <input type="password" id="password" placeholder="Senha" required>

    <button type="submit" id="btn">Entrar</button>

    <div class="msg" id="msg"></div>

    <div class="small">Sistema de chamados SaaS</div>
  </form>
</div>

<script>
const form = document.getElementById("loginForm");
const msg = document.getElementById("msg");
const btn = document.getElementById("btn");

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  msg.style.color = "black";
  msg.innerText = "Entrando...";
  btn.disabled = true;

  try {
    const res = await fetch("/login", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        username: username.value,
        password: password.value
      })
    });

    const data = await res.json();

    if (data.success) {
      msg.style.color = "green";
      msg.innerText = "Login realizado com sucesso!";

      setTimeout(() => {
        window.location.href = "/dashboard.html";
      }, 800);

    } else {
      msg.style.color = "red";
      msg.innerText = "Usuário ou senha inválidos";
    }

  } catch (err) {
    msg.style.color = "red";
    msg.innerText = "Erro no servidor";
  }

  btn.disabled = false;
});
</script>

</body>
</html>
