<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Orçamento</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#f2f2f2;
}

.container{
    max-width:900px;
    margin:20px auto;
    background:white;
    padding:30px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #ddd;
    padding-bottom:20px;
}

.logo{
    display:flex;
    gap:10px;
    align-items:center;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th, td{
    border:1px solid #ddd;
    padding:10px;
}

th{
    background:#f3f3f3;
}

.total{
    text-align:right;
    font-size:20px;
    margin-top:20px;
    font-weight:bold;
}

.botoes{
    margin-top:30px;
    display:flex;
    gap:10px;
    justify-content:flex-end;
}

button{
    padding:10px 15px;
    border:none;
    cursor:pointer;
    border-radius:6px;
}

.print{ background:#2563eb; color:white; }
.back{ background:#ccc; }
.whats{ background:#25D366; color:white; }
.edit{ background:#f59e0b; color:white; }

@media print {
    .botoes{ display:none; }
}

/* MODAL EDIT */
.modal{
    display:none;
    position:fixed;
    top:0;left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.5);
}

.modal-content{
    background:white;
    width:900px;
    max-width:95%;
    padding:20px;
    border-radius:8px;
}

.modal-content input{
    width:100%;
    padding:10px;
    margin:5px 0;
}

</style>

</head>

<body>

<div class="container">

    <div class="header">

        <div class="logo">
            <img src="/logo.png" width="90">
            <div>
                <h3>Bits & Bytes Técnology®</h3>
                <h6>Sistemas e Assistencia Técnica</h6>
            </div>
        </div>

        <div>
            <b>Nº:</b> <span id="numero"></span>
        </div>

    </div>

    <h1>Orçamento</h1>

   <p><b>Cliente:</b> <span id="cliente"></span></p>

<p><b>Status:</b> <span id="status"></span></p>

<p>
<b>📅 Agendamento:</b>
<span id="agendamento"></span>
</p>

<p><b>Observações:</b></p>

    <div id="observacoes"
        style="padding:12px;background:#f8f8f8;border:1px solid #ddd;border-radius:6px;margin-bottom:20px;white-space:pre-wrap;">
    </div>

    <table>
        <thead>
            <tr>
                <th>Descrição</th>
                <th>Qtd</th>
                <th>Valor</th>
                <th>Total</th>
            </tr>
        </thead>

        <tbody id="itens"></tbody>
    </table>

    <div class="total">
        Total: <span id="total"></span>
    </div>

    <div class="botoes">

        <button class="back" onclick="history.back()">Voltar</button>

        <button class="edit" onclick="abrirModal()">Editar</button>

        <button id="btnAprovar"
           style="background:#16a34a;color:white;"
           onclick="aprovarOrcamento()">
           ✅ Aprovar
        </button>

        <button
    id="btnConverter"
    onclick="converterOS()"
    style="display:none;background:#16a34a;color:white;">
    🛠 Gerar Ordem de Serviço
        </button>

        <button class="print" onclick="window.print()">Imprimir</button>

        <button onclick="gerarPDF()">📄 PDF</button>

        <button onclick="gerarImagem()">🖼 Imagem</button>

        <div style="position:relative;display:inline-block;">

            <button class="whats" onclick="toggleMenu()">
                💬 WhatsApp ▼
            </button>

            <div id="menuWhats"
                style="display:none;position:absolute;right:0;margin-top:5px;background:white;border:1px solid #ddd;border-radius:8px;box-shadow:0 3px 10px rgba(0,0,0,.2);overflow:hidden;z-index:999;min-width:180px;">

                <button style="width:100%;background:white;color:#333;text-align:left;padding:12px;border:none;"
                    onclick="enviarWhatsPDF()">
                    📄 Enviar PDF
                </button>

                <button style="width:100%;background:white;color:#333;text-align:left;padding:12px;border:none;"
                    onclick="enviarWhatsImagem()">
                    🖼 Enviar Imagem
                </button>

            </div>

        </div>

    </div>

</div>

<!-- MODAL EDIT -->
<div id="modal" class="modal">
  <div class="modal-content">

    <h3>Editar Orçamento</h3>

    <input id="editCliente" placeholder="Cliente">
    <input id="editStatus" placeholder="Status">
    <input id="editObs" placeholder="Observações">

    <hr>

    <h4>Itens</h4>

    <div id="listaItens"></div>

    <button onclick="addItem()">➕ Adicionar item</button>

    <br><br>

    <button onclick="salvarEdicao()">Salvar</button>
    <button onclick="fecharModal()">Cancelar</button>

  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>

const id = new URLSearchParams(window.location.search).get("id");

console.log("ID recebido:", id);

let budget = null;
let servicos = [];


/* CARREGAR */

async function carregarServicos(){

    const res = await fetch("/api/services", {
        credentials: "include"
    });

    servicos = await res.json();

    console.log(servicos);
}

async function carregar(){

    const res = await fetch("/api/budgets/" + id,{
        credentials:"include"
    });

    budget = await res.json();

    document.getElementById("numero").innerText = budget.numero;
    document.getElementById("cliente").innerText = budget.cliente;
    document.getElementById("status").innerText = budget.status;

if(budget.dataAgendamento && budget.horaAgendamento){

    const data = new Date(budget.dataAgendamento)
        .toLocaleDateString("pt-BR");

    document.getElementById("agendamento").innerText =
        `${data} às ${budget.horaAgendamento}`;

}else{

    document.getElementById("agendamento").innerText =
        "Não definido";

}

document.getElementById("observacoes").innerText =
    budget.observacoes || "-";

    const btn = document.getElementById("btnAprovar");

    if(budget.status === "aprovado"){
        btn.style.display = "none";
    }else{
        btn.style.display = "inline-block";
    }

    document.getElementById("total").innerText =
        Number(budget.total || 0).toLocaleString("pt-BR", {
            style:"currency",
            currency:"BRL"
        });

	const btnConverter =
    document.getElementById("btnConverter");

if(budget.status === "aprovado"){

    btnConverter.style.display = "inline-block";

}else{

    btnConverter.style.display = "none";

}

    const tbody = document.getElementById("itens");
    tbody.innerHTML = "";

    (budget.itens || []).forEach(i => {
        tbody.innerHTML += `
            <tr>
                <td>${i.descricao}</td>
                <td>${i.quantidade}</td>
                <td>${Number(i.valor || 0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}</td>
                <td>${Number(i.total || 0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}</td>
            </tr>
        `;
    });

}

/* EDITAR */
function abrirModal(){

    document.getElementById("editCliente").value = budget.cliente;
    document.getElementById("editStatus").value = budget.status;
    document.getElementById("editObs").value = budget.observacoes;

    renderItens();

    document.getElementById("modal").style.display="block";
}

function fecharModal(){
    document.getElementById("modal").style.display="none";
}

function renderItens() {

    const div = document.getElementById("listaItens");

    div.innerHTML = `

    <div style="
        display:grid;
        grid-template-columns:4fr 80px 120px 120px 45px;
        gap:8px;
        font-weight:bold;
        border-bottom:1px solid #ddd;
        padding-bottom:8px;
        margin-bottom:10px;
    ">
        <div>Serviço</div>
        <div>Qtd</div>
        <div>Valor</div>
        <div>Total</div>
        <div></div>
    </div>

    `;

    (budget.itens || []).forEach((item,index)=>{

        let options = '<option value="">Selecione...</option>';

        servicos.forEach(servico=>{

            const selecionado =

                item.servicoId
                    ? item.servicoId == servico._id
                    : item.descricao == servico.nome;

            options += `

                <option
                    value="${servico._id}"
                    ${selecionado ? "selected" : ""}>
                    ${servico.nome}
                </option>

            `;

        });

        div.innerHTML += `

        <div style="
            display:grid;
            grid-template-columns:4fr 80px 120px 120px 45px;
            gap:8px;
            align-items:center;
            margin-bottom:8px;
        ">

            <select onchange="selecionarServico(${index},this.value)">
                ${options}
            </select>

            <input
                type="number"
                min="1"
                value="${item.quantidade}"
                onchange="updateItem(${index},'quantidade',this.value)">

            <input
                type="number"
                step="0.01"
                value="${item.valor}"
                onchange="updateItem(${index},'valor',this.value)">

            <input
                disabled
                value="${Number(item.total || 0).toLocaleString('pt-BR',{
                    minimumFractionDigits:2,
                    maximumFractionDigits:2
                })}">

            <button onclick="removeItem(${index})">
                ❌
            </button>

        </div>

        `;

    });

    atualizarTotal();

}

function selecionarServico(index,id){

    const servico = servicos.find(s => s._id == id);

    if(!servico) return;

    budget.itens[index].servicoId = servico._id;
    budget.itens[index].descricao = servico.nome;
    budget.itens[index].valor = Number(servico.valor);
    budget.itens[index].quantidade = Number(budget.itens[index].quantidade || 1);
    budget.itens[index].total =
        budget.itens[index].quantidade *
        budget.itens[index].valor;

    renderItens();

}

function addItem(){

    if(!budget.itens){
        budget.itens = [];
    }

    budget.itens.push({

        servicoId:"",
        descricao:"",
        quantidade:1,
        valor:0,
        total:0

    });

    renderItens();

}

function removeItem(index){

    budget.itens.splice(index,1);
    renderItens();
}

function updateItem(index, campo, valor){

    if(campo == "quantidade"){
        budget.itens[index].quantidade = Number(valor);
    }

    if(campo == "valor"){
        budget.itens[index].valor = Number(valor);
    }

    budget.itens[index].total =
        Number(budget.itens[index].quantidade) *
        Number(budget.itens[index].valor);

    renderItens();

}

function atualizarTotal(){

    let total = 0;

    (budget.itens || []).forEach(item=>{

        item.quantidade = Number(item.quantidade || 0);
        item.valor = Number(item.valor || 0);

        item.total = item.quantidade * item.valor;

        total += item.total;

    });

    budget.total = total;

    document.getElementById("total").innerText =
        total.toLocaleString("pt-BR",{
            style:"currency",
            currency:"BRL"
        });

    const totalModal = document.getElementById("totalModal");

    if(totalModal){

        totalModal.innerText =
            total.toLocaleString("pt-BR",{
                style:"currency",
                currency:"BRL"
            });

    }

}

/* SALVAR */
async function salvarEdicao(){

    const res = await fetch("/api/budgets/" + id, {
        method:"PUT",
        headers:{
            "Content-Type":"application/json"
        },
        credentials:"include",
body: JSON.stringify({

    cliente: document.getElementById("editCliente").value,

    status: document.getElementById("editStatus").value,

    observacoes: document.getElementById("editObs").value,

    itens: budget.itens,

    total: budget.total

})
    });

    const data = await res.json();

    if(data.ok){
        alert("Orçamento atualizado!");
        location.reload();
    }
}

/* WHATS / PDF / IMAGEM (MANTIDO DO TEU ORIGINAL) */

function toggleMenu(){
    const menu = document.getElementById("menuWhats");
    menu.style.display = menu.style.display === "block" ? "none" : "block";
}

function mensagemWhats(){
    return encodeURIComponent(
`Olá ${budget.cliente}

Segue orçamento Nº ${budget.numero}

Obrigado!`
    );
}

function numeroCliente(){
    let numero = budget.telefone || "";
    numero = numero.replace(/\D/g,"");
    if(numero.startsWith("55")) numero = numero.substring(2);
    return numero;
}

async function gerarImagem(){
    const botoes = document.querySelector(".botoes");
    botoes.style.display="none";

    const canvas = await html2canvas(document.querySelector(".container"),{scale:2});
    botoes.style.display="flex";

    const link = document.createElement("a");
    link.download = `Orcamento-${budget.numero}.png`;
    link.href = canvas.toDataURL("image/png");
    link.click();
}

function gerarPDF(){

    window.open(
        "/api/budgets/" + id + "/pdf",
        "_blank"
    );

}

async function enviarWhatsPDF(){
    await gerarPDF();
    window.open(`https://wa.me/55${numeroCliente()}?text=${mensagemWhats()}`,"_blank");
}

async function enviarWhatsImagem(){
    await gerarImagem();
    window.open(`https://wa.me/55${numeroCliente()}?text=${mensagemWhats()}`,"_blank");
}

(async()=>{

    await carregarServicos();

    await carregar();

})();

async function aprovarOrcamento(){

    if(!confirm("Deseja aprovar este orçamento?")){
        return;
    }

    const res = await fetch("/api/budgets/" + id + "/aprovar",{
        method:"PUT",
        credentials:"include"
    });

    console.log("Status HTTP:", res.status);

    const data = await res.json();

    console.log(data);

    if(data.ok){

        alert("Orçamento aprovado!");

        await carregar();

    }else{

        alert(JSON.stringify(data));

    }

}

async function converterOS(){

    if(!confirm("Gerar uma Ordem de Serviço deste orçamento?")){
        return;
    }

    const res = await fetch(
        "/api/budgets/" + id + "/converter",
        {
            method:"POST",
            credentials:"include"
        }
    );

    const data = await res.json();

    if(data.ok){

        alert("Chamado criado com sucesso!");

        window.location.href =
            "/chamados.html";

    }else{

        alert(data.error || "Erro ao converter.");

    }

}

</script>

</body>
</html>
