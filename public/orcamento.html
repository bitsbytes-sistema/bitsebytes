<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Orçamento</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#f2f2f2;
}

.container{
    max-width:900px;
    margin:20px auto;
    background:white;
    padding:30px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #ddd;
    padding-bottom:20px;
}

.logo{
    display:flex;
    gap:10px;
    align-items:center;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th, td{
    border:1px solid #ddd;
    padding:10px;
}

th{
    background:#f3f3f3;
}

.total{
    text-align:right;
    font-size:20px;
    margin-top:20px;
    font-weight:bold;
}

.botoes{
    margin-top:30px;
    display:flex;
    gap:10px;
    justify-content:flex-end;
}

button{
    padding:10px 15px;
    border:none;
    cursor:pointer;
    border-radius:6px;
}

.print{ background:#2563eb; color:white; }
.back{ background:#ccc; }
.whats{ background:#25D366; color:white; }
.edit{ background:#f59e0b; color:white; }

@media print {
    .botoes{ display:none; }
}

/* MODAL EDIT */
.modal{
    display:none;
    position:fixed;
    top:0;left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.5);
}

.modal-content{
    background:white;
    width:900px;
    max-width:95%;
    padding:20px;
    border-radius:8px;
}

.modal-content input,
.modal-content select{
    width:100%;
    min-width:0;
    box-sizing:border-box;
}

.modal-content input{
    padding:10px;
    margin:5px 0;
}

#listaItens > div{
    min-width:0;
}

#listaItens input,
#listaItens select{
    width:100%;
    min-width:0;
    box-sizing:border-box;
}

</style>

</head>

<body>

<div class="container">

    <div class="header">

        <div class="logo">
            <img src="/logo.png" width="90">
            <div>
                <h3>Bits & Bytes Técnology®</h3>
                <h6>Sistemas e Assistencia Técnica</h6>
            </div>
        </div>

        <div>
            <b>Nº:</b> <span id="numero"></span>
        </div>

    </div>

    <h1>Orçamento</h1>

<p><b>Cliente:</b> <span id="cliente"></span></p>

<p>
    📄 <b>Criado em:</b>
    <span id="dataCriacao"></span>

    &nbsp;&nbsp;|&nbsp;&nbsp;

    📅 <b>Atendimento:</b>
    <span id="agendamento"></span>
</p>

<p><b>Status:</b> <span id="status"></span></p>

<p><b>Observações:</b></p>

    <div id="observacoes"
        style="padding:12px;background:#f8f8f8;border:1px solid #ddd;border-radius:6px;margin-bottom:20px;white-space:pre-wrap;">
    </div>

    <table>
        <thead>
            <tr>
                <th>Descrição</th>
                <th>Qtd</th>
                <th>Valor</th>
                <th>Total Bruto</th>
                <th>Desconto</th>
                <th>Líquido</th>
            </tr>
        </thead>

        <tbody id="itens"></tbody>
    </table>

    <div class="total">
        <div>Subtotal: <span id="subtotal"></span></div>
        <div>Descontos: <span id="descontoTotal"></span></div>
        <div style="margin-top:6px;">
            Total Líquido: <span id="total"></span>
        </div>
    </div>

    <div class="botoes">

        <button class="back" onclick="window.location.href='/orcamentos.html'">Voltar</button>

        <button class="edit" onclick="abrirModal()">Editar</button>

        <button
            id="btnVincularChamado"
            onclick="abrirVinculoChamado()"
            style="display:none;background:#2563eb;color:white;">
            🔗 Vincular a Chamado
        </button>

        <button
            id="btnChamadoVinculado"
            type="button"
            disabled
            style="display:none;background:#0f766e;color:white;cursor:default;opacity:1;">
            🔗 OS vinculada
        </button>

        <button id="btnAprovar"
           style="background:#16a34a;color:white;"
           onclick="aprovarOrcamento()">
           ✅ Aprovar
        </button>
        <button id="btnReprovar"
           style="display:none;background:#dc2626;color:white;"
           onclick="reprovarOrcamento()">
           ❌ Reprovar
        </button>

        <button
    id="btnConverter"
    onclick="converterOS()"
    style="display:none;background:#16a34a;color:white;">
    🛠 Gerar Ordem de Serviço
        </button>

        <button class="print" onclick="window.print()">Imprimir</button>

        <button onclick="gerarPDF()">📄 PDF</button>

        <button onclick="gerarImagem()">🖼 Imagem</button>

        <div style="position:relative;display:inline-block;">

            <button class="whats" onclick="toggleMenu()">
                💬 WhatsApp ▼
            </button>

            <div id="menuWhats"
                style="display:none;position:absolute;right:0;margin-top:5px;background:white;border:1px solid #ddd;border-radius:8px;box-shadow:0 3px 10px rgba(0,0,0,.2);overflow:hidden;z-index:999;min-width:180px;">

                <button style="width:100%;background:white;color:#333;text-align:left;padding:12px;border:none;"
                    onclick="enviarWhatsPDF()">
                    📄 Enviar PDF
                </button>

                <button style="width:100%;background:white;color:#333;text-align:left;padding:12px;border:none;"
                    onclick="enviarWhatsImagem()">
                    🖼 Enviar Imagem
                </button>

            </div>

        </div>

    </div>

</div>

<!-- MODAL EDIT -->
<div id="modal" class="modal">
  <div class="modal-content">

    <h3>Editar Orçamento</h3>

    <input id="editCliente" placeholder="Cliente">
    <input id="editStatus" placeholder="Status">
    <input id="editObs" placeholder="Observações">

    <hr>

    <h4>Itens</h4>

    <div id="listaItens"></div>

    <button onclick="addItem()">➕ Adicionar item</button>

    <br><br>

    <button onclick="salvarEdicao()">Salvar</button>
    <button onclick="fecharModal()">Cancelar</button>

  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>

const id = new URLSearchParams(window.location.search).get("id");

console.log("ID recebido:", id);

let budget = null;
let servicos = [];


/* CARREGAR */

async function carregarServicos(){

    const res = await fetch("/api/services", {
        credentials: "include"
    });

    servicos = await res.json();

    console.log(servicos);
}

async function carregar(){

    const res = await fetch("/api/budgets/" + id,{
        credentials:"include"
    });

    budget = await res.json();

    document.getElementById("numero").innerText = budget.numero;
    document.getElementById("cliente").innerText = budget.cliente;
    document.getElementById("status").innerText = budget.status;

if (budget.createdAt) {

    const criadoEm = new Date(budget.createdAt);

    document.getElementById("dataCriacao").innerText =
        criadoEm.toLocaleDateString("pt-BR") +
        " às " +
        criadoEm.toLocaleTimeString("pt-BR", {
            hour: "2-digit",
            minute: "2-digit"
        });

} else {

    document.getElementById("dataCriacao").innerText = "-";

}

if (budget.dataAgendamento && budget.horaAgendamento) {

    const [ano, mes, dia] = budget.dataAgendamento.split("-");

    document.getElementById("agendamento").innerText =
        `${dia}/${mes}/${ano} às ${budget.horaAgendamento}`;

} else {

    document.getElementById("agendamento").innerText =
        "Não definido";

}

document.getElementById("observacoes").innerText =
    budget.observacoes || "-";

    const btn = document.getElementById("btnAprovar");
    const btnReprovar = document.getElementById("btnReprovar");

    if(budget.status === "aprovado"){
        btn.style.display = "none";
        btnReprovar.style.display = "inline-block";
    }else{
        btn.style.display = "inline-block";
        btnReprovar.style.display = "none";
    }

    let subtotalVisual = 0;
let descontoVisual = 0;

(budget.itens || []).forEach(item => {

    const quantidade = Number(item.quantidade || 0);
    const valor = Number(item.valor || 0);

    const bruto =
        Number.isFinite(Number(item.total))
            ? Number(item.total)
            : quantidade * valor;

    const descontoItem =
        Number(item.desconto || 0);

    subtotalVisual += bruto;
    descontoVisual += descontoItem;

});

document.getElementById("subtotal").innerText =
    subtotalVisual.toLocaleString("pt-BR", {
        style:"currency",
        currency:"BRL"
    });

document.getElementById("descontoTotal").innerText =
    descontoVisual.toLocaleString("pt-BR", {
        style:"currency",
        currency:"BRL"
    });

document.getElementById("total").innerText =
    Number(budget.total || 0).toLocaleString("pt-BR", {
        style:"currency",
        currency:"BRL"
    });

	const btnConverter =
    document.getElementById("btnConverter");

const btnVincularChamado =
    document.getElementById("btnVincularChamado");

const btnChamadoVinculado =
    document.getElementById("btnChamadoVinculado");


if(
    budget.status === "aprovado" &&
    !budget.ticketId
){

    btnConverter.style.display = "inline-block";

}else{

    btnConverter.style.display = "none";

}


if(budget.ticketId){

    btnVincularChamado.style.display = "none";

    btnChamadoVinculado.style.display = "inline-block";

    btnChamadoVinculado.innerText =
        `🔗 OS ${budget.numeroOS || ""} vinculada`;

}else{

    btnVincularChamado.style.display = "inline-block";

    btnChamadoVinculado.style.display = "none";

}

    const tbody = document.getElementById("itens");
    tbody.innerHTML = "";

    (budget.itens || []).forEach(i => {
        tbody.innerHTML += `
            <tr>
                <td>${i.descricao}</td>
                <td>${i.quantidade}</td>
                <td>${Number(i.valor || 0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}</td>
                <td>${Number(i.total || 0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}</td>
                <td>${Number(i.desconto || 0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}</td>
                <td>${Number(i.totalLiquido ?? ((i.total || 0) - (i.desconto || 0))).toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}</td>
            </tr>
        `;
    });

}

/* ===== VINCULAR A CHAMADO EXISTENTE ===== */

async function abrirVinculoChamado(){

    try{

        const res = await fetch(
            "/api/tickets?t=" + Date.now(),
            {
                credentials:"include",
                cache:"no-store"
            }
        );

        if(!res.ok){

            alert("Não foi possível carregar os chamados.");
            return;

        }

        const tickets = await res.json();
        const chamados = tickets
            .filter(t => {

                const statusChamado =
                    String(t.status || "").toLowerCase();

                if(statusChamado === "finalizado"){
                    return false;
                }


                if(
                    t.budgetId &&
                    String(t.budgetId) !== String(budget._id)
                ){
                    return false;
                }


                const clienteIdChamado =
                    String(t.clienteId || "");

                const clienteIdOrcamento =
                    String(budget.clienteId || "");


                if(clienteIdChamado){

                    return (
                        clienteIdChamado ===
                        clienteIdOrcamento
                    );

                }


                const nomeChamado =
                    String(t.cliente || "")
                        .trim()
                        .toLowerCase();

                const nomeOrcamento =
                    String(budget.cliente || "")
                        .trim()
                        .toLowerCase();

                const telefoneChamado =
                    String(t.telefone || "")
                        .replace(/\D/g, "");

                const telefoneOrcamento =
                    String(budget.telefone || "")
                        .replace(/\D/g, "");


                return (
                    (
                        telefoneChamado &&
                        telefoneOrcamento &&
                        telefoneChamado === telefoneOrcamento
                    ) ||
                    (
                        nomeChamado &&
                        nomeOrcamento &&
                        nomeChamado === nomeOrcamento
                    )
                );

            })
            .sort(
                (a,b) =>
                    Number(b.numeroOS || 0) -
                    Number(a.numeroOS || 0)
            );


        if(chamados.length === 0){

            alert(
                "Este cliente não possui chamado aberto disponível para vínculo."
            );

            return;

        }


        const overlay = document.createElement("div");

        overlay.id = "modalVincularChamado";

        overlay.style.cssText = `
            position:fixed;
            inset:0;
            background:rgba(15,23,42,.65);
            display:flex;
            align-items:center;
            justify-content:center;
            z-index:99999;
            padding:20px;
        `;


        const caixa = document.createElement("div");

        caixa.style.cssText = `
            width:100%;
            max-width:520px;
            background:white;
            border-radius:12px;
            padding:24px;
            box-shadow:0 20px 50px rgba(0,0,0,.30);
        `;


        caixa.innerHTML = `
            <h3 style="margin-top:0;">
                🔗 Vincular orçamento a chamado
            </h3>

            <p style="color:#64748b;">
                Orçamento Nº ${budget.numero} — ${budget.cliente}
            </p>

            <label
                for="selectVinculoChamado"
                style="display:block;font-weight:600;margin-bottom:8px;">
                Chamado / Ordem de Serviço
            </label>

            <select
                id="selectVinculoChamado"
                style="
                    width:100%;
                    padding:11px;
                    border:1px solid #cbd5e1;
                    border-radius:8px;
                    margin-bottom:18px;
                ">
                <option value="">
                    Selecione uma OS
                </option>

                ${chamados.map(t => {

                    const equipamento =
                        t.equipamento
                        ? ` — ${t.equipamento}`
                        : "";

                    const status =
                        t.status
                        ? ` — ${String(t.status).toUpperCase()}`
                        : "";

                    return `
                        <option value="${t._id}">
                            OS ${t.numeroOS}${equipamento}${status}
                        </option>
                    `;

                }).join("")}

            </select>

            <div
                style="
                    display:flex;
                    gap:10px;
                    justify-content:flex-end;
                    flex-wrap:wrap;
                ">

                <button
                    type="button"
                    id="btnCancelarVinculo"
                    style="
                        background:#64748b;
                        color:white;
                        border:none;
                        border-radius:8px;
                        padding:10px 16px;
                        cursor:pointer;
                    ">
                    Cancelar
                </button>

                <button
                    type="button"
                    id="btnConfirmarVinculo"
                    style="
                        background:#2563eb;
                        color:white;
                        border:none;
                        border-radius:8px;
                        padding:10px 16px;
                        cursor:pointer;
                    ">
                    🔗 Vincular
                </button>

            </div>
        `;


        overlay.appendChild(caixa);
        document.body.appendChild(overlay);


        document
            .getElementById("btnCancelarVinculo")
            .addEventListener(
                "click",
                () => overlay.remove()
            );


        document
            .getElementById("btnConfirmarVinculo")
            .addEventListener(
                "click",
                confirmarVinculoChamado
            );


    }catch(err){

        console.error(err);

        alert(
            "Erro ao carregar os chamados disponíveis."
        );

    }

}


async function confirmarVinculoChamado(){

    const select =
        document.getElementById(
            "selectVinculoChamado"
        );

    const ticketId =
        select ? select.value : "";


    if(!ticketId){

        alert("Selecione uma OS.");
        return;

    }


    if(!confirm(
        "Deseja vincular este orçamento à OS selecionada?"
    )){

        return;

    }


    try{

        const res = await fetch(
            "/api/budgets/" +
            id +
            "/vincular-chamado",
            {
                method:"PUT",
                headers:{
                    "Content-Type":"application/json"
                },
                credentials:"include",
                body:JSON.stringify({
                    ticketId
                })
            }
        );


        const data = await res.json();


        if(!res.ok || !data.ok){

            alert(
                data.error ||
                "Erro ao vincular chamado."
            );

            return;

        }


        const modal =
            document.getElementById(
                "modalVincularChamado"
            );

        if(modal){
            modal.remove();
        }


        alert(
            `Orçamento vinculado com sucesso à OS ${data.numeroOS}.`
        );

        location.reload();


    }catch(err){

        console.error(err);

        alert(
            "Erro ao vincular o orçamento ao chamado."
        );

    }

}

/* EDITAR */
function abrirModal(){

    document.getElementById("editCliente").value = budget.cliente;
    document.getElementById("editStatus").value = budget.status;
    document.getElementById("editObs").value = budget.observacoes;

    renderItens();

    document.getElementById("modal").style.display="block";
}

function fecharModal(){
    document.getElementById("modal").style.display="none";
}

function renderItens() {

    const div = document.getElementById("listaItens");

    div.innerHTML = `

    <div style="
        display:grid;
        grid-template-columns:4fr 80px 120px 120px 120px 120px 45px;
        gap:8px;
        font-weight:bold;
        border-bottom:1px solid #ddd;
        padding-bottom:8px;
        margin-bottom:10px;
    ">
        <div>Peça / Serviço</div>
        <div>Qtd</div>
        <div>Valor</div>
        <div>Bruto</div>
        <div>Desconto</div>
        <div>Líquido</div>
        <div></div>
    </div>

    `;

    (budget.itens || []).forEach((item,index)=>{

        let options = '<option value="">Selecione...</option>';

        servicos.forEach(servico=>{

            const selecionado =

                item.servicoId
                    ? item.servicoId == servico._id
                    : item.descricao == servico.nome;

            options += `

                <option
                    value="${servico._id}"
                    ${selecionado ? "selected" : ""}>
                    ${servico.tipo === "peca" ? "📦 Peça" : "🛠 Serviço"} — ${servico.nome}
                </option>

            `;

        });

        div.innerHTML += `

        <div style="
            display:grid;
            grid-template-columns:4fr 80px 120px 120px 120px 120px 45px;
            gap:8px;
            align-items:center;
            margin-bottom:8px;
        ">

            <select onchange="selecionarServico(${index},this.value)">
                ${options}
            </select>

            <input
                type="number"
                min="1"
                value="${item.quantidade}"
                onchange="updateItem(${index},'quantidade',this.value)">

            <input
                type="number"
                step="0.01"
                value="${item.valor}"
                onchange="updateItem(${index},'valor',this.value)">

            <input
                disabled
                value="${Number(item.total || 0).toLocaleString('pt-BR',{
                    minimumFractionDigits:2,
                    maximumFractionDigits:2
                })}">

            <input
                type="number"
                min="0"
                step="0.01"
                max="${Number(item.total || 0)}"
                value="${Number(item.desconto || 0)}"
                onchange="updateItem(${index},'desconto',this.value)">

            <input
                disabled
                value="${Number(item.totalLiquido ?? ((item.total || 0) - (item.desconto || 0))).toLocaleString('pt-BR',{
                    minimumFractionDigits:2,
                    maximumFractionDigits:2
                })}">

            <button onclick="removeItem(${index})">
                ❌
            </button>

        </div>

        `;

    });

    atualizarTotal();

}

function selecionarServico(index,id){

    const servico = servicos.find(s => s._id == id);

    if(!servico) return;

    budget.itens[index].servicoId = servico._id;
    budget.itens[index].descricao = servico.nome;
    budget.itens[index].valor = Number(servico.valor);
    budget.itens[index].quantidade = Number(budget.itens[index].quantidade || 1);
    budget.itens[index].total =
        budget.itens[index].quantidade *
        budget.itens[index].valor;

    budget.itens[index].desconto =
        Number(budget.itens[index].desconto || 0);

    if(budget.itens[index].desconto > budget.itens[index].total){
        budget.itens[index].desconto =
            budget.itens[index].total;
    }

    budget.itens[index].totalLiquido =
        budget.itens[index].total -
        budget.itens[index].desconto;

    renderItens();

}

function addItem(){

    if(!budget.itens){
        budget.itens = [];
    }

    budget.itens.push({

        servicoId:"",
        descricao:"",
        quantidade:1,
        valor:0,
        total:0,
        desconto:0,
        totalLiquido:0

    });

    renderItens();

}

function removeItem(index){

    budget.itens.splice(index,1);
    renderItens();
}

function updateItem(index, campo, valor){

    if(campo == "quantidade"){
        budget.itens[index].quantidade = Number(valor);
    }

    if(campo == "valor"){
        budget.itens[index].valor = Number(valor);
    }

    if(campo == "desconto"){
        budget.itens[index].desconto = Number(valor);
    }

    budget.itens[index].total =
        Number(budget.itens[index].quantidade) *
        Number(budget.itens[index].valor);

    budget.itens[index].desconto =
        Number(budget.itens[index].desconto || 0);

    if(budget.itens[index].desconto < 0){
        budget.itens[index].desconto = 0;
    }

    if(budget.itens[index].desconto > budget.itens[index].total){
        budget.itens[index].desconto =
            budget.itens[index].total;

        alert("O desconto não pode ser maior que o valor bruto do item.");
    }

    budget.itens[index].totalLiquido =
        budget.itens[index].total -
        budget.itens[index].desconto;

    renderItens();

}

function atualizarTotal(){

    let subtotal = 0;
    let desconto = 0;
    let total = 0;

    (budget.itens || []).forEach(item=>{

        item.quantidade = Number(item.quantidade || 0);
        item.valor = Number(item.valor || 0);
        item.desconto = Number(item.desconto || 0);

        item.total =
            item.quantidade *
            item.valor;

        if(item.desconto < 0){
            item.desconto = 0;
        }

        if(item.desconto > item.total){
            item.desconto = item.total;
        }

        item.totalLiquido =
            item.total -
            item.desconto;

        subtotal += item.total;
        desconto += item.desconto;
        total += item.totalLiquido;

    });

    budget.subtotal = subtotal;
    budget.desconto = desconto;
    budget.total = total;

    const subtotalEl =
        document.getElementById("subtotal");

    const descontoEl =
        document.getElementById("descontoTotal");

    if(subtotalEl){
        subtotalEl.innerText =
            subtotal.toLocaleString("pt-BR",{
                style:"currency",
                currency:"BRL"
            });
    }

    if(descontoEl){
        descontoEl.innerText =
            desconto.toLocaleString("pt-BR",{
                style:"currency",
                currency:"BRL"
            });
    }

    document.getElementById("total").innerText =
        total.toLocaleString("pt-BR",{
            style:"currency",
            currency:"BRL"
        });

    const totalModal = document.getElementById("totalModal");

    if(totalModal){
        totalModal.innerText =
            total.toLocaleString("pt-BR",{
                style:"currency",
                currency:"BRL"
            });
    }

}

/* WHATS / PDF / IMAGEM (MANTIDO DO TEU ORIGINAL) */

function toggleMenu(){
    const menu = document.getElementById("menuWhats");
    menu.style.display = menu.style.display === "block" ? "none" : "block";
}

function mensagemWhats(){

    const moeda = valor =>
        Number(valor || 0).toLocaleString("pt-BR", {
            style:"currency",
            currency:"BRL"
        });

    let itensTexto = "";

    let subtotalWhats = 0;
    let descontoWhats = 0;
    let totalWhats = 0;

    (budget.itens || []).forEach(item => {

        const quantidade =
            Number(item.quantidade || 0);

        const valor =
            Number(item.valor || 0);

        const totalBruto =
            Number.isFinite(Number(item.total))
                ? Number(item.total)
                : quantidade * valor;

        const descontoItem =
            Number(item.desconto || 0);

        const totalLiquido =
            Math.max(
                0,
                totalBruto - descontoItem
            );

        subtotalWhats += totalBruto;
        descontoWhats += descontoItem;
        totalWhats += totalLiquido;

        itensTexto += `
• ${item.descricao || "Item"}
  Qtd: ${quantidade || 1}
  Valor: ${moeda(valor)}
  Bruto: ${moeda(totalBruto)}
  Desconto: ${moeda(descontoItem)}
  Líquido: ${moeda(totalLiquido)}
`;

    });

    const mensagem =
`Olá ${budget.cliente}

Segue orçamento Nº ${budget.numero}

*ITENS*
${itensTexto}
*RESUMO*
Subtotal: ${moeda(subtotalWhats)}
Descontos: ${moeda(descontoWhats)}
*Total Líquido: ${moeda(totalWhats)}*

Obrigado!`;

    return encodeURIComponent(mensagem);
}

function numeroCliente(){
    let numero = budget.telefone || "";
    numero = numero.replace(/\D/g,"");
    if(numero.startsWith("55")) numero = numero.substring(2);
    return numero;
}

async function gerarImagem(){
    const botoes = document.querySelector(".botoes");
    botoes.style.display="none";

    const canvas = await html2canvas(document.querySelector(".container"),{scale:2});
    botoes.style.display="flex";

    const link = document.createElement("a");
    link.download = `Orcamento-${budget.numero}.png`;
    link.href = canvas.toDataURL("image/png");
    link.click();
}
