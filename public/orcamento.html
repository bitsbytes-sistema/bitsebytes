<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Orçamento</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#f2f2f2;
}

.container{
    max-width:900px;
    margin:20px auto;
    background:white;
    padding:30px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #ddd;
    padding-bottom:20px;
}

.logo{
    display:flex;
    gap:10px;
    align-items:center;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th, td{
    border:1px solid #ddd;
    padding:10px;
}

th{
    background:#f3f3f3;
}

.total{
    text-align:right;
    font-size:20px;
    margin-top:20px;
    font-weight:bold;
}

.botoes{
    margin-top:30px;
    display:flex;
    gap:10px;
    justify-content:flex-end;
}

button{
    padding:10px 15px;
    border:none;
    cursor:pointer;
    border-radius:6px;
}

.print{ background:#2563eb; color:white; }
.back{ background:#ccc; }
.whats{ background:#25D366; color:white; }

@media print {
    .botoes{ display:none; }
}

</style>

</head>

<body>

<div class="container">

    <div class="header">

        <div class="logo">
            <img src="/logo.png" width="90">
            <div>
                <h3>Bits & Bytes Técnology®</h3>
                <h6>Sistemas e Assistencia Técnica</h6>
            </div>
        </div>

        <div>
            <b>Nº:</b> <span id="numero"></span>
        </div>

    </div>

    <h1>Orçamento</h1>

    <p><b>Cliente:</b> <span id="cliente"></span></p>
    <p><b>Status:</b> <span id="status"></span></p>

    <p><b>Observações:</b></p>

    <div id="observacoes"
        style="
        padding:12px;
        background:#f8f8f8;
        border:1px solid #ddd;
        border-radius:6px;
        margin-bottom:20px;
        white-space:pre-wrap;">
    </div>

    <table>
        <thead>
            <tr>
                <th>Descrição</th>
                <th>Qtd</th>
                <th>Valor</th>
                <th>Total</th>
            </tr>
        </thead>

        <tbody id="itens"></tbody>
    </table>

    <div class="total">
        Total: <span id="total"></span>
    </div>

    <div class="botoes">

        <button class="back" onclick="history.back()">Voltar</button>

        <button class="print" onclick="window.print()">Imprimir</button>

        <button onclick="gerarPDF()">📄 PDF</button>

        <button onclick="gerarImagem()">🖼 Imagem</button>

        <div style="position:relative;display:inline-block;">

            <button class="whats" onclick="toggleMenu()">
                💬 WhatsApp ▼
            </button>

            <div id="menuWhats"
                style="
                    display:none;
                    position:absolute;
                    right:0;
                    margin-top:5px;
                    background:white;
                    border:1px solid #ddd;
                    border-radius:8px;
                    box-shadow:0 3px 10px rgba(0,0,0,.2);
                    overflow:hidden;
                    z-index:999;
                    min-width:180px;
                ">

                <button style="width:100%;background:white;color:#333;text-align:left;padding:12px;border:none;"
                    onclick="enviarWhatsPDF()">
                    📄 Enviar PDF
                </button>

                <button style="width:100%;background:white;color:#333;text-align:left;padding:12px;border:none;"
                    onclick="enviarWhatsImagem()">
                    🖼 Enviar Imagem
                </button>

            </div>

        </div>

    </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>

const id = new URLSearchParams(window.location.search).get("id");

let budget = null;

/* ================= CARREGAR ================= */
async function carregar(){

    const res = await fetch("/api/budgets/" + id, {
        credentials:"include"
    });

    const data = await res.json();

    budget = data;

    if(!budget){
        alert("Orçamento não encontrado");
        return;
    }

    document.getElementById("numero").innerText = budget.numero;
    document.getElementById("cliente").innerText = budget.cliente;
    document.getElementById("status").innerText = budget.status;
    document.getElementById("observacoes").innerText = budget.observacoes || "-";

    document.getElementById("total").innerText =
        Number(budget.total || 0).toLocaleString("pt-BR", {
            style:"currency",
            currency:"BRL"
        });

    const tbody = document.getElementById("itens");
    tbody.innerHTML = "";

    (budget.itens || []).forEach(i => {

        tbody.innerHTML += `
            <tr>
                <td>${i.descricao}</td>
                <td>${i.quantidade}</td>
                <td>${Number(i.valor || 0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}</td>
                <td>${Number(i.total || 0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}</td>
            </tr>
        `;
    });
}

/* ================= IMAGEM ================= */
async function gerarImagem(){

    const botoes = document.querySelector(".botoes");
    botoes.style.display="none";

    const canvas = await html2canvas(document.querySelector(".container"),{
        scale:2,
        useCORS:true
    });

    botoes.style.display="flex";

    const link = document.createElement("a");
    link.download = `Orcamento-${budget.numero}.png`;
    link.href = canvas.toDataURL("image/png");
    link.click();
}

/* ================= PDF ================= */
async function gerarPDF(){

    const botoes = document.querySelector(".botoes");
    botoes.style.display="none";

    const canvas = await html2canvas(document.querySelector(".container"),{
        scale:2,
        useCORS:true
    });

    botoes.style.display="flex";

    const img = canvas.toDataURL("image/png");

    const { jsPDF } = window.jspdf;

    const pdf = new jsPDF({
        orientation:"portrait",
        unit:"mm",
        format:"a4"
    });

    const largura = 190;
    const altura = canvas.height * largura / canvas.width;

    pdf.addImage(img,"PNG",10,10,largura,altura);

    pdf.save(`Orcamento-${budget.numero}.pdf`);
}

/* ================= MENU ================= */
function toggleMenu(){

    const menu = document.getElementById("menuWhats");

    if(!menu) return;

    menu.style.display = (menu.style.display === "block") ? "none" : "block";
}

/* ================= WHATS ================= */
function mensagemWhats(){

    let msg = `Olá ${budget.cliente}!\n\n`;
    msg += `Segue o orçamento Nº ${budget.numero} da Bits & Bytes Técnology.\n\n`;
    msg += `Qualquer dúvida estamos à disposição.\n\n`;
    msg += `Obrigado pela preferência.`;

    return encodeURIComponent(msg);
}

function numeroCliente(){

    let numero = budget.telefone || "";

    numero = numero.replace(/\D/g,"");

    if(numero.startsWith("55")){
        numero = numero.substring(2);
    }

    if(numero.length < 10){
        alert("Cliente sem telefone.");
        return null;
    }

    return numero;
}

async function enviarWhatsPDF(){

    document.getElementById("menuWhats").style.display="none";

    await gerarPDF();

    const numero = numeroCliente();
    if(!numero) return;

    window.open(
        `https://wa.me/55${numero}?text=${mensagemWhats()}`,
        "_blank"
    );
}

async function enviarWhatsImagem(){

    document.getElementById("menuWhats").style.display="none";

    await gerarImagem();

    const numero = numeroCliente();
    if(!numero) return;

    window.open(
        `https://wa.me/55${numero}?text=${mensagemWhats()}`,
        "_blank"
    );
}

/* ================= FECHAR MENU FORA ================= */
window.onclick = function(e){

    const menu = document.getElementById("menuWhats");
    const btn = document.querySelector(".whats");

    if(!menu || !btn) return;

    if(!menu.contains(e.target) && !btn.contains(e.target)){
        menu.style.display = "none";
    }
}

/* ================= START ================= */
carregar();

</script>

</body>
</html>
