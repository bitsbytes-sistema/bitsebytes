      <table>

            <th>Cliente</th>

<script>

let orcamentos = [];

async function carregarUsuario(){

    const res = await fetch("/me", {
        credentials: "include"
    });

    if(res.status === 401){
        window.location.href = "/";
        return;
    }

    const data = await res.json();

    document.getElementById("nomeUsuario").innerText =
        data.user.username;

    document.getElementById("cargoUsuario").innerText =
        data.user.role;
}

async function load(){
  const res = await fetch(
    "/api/budgets?t=" + Date.now(),
    {
      credentials:"include",
      cache:"no-store"
    }
  );

  orcamentos = await res.json();

  render();

}

function render(){

  const lista = document.getElementById("lista");
  lista.innerHTML = "";

  if(!orcamentos.length){

    lista.innerHTML = `
      <tr>
        <td colspan="6" style="text-align:center;">
          Nenhum orçamento encontrado
        </td>
      </tr>
    `;

    return;

  }

  orcamentos.forEach(o => {
    const pago = o.pagamento === "pago";
    const cortesia = o.pagamento === "cortesia";
    const permuta = o.pagamento === "permuta";
    const reprovado = o.status === "reprovado";

    const valorPermuta =
        Number(o.valorPermuta || 0);

    const saldoRestante =
        Math.max(
            0,
            Number(o.total || 0) - valorPermuta
        );

    const permutaParcial =
        valorPermuta > 0 &&
        saldoRestante > 0 &&
        o.pagamento === "pendente";


    lista.innerHTML += `
        <tr>

            <td>${o.numero}</td>

            <td>${o.cliente}</td>

<td>
    ${(o.total || 0).toLocaleString("pt-BR", {
        style:"currency",
        currency:"BRL"
    })}
</td>

            <td>${o.status}</td>

            <td>

                ${
    reprovado
    ? `<span style="
        background:#64748b;
        color:white;
        padding:5px 10px;
        border-radius:20px;
        font-size:12px;
    ">➖ Não aplicável</span>`
    : pago
    ? `<span style="
        background:#16a34a;
        color:white;
        padding:5px 10px;
        border-radius:20px;
        font-size:12px;
    ">✅ Pago</span>`
    : cortesia
    ? `<span style="
        background:#7c3aed;
        color:white;
        padding:5px 10px;
        border-radius:20px;
        font-size:12px;
    ">🎁 Cortesia</span>`    : permuta
    ? `<span style="
        background:#0891b2;
        color:white;
        padding:5px 10px;
        border-radius:20px;
        font-size:12px;
    ">🔄 Permuta</span>`
    : permutaParcial
    ? `<div style="display:flex;flex-direction:column;gap:4px;">

        <span style="
            background:#0891b2;
            color:white;
            padding:5px 10px;
            border-radius:20px;
            font-size:12px;
            width:max-content;
        ">
            🔄 Permuta: ${valorPermuta.toLocaleString("pt-BR", {
                style:"currency",
                currency:"BRL"
            })}
        </span>

        <span style="
            background:#dc2626;
            color:white;
            padding:5px 10px;
            border-radius:20px;
            font-size:12px;
            width:max-content;
        ">
            💰 Saldo: ${saldoRestante.toLocaleString("pt-BR", {
                style:"currency",
                currency:"BRL"
            })}
        </span>

    </div>`
    : `<span style="
        background:#dc2626;
        color:white;
        padding:5px 10px;
        border-radius:20px;
        font-size:12px;
    ">❌ Pendente</span>`
}

            </td>

            <td>

                <button onclick="abrir('${o._id}')">
                    Abrir
                </button>

                <button onclick="pdf('${o._id}')">
                    📄 PDF
                </button>
                ${
                    o.status !== "convertido" && !o.ticketId
                    ? `
                        <button
                            style="background:#dc2626"
                            onclick="excluirOrcamento('${o._id}', '${o.numero}')">
                            🗑 Excluir
                        </button>
                    `
                    : ``
                }

                ${
    reprovado
    ? ``
    : (!pago && !cortesia && !permuta)
    ? `
        <button
            style="background:#16a34a"
            onclick="receber('${o._id}')">
            💰 Receber
        </button>

        <button
            style="background:#7c3aed"
            onclick="cortesia('${o._id}')">
            🎁 Cortesia
        </button>
        <button
            style="background:#0891b2"
            onclick="permuta('${o._id}')">
            ${permutaParcial ? "🔄 Alterar Permuta" : "🔄 Permuta"}
        </button>
    `
    : `
        <button
            style="background:#f59e0b"
            onclick="cancelarPagamento('${o._id}')">
            ↩ Cancelar
        </button>
    `
}

            </td>

        </tr>
    `;

});


}

async function excluirOrcamento(id, numero){

    if(
        !confirm(
            `Excluir o orçamento Nº ${numero}? Esta ação não pode ser desfeita.`
        )
    ){
        return;
    }


    const overlay = document.createElement("div");

    overlay.style.position = "fixed";
    overlay.style.inset = "0";
    overlay.style.background = "rgba(0,0,0,.60)";
    overlay.style.display = "flex";
    overlay.style.alignItems = "center";
    overlay.style.justifyContent = "center";
    overlay.style.zIndex = "99999";
    overlay.style.padding = "20px";


    const modal = document.createElement("div");

    modal.style.background = "#fff";
    modal.style.width = "100%";
    modal.style.maxWidth = "430px";
    modal.style.padding = "24px";
    modal.style.borderRadius = "12px";
    modal.style.boxShadow = "0 20px 50px rgba(0,0,0,.30)";


    const titulo = document.createElement("h3");

    titulo.textContent = "🔐 Autorização administrativa";
    titulo.style.marginTop = "0";


    const aviso = document.createElement("p");

    aviso.textContent =
        `Para excluir o orçamento Nº ${numero}, informe as credenciais de um administrador.`;

    aviso.style.marginBottom = "18px";


    const usuario = document.createElement("input");

    usuario.type = "text";
    usuario.placeholder = "Usuário do administrador";
    usuario.autocomplete = "username";
    usuario.style.width = "100%";
    usuario.style.padding = "11px";
    usuario.style.marginBottom = "12px";
    usuario.style.boxSizing = "border-box";


    const senha = document.createElement("input");

    senha.type = "password";
    senha.placeholder = "Senha do administrador";
    senha.autocomplete = "current-password";
    senha.style.width = "100%";
    senha.style.padding = "11px";
    senha.style.marginBottom = "18px";
    senha.style.boxSizing = "border-box";


    const botoes = document.createElement("div");

    botoes.style.display = "flex";
    botoes.style.gap = "10px";


    const cancelar = document.createElement("button");

    cancelar.type = "button";
    cancelar.textContent = "Cancelar";
    cancelar.style.flex = "1";
    cancelar.style.padding = "11px";


    const autorizar = document.createElement("button");

    autorizar.type = "button";
    autorizar.textContent = "Autorizar e excluir";
    autorizar.style.flex = "1";
    autorizar.style.padding = "11px";
    autorizar.style.background = "#dc2626";
    autorizar.style.color = "#fff";
    autorizar.style.border = "0";
    autorizar.style.borderRadius = "6px";


    cancelar.onclick = function(){

        senha.value = "";
        overlay.remove();

    };


    async function executarExclusao(){

        const adminUsername =
            usuario.value.trim();

        const adminPassword =
            senha.value;


        if(!adminUsername || !adminPassword){

            alert(
                "Informe o usuário e a senha do administrador."
            );

            return;
        }


        autorizar.disabled = true;
        cancelar.disabled = true;

        autorizar.textContent =
            "Autorizando...";


        try{

            const res = await fetch(
                "/api/budgets/" + id,
                {
                    method: "DELETE",

                    credentials: "include",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        adminUsername,
                        adminPassword
                    })
                }
            );


            const resultado =
                await res.json();


            senha.value = "";


            if(!res.ok){

                alert(
                    resultado.error ||
                    "Não foi possível excluir o orçamento."
                );

                autorizar.disabled = false;
                cancelar.disabled = false;

                autorizar.textContent =
                    "Autorizar e excluir";

                senha.focus();

                return;
            }


            overlay.remove();

            alert(
                resultado.message ||
                "Orçamento excluído com sucesso."
            );

            await load();

        }
        catch(err){

            senha.value = "";

            console.error(
                "Erro ao excluir orçamento:",
                err
            );

            alert(
                "Erro ao excluir orçamento."
            );

            autorizar.disabled = false;
            cancelar.disabled = false;

            autorizar.textContent =
                "Autorizar e excluir";

        }

    }


    autorizar.onclick =
        executarExclusao;


    senha.addEventListener(
        "keydown",
        function(event){

            if(event.key === "Enter"){
                executarExclusao();
            }

        }
    );


    botoes.appendChild(cancelar);
    botoes.appendChild(autorizar);

    modal.appendChild(titulo);
    modal.appendChild(aviso);
    modal.appendChild(usuario);
    modal.appendChild(senha);
    modal.appendChild(botoes);

    overlay.appendChild(modal);

    document.body.appendChild(overlay);

    usuario.focus();

}
function abrir(id){
  window.location.href = "/orcamento.html?id=" + id;
}

function pdf(id){

  window.open(
    "/api/budgets/" + id + "/pdf",
    "_blank"
  );

}

async function receber(id){

    const opcoes = [
        "1 - Dinheiro",
        "2 - PIX",
        "3 - Cartão de Débito",
        "4 - Cartão de Crédito",
        "5 - Transferência"
    ].join("\n");

    const escolha = prompt(
        "Selecione a forma de pagamento:\n\n" + opcoes
    );

    if(escolha === null)
        return;

    const formas = {
        "1": "Dinheiro",
        "2": "PIX",
        "3": "Cartão de Débito",
        "4": "Cartão de Crédito",
        "5": "Transferência"
    };

    const formaPagamento = formas[String(escolha).trim()];

    if(!formaPagamento){
        alert("Forma de pagamento inválida.");
        return;
    }

    if(!confirm(
        "Confirmar recebimento deste orçamento?\n\n" +
        "Forma de pagamento: " + formaPagamento
    )){
        return;
    }

    const res = await fetch(
        "/api/budgets/" + id + "/pagar",
        {
            method:"PUT",
            credentials:"include",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                formaPagamento
            })
        }
    );

    const json = await res.json();

    if(json.ok){

        load();

    }else{

        alert(json.error || "Erro.");

    }

}

async function cortesia(id){

    if(!confirm("Marcar este orçamento como cortesia?"))
        return;

    const res = await fetch(
        "/api/budgets/" + id + "/cortesia",
        {
            method: "PUT",
            credentials: "include"
        }
    );

    const json = await res.json();

    if(json.ok){

        load();

    }else{

        alert(json.error || "Erro ao marcar como cortesia.");

    }

}

async function permuta(id){

    const valorInformado = prompt(
        "Informe o valor do equipamento recebido na troca:"
    );

    if(valorInformado === null)
        return;

    const valorPermuta = Number(
        String(valorInformado)
            .replace(/\./g, "")
            .replace(",", ".")
    );

    if(
        !Number.isFinite(valorPermuta) ||
        valorPermuta <= 0
    ){
        alert("Informe um valor válido para a troca.");
        return;
    }

    const descricaoPermuta = prompt(
        "Descreva o equipamento recebido na troca:"
    );

    if(descricaoPermuta === null)
        return;

    if(!String(descricaoPermuta).trim()){
        alert("Informe qual equipamento foi recebido na troca.");
        return;
    }

    if(!confirm(
        "Confirmar permuta?\n\n" +
        "Equipamento: " + String(descricaoPermuta).trim() + "\n" +
        "Valor da troca: " +
        valorPermuta.toLocaleString("pt-BR", {
            style:"currency",
            currency:"BRL"
        })
    )){
        return;
    }

    const res = await fetch(
        "/api/budgets/" + id + "/permuta",
        {
            method:"PUT",
            credentials:"include",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                valorPermuta,
                descricaoPermuta:
                    String(descricaoPermuta).trim()
            })
        }
    );

    const json = await res.json();

    if(json.ok){

        const saldo =
            Number(json.saldoRestante || 0);

        if(saldo > 0){

            alert(
                "Permuta registrada com sucesso.\n\n" +
                "Saldo restante a receber: " +
                saldo.toLocaleString("pt-BR", {
                    style:"currency",
                    currency:"BRL"
                })
            );

        }else{

            alert(
                "Permuta registrada com sucesso.\n\n" +
                "O orçamento foi totalmente quitado pela troca."
            );

        }

        load();

    }else{

        alert(
            json.error ||
            "Erro ao registrar permuta."
        );

    }
}

    if(!confirm("Cancelar pagamento deste orçamento?")){

    }


    const overlay = document.createElement("div");

    overlay.style.position = "fixed";
    overlay.style.inset = "0";

    const cancelar = document.createElement("button");

    autorizar.type = "button";

        autorizar.textContent =

        try{

                {
                    method: "PUT",

                    credentials: "include",

                    headers: {

                    },

                    body: JSON.stringify({
                        adminUsername,
                        adminPassword

                }

                "Autorizar e cancelar";

        }

    }

        executarCancelamento;

    botoes.appendChild(cancelar);

    modal.appendChild(titulo);

async function logout(){
