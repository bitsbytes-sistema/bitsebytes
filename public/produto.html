<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<title>Bits & Bytes - Produto</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial;
    background:#f2f2f2;
}


/* ================= SIDEBAR ================= */

.sidebar{

    width:250px;
    background:#0f172a;
    min-height:100vh;
    color:white;
    position:fixed;
    left:0;
    top:0;

}


.logo{

    padding:20px;
    display:flex;
    gap:10px;
    align-items:center;
    border-bottom:1px solid rgba(255,255,255,.1);

}


.sidebar a{

    display:block;
    color:white;
    text-decoration:none;
    padding:14px 20px;

}


.sidebar a:hover{

    background:#1e293b;

}


.usuario{

    position:absolute;
    bottom:20px;
    left:20px;

}



/* ================= MAIN ================= */

.main{

    margin-left:250px;
    width:calc(100% - 250px);
    min-height:100vh;

}



/* ================= TOPBAR ================= */

.topbar{

    height:70px;
    background:white;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 30px;
    box-shadow:0 2px-10px rgba(0,0,0,.08);

}


.topbar a{

    color:#dc2626;
    text-decoration:none;
    font-weight:bold;

}



/* ================= CONTAINER ================= */


.container{

    padding:20px;

}



/* ================= CARD ================= */


.card{

    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
    margin-bottom:20px;

}



/* ================= FORM ================= */


label{

    font-weight:bold;
    display:block;
    margin-top:10px;

}


input,
select,
textarea{

    width:100%;
    padding:10px;
    margin-top:5px;
    border:1px solid #cbd5e1;
    border-radius:6px;

}



.grid{

    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;

}



button{

    padding:10px 15px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    color:white;
    background:#2563eb;

}


button:hover{

    opacity:.9;

}


.salvar{

    background:#16a34a;

}


.excluir{

    background:#dc2626;

}


.voltar{

    background:#64748b;

}


</style>

</head>


<body>


<div class="sidebar">


<div class="logo">

<img src="/logo.png" width="45">

<div>

<b>Bits & Bytes</b><br>

<small>Tecnology</small>

</div>

</div>


<a href="/dashboard.html">🏠 Dashboard</a>
<a href="/clientes.html">👥 Clientes</a>
<a href="/chamados.html">📋 Chamados</a>
<a href="/orcamentos.html">💰 Orçamentos</a>
<a href="/services.html">🛠 Peças e Serviços</a>
<a href="/laudos.html">📄 Laudos Técnicos</a>
<a href="/estoque.html">📦 Estoque</a>
<a href="#">💵 Financeiro</a>
<a href="#">📊 Relatórios</a>
<a href="#">⚙️ Configurações</a>



<div class="usuario">

<b id="nomeUsuario">
Carregando...
</b>

<br>

<small id="cargoUsuario"></small>

</div>


</div>



<div class="main">


<div class="topbar">

<div>
📦 Produto
</div>


<a href="javascript:void(0)" onclick="logout()">
Sair
</a>


</div>



<div class="container">


<div class="card">


<h2>
Detalhes do Produto
</h2>


<div class="grid">

<div>

<label>
Código
</label>

<input id="codigo">


</div>


<div>

<label>
Nome
</label>

<input id="nome">


</div>


</div>


<div class="grid">

<div>

<label>
Categoria
</label>

<input id="categoria">


</div>


<div>

<label>
Marca
</label>

<input id="marca">


</div>


</div>

<div class="grid">


<div>

<label>
Fornecedor
</label>

<input id="fornecedor">


</div>



<div>

<label>
Quantidade
</label>

<input 
id="quantidade"
type="number">


</div>


</div>



<div class="grid">


<div>

<label>
Preço de Custo
</label>

<input
id="custo"
type="number"
step="0.01">


</div>



<div>

<label>
Preço de Venda
</label>

<input
id="venda"
type="number"
step="0.01">


</div>


</div>



<label>
Estoque Mínimo
</label>

<input
id="estoqueMinimo"
type="number">



<label>
Observações
</label>

<textarea
id="observacoes"
rows="5">
</textarea>



<div style="
display:flex;
justify-content:flex-end;
gap:10px;
margin-top:20px;
">


<button 
class="voltar"
onclick="voltar()">

⬅ Voltar

</button>



<button
class="excluir"
onclick="excluirProduto()">

🗑 Excluir

</button>



<button
class="salvar"
onclick="salvarProduto()">

💾 Salvar

</button>


</div>



</div>


</div>


</div>



<script>


const id =
new URLSearchParams(window.location.search)
.get("id");


let produto = null;



/* ================= USUÁRIO ================= */


async function carregarUsuario(){


const res = await fetch("/me",{
credentials:"include"
});


if(res.status === 401){

location.href="/";

return;

}


const data = await res.json();


document.getElementById("nomeUsuario").innerText =
data.user.username;


document.getElementById("cargoUsuario").innerText =
data.user.role;


}



/* ================= CARREGAR PRODUTO ================= */


async function carregarProduto(){


const res = await fetch(
"/api/products/"+id,
{
credentials:"include"
}
);


produto = await res.json();



document.getElementById("codigo").value =
produto.codigo || "";


document.getElementById("nome").value =
produto.nome || "";


document.getElementById("categoria").value =
produto.categoria || "";


document.getElementById("marca").value =
produto.marca || "";


document.getElementById("fornecedor").value =
produto.fornecedor || "";


document.getElementById("quantidade").value =
produto.quantidade || 0;


document.getElementById("custo").value =
produto.custo || 0;


document.getElementById("venda").value =
produto.venda || 0;


document.getElementById("estoqueMinimo").value =
produto.estoqueMinimo || 0;


document.getElementById("observacoes").value =
produto.observacoes || "";



}



/* ================= SALVAR ================= */


async function salvarProduto(){


const dados = {


codigo:
document.getElementById("codigo").value,


nome:
document.getElementById("nome").value,


categoria:
document.getElementById("categoria").value,


marca:
document.getElementById("marca").value,


fornecedor:
document.getElementById("fornecedor").value,


quantidade:
Number(
document.getElementById("quantidade").value
),


custo:
Number(
document.getElementById("custo").value
),


venda:
Number(
document.getElementById("venda").value
),


estoqueMinimo:
Number(
document.getElementById("estoqueMinimo").value
),


observacoes:
document.getElementById("observacoes").value


};



const res = await fetch(
"/api/products/"+id,
{

method:"PUT",

headers:{
"Content-Type":"application/json"
},

credentials:"include",

body:JSON.stringify(dados)

}
);



const data = await res.json();



if(data.ok){


alert("Produto atualizado!");


location.reload();


}else{


alert(
data.error ||
"Erro ao atualizar produto."
);


}



}



/* ================= EXCLUIR ================= */


async function excluirProduto(){


if(!confirm("Deseja excluir este produto?"))
return;



const res = await fetch(
"/api/products/"+id,
{

method:"DELETE",

credentials:"include"

}
);



const data = await res.json();



if(data.ok){


alert("Produto excluído!");


location.href="/estoque.html";


}else{


alert(
data.error ||
"Erro ao excluir."
);


}



}



/* ================= VOLTAR ================= */


function voltar(){

location.href="/estoque.html";

}



/* ================= INIT ================= */


window.onload=()=>{

carregarUsuario();

carregarProduto();

};


</script>


</body>

</html>
