<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Orçamento</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#f2f2f2;
}

.container{
    max-width:900px;
    margin:20px auto;
    background:white;
    padding:30px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #ddd;
    padding-bottom:20px;
}

.logo{
    display:flex;
    gap:10px;
    align-items:center;
}

h2{
    margin:0;
}

.info{
    margin-top:20px;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th, td{
    border:1px solid #ddd;
    padding:10px;
    text-align:left;
}

th{
    background:#f3f3f3;
}

.total{
    text-align:right;
    font-size:20px;
    margin-top:20px;
    font-weight:bold;
}

.botoes{
    margin-top:30px;
    display:flex;
    gap:10px;
    justify-content:flex-end;
}

button{
    padding:10px 15px;
    border:none;
    cursor:pointer;
    border-radius:6px;
}

.print{
    background:#2563eb;
    color:white;
}

.back{
    background:#ccc;
}

.whats{
    background:#25D366;
    color:white;
}

@media print {
    .botoes{
        display:none;
    }
    body{
        background:white;
    }
    .container{
        box-shadow:none;
        margin:0;
    }
}

</style>

</head>

<body>

<div class="container">

    <div class="header">

        <div class="logo">
            <img src="/logo.png" width="80">
            <div>
                <h2>Bits & Bytes Técnology</h2>
                <small>Sistemas e Assistência Técnica</small>
            </div>
        </div>

        <div>
            <b>Orçamento Nº:</b> <span id="numero"></span>
        </div>

    </div>

    <div class="info">

        <p><b>Cliente:</b> <span id="cliente"></span></p>
        <p><b>Status:</b> <span id="status"></span></p>

    </div>

    <table>
        <thead>
            <tr>
                <th>Descrição</th>
                <th>Qtd</th>
                <th>Valor</th>
                <th>Total</th>
            </tr>
        </thead>

        <tbody id="itens"></tbody>
    </table>

    <div class="total">
        Total: <span id="total"></span>
    </div>

    <div class="botoes">

        <button class="back" onclick="history.back()">Voltar</button>
        <button class="print" onclick="window.print()">Imprimir</button>
        <button class="whats" onclick="enviarWhats()">WhatsApp</button>

    </div>

</div>

<script>

const id = new URLSearchParams(window.location.search).get("id");

async function carregar(){

    try{

        const res = await fetch("/api/budgets/" + id, {
            credentials:"include"
        });

        const data = await res.json();

        if(!data){
            alert("Orçamento não encontrado");
            return;
        }

        window.b = data;

        document.getElementById("numero").innerText = b.numero || "";
        document.getElementById("cliente").innerText = b.cliente || "";
        document.getElementById("status").innerText = b.status || "";

        document.getElementById("total").innerText = Number(b.total || 0)
        .toLocaleString("pt-BR", {
            style: "currency",
            currency: "BRL"
        });

        const tbody = document.getElementById("itens");
        tbody.innerHTML = "";

        (b.itens || []).forEach(i => {

            tbody.innerHTML += `
                <tr>
                    <td>${i.descricao}</td>
                    <td>${i.quantidade}</td>
                    <td>${Number(i.valor || 0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}</td>
                    <td>${Number(i.total || 0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}</td>
                </tr>
            `;

        });

    }catch(err){
        console.log(err);
        alert("Erro ao carregar orçamento");
    }

}

function enviarWhats(){

    if(!b){
        alert("Orçamento não carregado ainda");
        return;
    }

    let numero = b.telefone || b.clienteTelefone || "";

    if(!numero){
        alert("Cliente sem telefone cadastrado");
        return;
    }

    // limpa número (remove tudo que não for dígito)
    numero = numero.replace(/\D/g, "");

    // remove 55 se já tiver
    if(numero.startsWith("55")){
        numero = numero.substring(2);
    }

    let msg = `Bits & Bytes Assistência Técnica\n\n`;
    msg += `ORÇAMENTO Nº: ${b.numero}\n`;
    msg += `CLIENTE: ${b.cliente}\n`;
    msg += `STATUS: ${b.status}\n\n`;

    msg += `ITENS:\n`;

    (b.itens || []).forEach(i => {
        msg += `- ${i.descricao} | Qtd: ${i.quantidade} | R$ ${Number(i.total || 0).toFixed(2)}\n`;
    });

    msg += `\nTOTAL: R$ ${Number(b.total || 0).toFixed(2)}\n\n`;
    msg += `Obrigado pela preferência!`;

    const url = `https://wa.me/55${numero}?text=${encodeURIComponent(msg)}`;

    window.open(url, "_blank");
}

carregar();

</script>

</body>
</html>
